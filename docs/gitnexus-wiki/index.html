var PAGES = {"ai-llm-services-app":"# AI & LLM Services — app\n\nAI & LLM Services — app\n\nPurpose:  \nServe LLM completions, generate embeddings, and manage RAG workflows. Offloads heavy tasks to async workers. Enforces auth, rate limits, cost tracking.  \n\nKey components:  \n\n1. API Endpoints (`/api/v1/ai/`)  \n   - `/chat` — sync/stream LLM chat (GPT, Claude, local)  \n   - `/rag_chat` — RAG: retrieve docs → augment prompt → stream LLM  \n   - `/embeddings` — generate vector embeddings (SentenceTransformer)  \n\n2. Services  \n   - `LLMService` — routes requests to providers (OpenAI, Anthropic, Local)  \n   - `VectorService` — wraps embedding model + vector store (Chroma/PGVector)  \n   - `VectorStore` — abstract DB interface (Chroma, PGVector impls)  \n   - `LLMProvider` — ABC for provider adapters (mocked, not production-ready)  \n\n3. Workers (Dramatiq)  \n   - `generate_embedding` — single text → vector  \n   - `generate_batch_embeddings` — batch text → vectors  \n   - `generate_llm_completion` — single LLM call  \n   - `generate_batch_llm_completions` — batch LLM calls  \n   - `health_check_all` — verify LLM + vector store health  \n\n4. Middleware  \n   - `CostTrackingMiddleware` — logs AI endpoint usage (stub)  \n   - `RateLimitingMiddleware` — 60 req/min per user (in-memory, not shared)  \n\n5. Factory & Config  \n   - `get_vector_store()` — singleton: picks Chroma or PGVector from `settings.VECTOR_STORE`  \n   - `ModelRegistry` — SQL table for tracking deployed models (unused in code)  \n\nFlow:  \n```mermaid\ngraph LR\nA[Client] --> B[/api/v1/ai/chat]\nB --> C[LLMService.generate]\nC --> D[get_provider]\nD --> E[OpenAIProvider]\nE --> F[OpenAI API]\nB --> G[RateLimitingMiddleware]\nB --> H[CostTrackingMiddleware]\nB --> I[get_current_user]\nA --> J[/api/v1/ai/rag_chat]\nJ --> K[retrieve(query)]\nK --> L[get_vector_store()]\nL --> M[Chroma/PGVector.search]\nM --> N[Return docs]\nJ --> O[LLMService.generate_with_rag]\nO --> P[Format context + prompt]\nP --> C\nA --> Q[/api/v1/ai/embeddings]\nQ --> R[VectorService.generate_embedding]\nR --> S[SentenceTransformer.encode]\nQ --> T[Dramatiq: generate_embedding] -- async --\n```\n\nConnections:  \n- `retrieve()` from `llm/rag/retriever.py` → `get_vector_store()` → `ChromaVectorStore.search()`  \n- `ingestion_service.py` → `add_documents()` → vector store  \n- `chat.py` → `get_llm_service()` → registers mock providers (replace with env keys)  \n\nCritical gaps:  \n- Mock providers only. No real API keys.  \n- Rate limiter is in-memory. Not cluster-safe.  \n- Cost tracking is print(). No DB or billing.  \n- `ModelRegistry` defined but never used.  \n\nFix:  \nReplace mock keys with `os.getenv(\"OPENAI_API_KEY\")`.  \nUse Redis for rate limiting.  \nLog token usage to DB.  \n\nSkipped:  \n- Async DB sessions in `VectorService` (uses sync `SentenceTransformer`) → ponytail: switch to `sentence-transformers` async fork if latency critical.  \n- Caching embeddings → ponytail: add Redis cache if same texts re-embedded.  \n- Model versioning → ponytail: wire `ModelRegistry` to `LLMService` if multi-version routing needed.  \n\nNo tests for workers. Add `test_dramatiq_actors.py` if reliability matters.","ai-llm-services-docs":"# AI & LLM Services — docs\n\nAI & LLM Services — docs\n\nThis module exposes two services: `LLMService` and `VectorService`. No internal calls. No external calls. No execution flow. No dependencies.\n\n`LLMService` — wraps an LLM. Does nothing in code. No method bodies. No config. No model loading.  \n`VectorService` — declares `generate_embedding`, `store_embedding`, `search`. No implementation. No DB. No vector store. No embeddings generated.\n\nBoth are stubs. No-op interfaces. No side effects. No state.\n\n→ skipped: actual LLM client, vector store, embedding engine  \n→ add when: system needs real inference or retrieval\n\nNo diagram. Nothing to connect.","ai-llm-services-openwiki":"# AI & LLM Services — openwiki\n\n# AI & LLM Services — openwiki\n\n## Purpose\n\nRAG pipeline and LLM orchestration for Omnisight platform. Handles document ingestion, embedding generation, vector search, and grounded response generation.\n\n## Architecture\n\n```mermaid\nflowchart TD\n    Doc[Documents PDF/TXT] --> Loader[Document Loader]\n    Loader --> Splitter[Text Splitter]\n    Splitter --> Embedder[Embedding Generator]\n    Embedder --> VStore[Vector Store Abstraction]\n    \n    Query[User Query] --> QEmbedder[Embedding Generator]\n    QEmbedder --> Retriever[Retrieval Service]\n    Retriever --> VStore\n    VStore -->|context| Integrator[LLM Integrator]\n    Integrator -->|grounded prompt| LLM[LLM Service]\n    LLM --> Response[Generated Response]\n```\n\n## Core Components\n\n### Document Ingestion\n- **Loaders**: LangChain loaders for PDF/TXT extraction\n- **Splitter**: `RecursiveCharacterTextSplitter` — 1000 char chunks, 200 char overlap\n- **Rationale**: Overlap preserves semantic continuity across chunks\n\n### Embedding Generation\n- **Model**: `all-MiniLM-L6-v2` (Sentence-Transformer)\n- **Dimension**: 384\n- **Performance**: Real-time document processing speed\n\n### Vector Store Abstraction\n```python\n# backend/app/modules/llm/rag/vector_store.py\nclass VectorStore(ABC):\n    @abstractmethod\n    def add(self, texts: List[str], metadatas: List[Dict]): ...\n    \n    @abstractmethod\n    def search(self, query: str, k: int = 5): ...\n```\nSwappable implementations via interface.\n\n### Retrieval & Similarity Search\n- **Metric**: Cosine distance\n- **Index**: HNSW for sub-linear search\n- **Filtering**: Metadata filters (user, date, category)\n\n### LLM Integration\n- **Prompt Orchestration**: Dynamic construction — system instructions + retrieved context + user query\n- **Streaming**: Token-based streaming responses\n\n## Design Decisions\n\n### Decision 1: Hybrid Vector Database\n| Environment | Database | Reason |\n|-------------|----------|--------|\n| Local Dev | ChromaDB | Zero infrastructure, file-based |\n| Production | PGVector | ACID compliant, existing PostgreSQL infra |\n\n### Decision 2: Multi-Provider LLM Orchestration\n- **Providers**: OpenAI, Anthropic, Local\n- **Pattern**: Registry mapping model names → LLM configs\n- **Benefit**: No vendor lock-in, fallback support\n\n### Decision 3: Rate Limiting & Budget Protection\n- **Implementation**: Middleware throttling LLM requests\n- **Context**: LLM inference expensive, high latency\n- **Benefit**: Protect resources and budget\n\n## Performance Optimization\n\n### HNSW Index\n```sql\nCREATE INDEX idx_documents_embedding_hnsw ON documents \nUSING hnsw (embedding vector_cosine_ops) \nWITH (m = 16, ef_construction = 64);\n```\n**Impact**: $O(N)$ → $O(\\log N)$, sub-second retrieval at millions of documents\n\n### Embedding Caching\n1. **Hash-based**: Store embeddings keyed by text hash\n2. **Metadata-aware**: Skip unchanged documents during ingestion\n\n## MLflow Integration\nTracks pipeline performance:\n- **Parameters**: Chunk size, overlap, model version\n- **Metrics**: Retrieval precision, generation latency, token usage\n- **Reproducibility**: Versioned pipeline configs\n\n## Future Enhancements\n1. **Hybrid Search**: Vector + BM25 keyword search\n2. **Re-ranking**: Cross-encoder second stage\n3. **Advanced RAG**: Multi-query, Sub-query, HyDE strategies\n4. **Local Fine-tuning**: Domain-specific model tuning\n\n## Code References\n- Vector store interface: `backend/app/modules/llm/rag/vector_store.py`\n- Document loaders: LangChain-based\n- Text splitter: `RecursiveCharacterTextSplitter`\n- Embedding model: `all-MiniLM-L6-v2`","ai-llm-services-site":"# AI & LLM Services — site\n\n# AI & LLM Services Module\n\nProvides model routing, text embedding generation, and vector store indexing for RAG workflows.\n\n```mermaid\ngraph TD\n    Client[Caller / API Layer]\n    LLM[LLMService]\n    Vec[VectorService]\n    ST[SentenceTransformer]\n    VS[(Vector Store)]\n\n    Client -->|Route query| LLM\n    Client -->|Embed / Store / Search| Vec\n    Vec -->|encode text| ST\n    Vec -->|add / query docs| VS\n```\n\n---\n\n## LLM Service\n\nLocation: `app/modules/ai/services/llm_service.py`  \nClass: `app.modules.ai.services.llm_service.LLMService`\n\nCentral orchestrator for LLM operations. Routes requests across registered providers by name.\n\n### State\n- `self.providers`: `dict` mapping provider names (`str`) to `LLMProvider` instances.\n\n### Methods\n\n#### `register_provider(name: str, provider: LLMProvider) -> None`\nRegisters LLM backend instance.\n\n- `name`: Provider identifier string (e.g. `\"openai\"`).\n- `provider`: Object implementing `LLMProvider` interface.\n\n```python\nservice = LLMService()\nservice.register_provider(\"openai\", OpenAILogicProvider())\n```\n\n---\n\n## Vector Service\n\nLocation: `app/modules/ai/services/vector_service.py`  \nClass: `app.modules.ai.services.vector_service.VectorService`\n\nHandles local text vectorization and downstream vector store operations.\n\n### Initialization\n\n```python\nVectorService(model_name: str = \"all-MiniLM-L6-v2\")\n```\nLoads `SentenceTransformer(model_name)` into `self._model`.\n\n### Methods\n\n#### `async generate_embedding(text: str, model: str = \"all-MiniLM-L6-v2\") -> list[float]`\nEncodes raw text to vector float array using local `SentenceTransformer`.\n\n- `text`: Input text string.\n- `model`: Model identifier. Default: `\"all-MiniLM-L6-v2\"`. Reserved for future multi-model routing.\n- Returns: `list[float]` embedding vector.\n\n#### `async store_embedding(id: str, text: str, embedding: list[float], metadata: dict | None = None) -> None`\nPersists document and vector to store.\n\n- Calls `get_vector_store().add_documents(...)`.\n- Document payload structure:\n  ```python\n  [{\"id\": id, \"document\": text, \"embedding\": embedding, \"metadata\": metadata}]\n  ```\n\n#### `async search(query_embedding: list[float], limit: int = 10) -> list`\nPerforms nearest-neighbor search in vector store.\n\n- Calls `get_vector_store().search(query_embedding, limit)`.\n- Returns: `list` of matching document objects ordered by similarity.\n\n---\n\n## External Integration Points\n\n- `SentenceTransformer`: Model inference backend for embedding generation.\n- `get_vector_store()`: Global factory providing active vector database client for insertion and query.","ai-llm-services-tests":"# AI & LLM Services — tests\n\n# AI & LLM Services — Tests Module\n\n## Purpose\n\nUnit tests for vector store implementations used by AI/LLM services. Covers `ChromaVectorStore`, `PGVectorStore`, `VectorStore` interface, and factory pattern.\n\n## Key Components\n\n### Test Files\n\n| File | Tests |\n|------|-------|\n| `test_chroma_vector_store.py` | ChromaDB vector store operations |\n| `test_pgvector_store.py` | PostgreSQL vector store operations |\n| `test_vector_store_factory.py` | Factory pattern for store selection |\n| `test_vector_store_interface.py` | Interface contract validation |\n\n### Test Classes\n\n- `TestChromaVectorStore` - Tests ChromaDB integration\n- `TestPGVectorStore` - Tests PostgreSQL vector store\n- `TestVectorStoreFactory` - Tests factory singleton pattern\n- `MockVectorStore` - Interface implementation for contract testing\n\n## How It Works\n\n### ChromaVectorStore Tests\n\nMocks `chromadb.PersistentClient`, tests:\n- `add_documents()` - Document insertion\n- `search()` - Vector similarity search with metadata filtering\n- `delete()` - Document removal\n- `health_check()` - Connection validation\n\n### PGVectorStore Tests\n\nMocks SQLAlchemy async session, tests:\n- `add_documents()` - Document insertion via ORM\n- `search()` - SQL vector similarity queries\n- `health_check()` - Database connectivity\n\n### VectorStoreFactory Tests\n\nTests singleton factory pattern:\n- Default store selection (chroma)\n- Explicit store selection (chroma/pgvector)\n- Error handling for unknown store types\n- Instance caching (same instance returned)\n\n### Interface Contract Tests\n\nValidates `VectorStore` abstract base class contract through `MockVectorStore` implementation.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[tests] --> B[ChromaVectorStore]\n    A --> C[PGVectorStore]\n    A --> D[VectorStoreFactory]\n    A --> E[VectorStore Interface]\n    B --> F[chromadb]\n    C --> G[PostgreSQL]\n    D --> B\n    D --> C\n```\n\n## Execution Flow\n\n1. Factory tests call `get_vector_store()` → returns cached or new store instance\n2. Store tests mock external dependencies (chromadb, SQLAlchemy)\n3. Interface tests validate contract compliance via `MockVectorStore`\n\n## Running Tests\n\n```bash\npytest backend/tests/unit/test_chroma_vector_store.py -v\npytest backend/tests/unit/test_pgvector_store.py -v\npytest backend/tests/unit/test_vector_store_factory.py -v\npytest backend/tests/unit/test_vector_store_interface.py -v\n```","ai-llm-services":"# AI & LLM Services\n\n# AI & LLM Services\n\n## Purpose\n\nUnified LLM orchestration, embedding generation, and RAG pipeline for Omnisight. Routes requests across providers (OpenAI, Anthropic, local), manages vector stores (Chroma, PGVector), executes async via Dramatiq workers.\n\n## Sub-Modules\n\n| Module | Role |\n|--------|------|\n| [app](app.md) | API endpoints (`/chat`, `/rag_chat`, `/embeddings`), core services (`LLMService`, `VectorService`, `VectorStore`, `LLMProvider`) |\n| [openwiki](openwiki.md) | RAG pipeline: document ingestion → split → embed → store → retrieve → grounded generation |\n| [site](site.md) | Architecture reference, `LLMService` class docs, provider routing diagram |\n| [tests](tests.md) | Vector store contract tests (Chroma, PGVector, factory, interface) |\n| [docs](docs.md) | Stub interfaces — no implementation |\n\n## Key Workflows\n\n### Chat Completion (sync/stream)\n```\nClient → /api/v1/ai/chat → LLMService.generate() → LLMProvider → stream response\n```\nProvider selected by name via `LLMService.get_provider()`.\n\n### RAG Chat\n```\nClient → /api/v1/ai/rag_chat → LLMService.generate_with_rag()\n  → VectorService.search() → VectorStore.search() → context\n  → format_context_for_llm() → LLMProvider.generate_stream() → response\n```\n\n### Embedding Generation\n```\nClient → /api/v1/ai/embeddings → VectorService.generate_embedding()\n  → SentenceTransformer.encode() → vector\n```\nAsync batch via Dramatiq: `generate_batch_embeddings` actor.\n\n### Document Ingestion (openwiki)\n```\nPDF/TXT → DocumentLoader → TextSplitter → EmbeddingGenerator → VectorStore.add_documents()\n```\n\n## Architecture\n\n```mermaid\nflowchart TD\n    API[API Layer<br/>/app/api/chat.py] --> LLM[LLMService]\n    API --> Vec[VectorService]\n    \n    LLM --> Prov[LLMProvider<br/>OpenAI / Anthropic / Local]\n    LLM -->|RAG| Vec\n    \n    Vec --> ST[SentenceTransformer]\n    Vec --> VS[VectorStore<br/>Chroma / PGVector]\n    \n    Worker[Dramatiq Actors] --> LLM\n    Worker --> Vec\n    \n    Ingest[Document Ingestion<br/>openwiki] --> Vec\n```\n\n## Cross-Module Calls\n\n| Caller | Callee | Purpose |\n|--------|--------|---------|\n| `rag_chat_completion` (api) | `generate_with_rag` (llm_service) | Grounded generation |\n| `generate_rag_stream` (api) | `stream_chat_with_rag` (llm_service) | Streaming RAG |\n| `VectorService.store_embedding` | `get_vector_store` (factory) | Store selection |\n| Dramatiq actors | `LLMService.generate`, `VectorService.generate_embedding` | Async offload |\n\n## Testing\n\n- `tests/` validates `VectorStore` interface contract across Chroma/PGVector\n- Factory singleton pattern tested\n- LLM provider registration tested via `test_llm_service_providers`\n\n## Gaps\n\n- `docs/` stubs only — real implementations in `app/services/`\n- `src/` undocumented\n- `LLMProvider` adapters mocked, not production-ready","api-routing-versioning-app":"# API Routing & Versioning — app\n\n\n\n# API Routing & Versioning\n\n## Overview\nCentralized routing layer for all HTTP endpoints. Provides versioned API prefixes (`/v1`, `/v2`), registers module‑specific routers, and supplies authentication dependencies.\n\n## Components\n\n### Version Enumeration (`app/api/versioning.py`)\n- `APIVersion` – string enum with `V1 = \"v1\"`, `V2 = \"v2\"`.\n- `DEFAULT_VERSION` – `APIVersion.V1`.\n- `get_version_from_path(path)` – extracts version from URL segment `/vX/`.\n- `fallback_version(version)` – returns `V1` for `V2`, otherwise `None`.\n\n### Router Registry (`app/api/version_router.py`)\n- `AVAILABLE_VERSIONS: dict[str, APIRouter]` – maps version string to its router.\n- `register_version(version, router)` – stores router for a version.\n- `get_router_for_version(version)` – returns router for version, falling back via `fallback_version` if direct lookup fails.\n\n### Main Router (`app/api/router.py`)\n- `api_router` – top‑level `APIRouter` mounted on the FastAPI app.\n- `v1_router`, `v2_router` – version‑specific routers.\n- **v1 routes** include:\n  - `/health` → `health_router`\n  - `/system/config` → `system_config_router`\n  - `/auth` → `auth_router`\n  - `/admin` → `admin_status_router`, `admin_logs_router`\n  - `/dashboard` → `dashboard_router`\n  - `/users` → `user_router`\n  - `/ai` → `ai_router`\n- **v2 routes** include:\n  - `/health`, `/auth`, `/admin`, `/dashboard`, `/users`, `/ai` (same routers, different version prefix).\n- Both version routers are registered with `register_version`.\n- `api_router` includes each version router under its prefix:\n  ```python\n  api_router.include_router(get_router_for_version(APIVersion.V1), prefix=\"/v1\")\n  api_router.include_router(get_router_for_version(APIVersion.V2), prefix=\"/v2\")\n  ```\n\n### Authentication Dependencies (`app/api/v1/deps.py`)\n- `extract_token_from_request(request)` – retrieves JWT from `Authorization: Bearer` header or `access_token` cookie. Prefers header.\n- `get_current_user(request, db)` – validates token via `verify_token`, loads `User` from DB. Raises `401` on failure.\n- `get_admin_user(user)` – ensures user has an `admin` role, otherwise raises `403`.\n\nThese dependencies are reused across all versioned endpoints.\n\n## Request Flow\n1. Client sends HTTP request to `/vX/...`.\n2. FastAPI routes request to `api_router`.\n3. Router selects version router based on path prefix (`/v1` or `/v2`).\n4. Version router dispatches to included sub‑router (e.g., `auth_router`).\n5. Endpoint executes, invoking dependencies such as `get_current_user` or `get_admin_user`.\n\n## Version Fallback\nIf a request targets a version not directly registered, `get_router_for_version` consults `fallback_version`. For example, an unknown version `v3` would receive the `v1` router, ensuring backward compatibility.\n\n## Extensibility\n- Add new version: extend `APIVersion` enum, create a new `APIRouter`, include desired sub‑routers, call `register_version`.\n- Introduce version‑specific behavior: define separate routers per version; common routers can be shared.\n- Modify fallback logic: edit `fallback_version` to implement custom downgrade rules.\n\n## Integration with Modules\n- **System**: `/system/config` (v1 only).\n- **Auth**: `/auth` (both versions).\n- **Admin**: `/admin/status`, `/admin/logs` (both versions).\n- **Dashboard**: `/dashboard` (both versions).\n- **Users**: `/users` (both versions).\n- **AI**: `/ai` (both versions).\n- **Health**: `/health` (both versions).\n\nAll module routers are imported in `router.py` and attached to the appropriate version router.\n\n## Diagram\n```mermaid\ngraph LR\n    A[Client] --> B[FastAPI]\n    B --> C[api_router]\n    C --> D{Version from path}\n    D --> E[v1_router]\n    D --> F[v2_router]\n    E --> G[Sub-routers<br/>/health, /auth, /admin, /dashboard, /users, /ai, /system/config]\n    F --> H[Sub-routers<br/>/health, /auth, /admin, /dashboard, /users, /ai]\n```\n\n## Testing\n- `app/api/v1/test_auth_bearer.py` – covers `extract_token_from_request` edge cases.\n- `system/tests/test_bearer_auth.py` – validates `get_current_user` with Bearer token and cookie.\n- End‑to‑end tests exercise version routing and fallback.","api-routing-versioning-docs":"# API Routing & Versioning — docs\n\nAPI routing and versioning enforces strict versioned endpoints under `/api/v1` and `/api/v2`. All routes are auto-generated from FastAPI decorators. No manual routing code exists.\n\n`/api/health` (root) is deprecated. Use `/api/v1/health` or `/api/v2/health`. All other endpoints are versioned. V1 and V2 share identical schemas and behavior. V2 is reserved for breaking changes.\n\nAuthentication: Bearer token required for all non-`/health` and non-`/metrics` endpoints. Admin routes (`/admin/*`) enforce admin role via dependency.\n\nError format: `{\"detail\": \"...\", \"error_code\": \"ERROR_CODE\"}`. Consistent across all endpoints.\n\nRate limiting: Applied to `/ai/*` endpoints. Configured in FastAPI middleware. No config exposed in docs.\n\nInteractive docs: `/docs` (Swagger), `/redoc` (ReDoc). Auto-generated from OpenAPI spec. Spec updated on merge via `scripts/update_openapi.py`. Do not edit `openapi.json` manually.\n\nAdmin endpoints: `/admin/system-info`, `/admin/logs` require admin role. Logs accept `tail=N` query param.\n\nMetrics: `/metrics` serves Prometheus metrics. No auth. Exposed for monitoring.\n\nSchemas: Reused between v1/v2. `ChatRequest`, `RAGQueryRequest`, `EmbeddingRequest`, `UserOut`, `DashboardStats`, `RealtimeDataPoint` defined in OpenAPI. No code duplication.\n\nMermaid:\n\n```mermaid\ngraph LR\n  Client -->|GET/POST| api_v1_health[\"/api/v1/health\"]\n  Client -->|GET/POST| api_v2_health[\"/api/v2/health\"]\n  Client -->|Bearer Token| api_v1_auth[\"/api/v1/auth/\"]*\n  Client -->|Bearer Token| api_v2_auth[\"/api/v2/auth/\"]*\n  Client -->|Bearer Token| api_v1_ai[\"/api/v1/ai/\"]*\n  Client -->|Bearer Token| api_v2_ai[\"/api/v2/ai/\"]*\n  Client -->|Bearer Token + Admin| api_v1_admin[\"/api/v1/admin/\"]*\n  Client -->|Bearer Token + Admin| api_v2_admin[\"/api/v2/admin/\"]*\n  Client -->|GET| metrics[\"/metrics\"]\n  Client -->|GET| docs[\"/docs\"]\n  Client -->|GET| redoc[\"/redoc\"]\n  api_v1[\"/api/v1/\"]* --> FastAPI[FastAPI Router]\n  api_v2[\"/api/v2/\"]* --> FastAPI\n  FastAPI --> OpenAPI[OpenAPI Spec]\n  OpenAPI --> docs[\"/docs\"]\n  OpenAPI --> redoc[\"/redoc\"]\n```\n\n`ponytail:` V3 will require code changes. Current versioning is string-based. No migration path for clients. Add when breaking changes are needed.","api-routing-versioning-openwiki":"# API Routing & Versioning — openwiki\n\n# API Routing & Versioning — openwiki\n\n## Purpose\n\nAPI Routing & Versioning module provides structured endpoint management with path-based versioning strategy. Enables backward compatibility, clear API evolution, and consistent request handling across versions.\n\n## Architecture\n\n### Versioning Strategy\n\nPath-based versioning implemented via FastAPI routers:\n\n```\n/v1/* → APIVersion.V1\n/v2/* → APIVersion.V2\n```\n\n### Core Components\n\n**APIVersion Enum** (`backend/app/api/versioning.py`)\n```python\nclass APIVersion(str, Enum):\n    V1 = \"v1\"\n    V2 = \"v2\"\n```\n\n**Router Registration**\n```python\nregister_version(APIVersion.V1, v1_router)\nregister_version(APIVersion.V2, v2_router)\n```\n\n**Versioned Router Inclusion**\n```python\napi_router.include_router(\n    get_router_for_version(APIVersion.V1), \n    prefix=\"/v1\"\n)\napi_router.include_router(\n    get_router_for_version(APIVersion.V2), \n    prefix=\"/v2\"\n)\n```\n\n## Key Endpoints\n\n### Authentication\n| Method | Path | Security |\n|--------|------|----------|\n| POST | `/v1/auth/login` | None |\n| POST | `/v1/auth/logout` | JWT |\n| GET | `/v1/me` | JWT |\n| PUT | `/v1/me` | JWT |\n\n### System Management\n| Method | Path | Security |\n|--------|------|----------|\n| GET | `/v1/health` | None |\n| GET | `/v1/system/config` | Admin JWT |\n| PUT | `/v1/system/config` | Admin JWT |\n\n### User Management\n| Method | Path | Security |\n|--------|------|----------|\n| GET | `/v1/users` | Admin JWT |\n| POST | `/v1/users` | Admin JWT |\n| GET | `/v1/users/{id}` | Admin JWT |\n| PUT | `/v1/users/{id}` | Admin JWT |\n| DELETE | `/v1/users/{id}` | Admin JWT |\n\n### AI & RAG\n| Method | Path | Security |\n|--------|------|----------|\n| POST | `/v1/ai/chat` | JWT |\n| POST | `/v1/ai/embeddings` | JWT |\n| POST | `/v1/ai/ingest` | Admin JWT |\n\n### Dashboard\n| Method | Path | Security |\n|--------|------|----------|\n| GET | `/v1/dashboard/stats` | JWT |\n| GET | `/v1/dashboard/usage` | Admin JWT |\n\n## Integration Points\n\n### Dependencies\n- **FastAPI**: Router registration, dependency injection\n- **OAuth2**: JWT token validation via `oauth2_scheme`\n- **Database**: Session management via `get_db()` dependency\n\n### Request Flow\n1. Request arrives at versioned prefix (`/v1/*`)\n2. Router dispatches to appropriate handler\n3. Dependencies injected (auth, db session)\n4. Handler processes request\n5. Response returned with standardized format\n\n## Design Patterns\n\n### Dependency Injection\n```python\nasync def get_current_user(token: str = Depends(oauth2_scheme)):\n    # JWT validation\n    return user\n\nasync def get_db():\n    db = SessionLocal()\n    try:\n        yield db\n    finally:\n        db.close()\n```\n\n### Error Handling\nStandardized JSON responses:\n```json\n{\n  \"error\": {\n    \"code\": \"AUTHENTICATION_FAILED\",\n    \"message\": \"Invalid or expired token\",\n    \"details\": \"Token expired at 2026-08-28T10:30:00Z\"\n  }\n}\n```\n\n### Pagination\n```json\n{\n  \"data\": [...],\n  \"pagination\": {\n    \"limit\": 10,\n    \"offset\": 0,\n    \"total\": 123,\n    \"next\": \"/v1/users?limit=10&offset=10\"\n  }\n}\n```\n\n## Version Management\n\n| Version | Status | Notes |\n|---------|--------|-------|\n| v1 | Active | Full feature set |\n| v2 | Active | Streamlined endpoints |\n| v3 | Planned | Future enhancements |\n\n## Quality Assurance\n\n- **Auto-generated docs**: `/docs` (Swagger UI), `/openapi.json`\n- **Testing**: Unit + integration tests\n- **Monitoring**: Latency, error rate, throughput tracking\n- **SLOs**: P50/P95/P99 response times, 4xx/5xx error rates\n\n## Evolution Policy\n\n1. Backward compatibility maintained\n2. 6-month deprecation period minimum\n3. Clear migration guides provided\n4. Version-specific behavior supported","api-routing-versioning-scripts":"# API Routing & Versioning — scripts\n\n# OpenAPI Schema Generator\n\nCLI script exports OpenAPI schema from FastAPI application instance to static JSON file.\n\n## Purpose\n\nExtract static OpenAPI specification from code. Target: `docs/openapi/openapi.json`. \nUse for:\n- API documentation hosting\n- Frontend client/type generation\n- CI contract testing and diff detection\n\n## Flow\n\n```mermaid\nflowchart LR\n    A[app.main:app] -->|app.openapi| B[Schema Dict]\n    B -->|json.dumps| C[docs/openapi/openapi.json]\n```\n\n1. Import `app` instance from `app.main`.\n2. Generate schema dict with `app.openapi()`.\n3. Create target directory `docs/openapi/` if missing.\n4. Serialize JSON (indent=2, UTF-8, trailing newline).\n5. Write to `docs/openapi/openapi.json`.\n\n## Components\n\n### `backend/scripts/update_openapi.py`\n\n- `main() -> None`: Orchestrates extraction and file write.\n\n| Input | Output Target | Encoding | Format |\n|---|---|---|---|\n| `app.main.app` | `docs/openapi/openapi.json` | UTF-8 | JSON (indent=2) |\n\n## Usage\n\nRun from backend root:\n\n```bash\npython scripts/update_openapi.py\n```\n\nRun as module from project root:\n\n```bash\npython -m backend.scripts.update_openapi\n```\n\n## Integration\n\n- Depends on `app.main:app`. Needs all API routers, models, metadata registered on app instance before execution.\n- Relies on relative execution path matching project root structure (`docs/openapi/` directory relative to current working directory).","api-routing-versioning-site":"# API Routing & Versioning — site\n\n# API Documentation & Routing Reference\n\nStatic API documentation module generated via MkDocs Material and Redoc. Serves human-readable endpoint catalog, interactive OpenAPI 3.1.0 specification, and schema definitions.\n\n## Route Architecture & Versioning\n\nRoutes split across unversioned root utilities, `/api/v1`, and `/api/v2` prefixes.\n\n```mermaid\ngraph TD\n    Root[App Root] --> Base[Base Routes]\n    Root --> V1[/api/v1]\n    Root --> V2[/api/v2]\n\n    Base --> R_Health[/health]\n    Base --> R_Metrics[/metrics]\n\n    V1 --> V1_Sys[system, auth, admin, dashboard, users, ai]\n    V2 --> V2_Sys[health, auth, admin, dashboard, users, ai]\n```\n\n### Global Conventions\n\n- **Auth**: Bearer token via HTTP Header: `Authorization: Bearer <access_token>`\n- **Error format**:\n```json\n{\n  \"detail\": \"Error description\",\n  \"error_code\": \"ERROR_CODE\"\n}\n```\n\n---\n\n## Endpoint Catalog\n\n### System & Health\n\n| Method | Path | Version | Operation ID | Description |\n|---|---|---|---|---|\n| `GET` | `/health` | Root | `health_check_health_get` | Basic service health check |\n| `GET` | `/metrics` | Root | `metrics_metrics_get` | Prometheus metrics scrape target |\n| `GET` | `/api/v1/health` | v1 | `health_check_api_v1_health_get` | Versioned v1 health check |\n| `GET` | `/api/v2/health` | v2 | `health_check_api_v2_health_get` | Versioned v2 health check |\n| `GET` | `/api/v1/system/config/` | v1 | `get_all_configs_api_v1_system_config__get` | List all system configuration entries |\n| `GET` | `/api/v1/system/config/{key}` | v1 | `get_config_api_v1_system_config__key__get` | Get config value by key name |\n| `PUT` | `/api/v1/system/config/{key}` | v1 | `update_config_api_v1_system_config__key__put` | Update config value by key name |\n\n### Authentication & Users\n\n| Method | Path | Versions | Operation IDs |\n|---|---|---|---|\n| `POST` | `/api/{ver}/auth/register` | v1, v2 | `register_api_{ver}_auth_register_post` |\n| `POST` | `/api/{ver}/auth/login` | v1, v2 | `login_api_{ver}_auth_login_post` |\n| `GET` | `/api/{ver}/users/me` | v1, v2 | `get_me_api_{ver}_users_me_get` |\n| `GET` | `/api/{ver}/users` | v1, v2 | `get_users_api_{ver}_users_get` |\n\n### Administration & Metrics\n\n| Method | Path | Versions | Operation IDs | Description |\n|---|---|---|---|---|\n| `GET` | `/api/{ver}/admin/system-info` | v1, v2 | `get_admin_system_info_api_{ver}_admin_system_info_get` | Host OS, backend version, DB status |\n| `GET` | `/api/{ver}/admin/logs` | v1, v2 | `get_tracing_logs_api_{ver}_admin_logs_get` | Redacted log stream (query param: `tail`, default 100) |\n| `GET` | `/api/{ver}/dashboard/stats` | v1, v2 | `get_dashboard_stats_api_{ver}_dashboard_stats_get` | User counts, sessions, 24h call volumes |\n| `GET` | `/api/{ver}/dashboard/realtime` | v1, v2 | `get_dashboard_realtime_api_{ver}_dashboard_realtime_get` | Latency series and HTTP status breakdowns |\n\n### AI Services\n\nRate-limited endpoints for LLM interactions.\n\n| Method | Path | Versions | Payload Schema | Operation IDs |\n|---|---|---|---|---|\n| `POST` | `/api/{ver}/ai/chat` | v1, v2 | `ChatRequest` | `chat_completion_api_{ver}_ai_chat_post` |\n| `POST` | `/api/{ver}/ai/rag_chat` | v1, v2 | `RAGQueryRequest` | `rag_chat_completion_api_{ver}_ai_rag_chat_post` |\n| `POST` | `/api/{ver}/ai/embeddings` | v1, v2 | `EmbeddingRequest` | `embeddings_api_{ver}_ai_embeddings_post` |\n\n---\n\n## Core Data Schemas\n\nDefined in `openapi.json`:\n\n```json\n{\n  \"ChatRequest\": {\n    \"required\": [\"messages\", \"model\"],\n    \"properties\": {\n      \"messages\": { \"type\": \"array\", \"items\": { \"type\": \"object\" } },\n      \"model\": { \"type\": \"string\" },\n      \"temperature\": { \"type\": \"number\", \"default\": 0.7 },\n      \"max_tokens\": { \"type\": \"integer\", \"default\": 1000 },\n      \"stream\": { \"type\": \"boolean\", \"default\": false }\n    }\n  },\n  \"RAGQueryRequest\": {\n    \"required\": [\"query\", \"model\"],\n    \"properties\": {\n      \"query\": { \"type\": \"string\" },\n      \"model\": { \"type\": \"string\" },\n      \"n_results\": { \"type\": \"integer\", \"default\": 5 },\n      \"temperature\": { \"type\": \"number\", \"default\": 0.7 },\n      \"max_tokens\": { \"type\": \"integer\", \"default\": 1000 },\n      \"stream\": { \"type\": \"boolean\", \"default\": false }\n    }\n  },\n  \"EmbeddingRequest\": {\n    \"required\": [\"text\", \"model\"],\n    \"properties\": {\n      \"text\": { \"type\": \"string\" },\n      \"model\": { \"type\": \"string\" }\n    }\n  },\n  \"DashboardStats\": {\n    \"required\": [\"total_users\", \"active_sessions\", \"api_calls_24h\"],\n    \"properties\": {\n      \"total_users\": { \"type\": \"integer\" },\n      \"active_sessions\": { \"type\": \"integer\" },\n      \"api_calls_24h\": { \"type\": \"integer\" }\n    }\n  },\n  \"UserOut\": {\n    \"required\": [\"id\", \"email\"],\n    \"properties\": {\n      \"id\": { \"type\": \"integer\" },\n      \"email\": { \"type\": \"string\" },\n      \"roles\": { \"type\": \"array\", \"items\": { \"type\": \"string\" }, \"default\": [] }\n    }\n  }\n}\n```\n\n---\n\n## Static Assets & Maintenance\n\n- `backend/site/api/index.html`: Landing page for API reference.\n- `backend/site/api/openapi/index.html`: ReDoc container binding `openapi.json` to standalone UI renderer.\n- `backend/site/openapi/openapi.json`: Target schema definition file.\n\nRegenerate schema after router modifications:\n```bash\npython scripts/update_openapi.py\n```","api-routing-versioning-src":"# API Routing & Versioning — src\n\n# API Routing & Versioning — src\n\nModule provide HTTP client layer for backend communication, API version routing, and request performance tracking.\n\n```mermaid\nflowchart LR\n    View[Dashboard.vue / Components] --> useApi[useApi]\n    useApi --> wrapCall[wrapCall]\n    wrapCall --> Axios[Axios Instance]\n    wrapCall --> Metrics[recordApiCall]\n    Axios --> Backend[(Backend API)]\n```\n\n---\n\n## Files\n\n### `frontend/src/shared/api.ts`\nBase Axios client for root and unversioned endpoints.\n\n* **Base URL:** `import.meta.env.VITE_API_URL` or `http://localhost:8000`\n* **Config:** `withCredentials: true`\n\n#### Functions\n* `healthCheck()`: `GET /health`. Return root server status.\n* `getApiHealth(version = 'v1')`: `GET /api/${version}/health`. Return versioned API health (`v1` or `v2`).\n\n#### Interceptors\n* **Request:** Attach `startTime: new Date()` to `config.metadata`.\n* **Response:** Calculate duration `Date.now() - startTime`. Log elapsed time to `console.log`.\n* **Error:** Log request failure time to `console.error`. Reject promise.\n\n---\n\n### `frontend/src/shared/useApi.ts`\nSingleton Axios instance and composable wrapper for versioned API calls with core metrics integration.\n\n* **Base URL:** `import.meta.env.VITE_API_BASE_URL` or `http://localhost:8000/api/v1`\n* **Timeout:** `10000ms`\n* **Headers:** `Content-Type: application/json`\n* **Config:** `withCredentials: true`\n\n#### Core Exports\n\n* `getApiInstance()`: Return or create singleton `AxiosInstance`. Register 401 response interceptor for unauthorized access logging.\n* `useApi()`: Return HTTP wrapper methods. Unpack `response.data` automatically. Track request timing via `performance.now()` and push metrics to `recordApiCall`.\n\n#### Methods in `useApi()`\n* `get<T>(url)`: `GET` request wrapped with metric tracking.\n* `post<T>(url, data)`: `POST` request wrapped with metric tracking.\n* `put<T>(url, data)`: `PUT` request wrapped with metric tracking.\n* `delete<T>(url)`: `DELETE` request wrapped with metric tracking.\n\n#### Execution Flow (`wrapCall`)\n1. Record `startTime` with `performance.now()`.\n2. Execute Axios request and unwrap `res.data`.\n3. Success: Calculate `duration`, call `recordApiCall(method, baseURL + url, 200, duration)`, return data.\n4. Catch: Calculate `duration`, extract `error.response.status` (default `0`), call `recordApiCall(method, baseURL + url, statusCode, duration)`, rethrow error.\n\n---\n\n## Environment Variables\n\n| Variable | Default | Purpose |\n| :--- | :--- | :--- |\n| `VITE_API_URL` | `http://localhost:8000` | Base host for general/health requests in `api.ts` |\n| `VITE_API_BASE_URL` | `http://localhost:8000/api/v1` | Versioned base endpoint for `useApi.ts` |\n\n---\n\n## Usage Example\n\n```typescript\nimport { useApi } from '@/shared/useApi'\n\ninterface UserData {\n  id: string\n  name: string\n}\n\nconst api = useApi()\n\n// GET /api/v1/users/me\nconst user = await api.get<UserData>('/users/me')\n\n// POST /api/v1/users\nawait api.post('/users', { name: 'Grok' })\n```","api-routing-versioning-tests":"# API Routing & Versioning — tests\n\n# API Routing & Versioning — Auth Bearer Unit Tests\n\n`backend/tests/api/v1/test_auth_bearer.py` verify token extraction logic in API v1 dependency layer.\n\n## Purpose\n\nValidate `app.api.v1.deps.extract_token_from_request`. Ensure correct precedence, header parsing, cookie fallback, malformed input rejection.\n\n## Test Flow\n\n```mermaid\nflowchart TD\n    Req[FastAPI Request] --> CheckHdr{Authorization Header?}\n    CheckHdr -- Bearer &lt;token&gt; --> ReturnHdr[Return Header Token]\n    CheckHdr -- Malformed / Missing --> CheckCookie{Cookie: access_token?}\n    CheckCookie -- Found --> ReturnCookie[Return Cookie Token]\n    CheckCookie -- Missing --> ReturnNone[Return None]\n```\n\n## Test Cases\n\nModule mock raw ASGI `scope` dict in `fastapi.Request` directly. No HTTP server needed.\n\n### `test_extract_token_from_auth_header`\n- **Input:** `Authorization: Bearer token123`\n- **Expected:** `\"token123\"`\n- **Verifies:** Standard Bearer header parsed.\n\n### `test_extract_token_from_auth_header_missing_bearer_prefix`\n- **Input:** `Authorization: token123`\n- **Expected:** `None`\n- **Verifies:** Header missing `Bearer ` prefix rejected.\n\n### `test_extract_token_from_cookie`\n- **Input:** `Cookie: access_token=cookie_token456` (no auth header)\n- **Expected:** `\"cookie_token456\"`\n- **Verifies:** Fallback to cookie when header absent.\n\n### `test_extract_token_from_header_priority`\n- **Input:** Both `Authorization: Bearer header_token` and `Cookie: access_token=cookie_token`\n- **Expected:** `\"header_token\"`\n- **Verifies:** Header overrides cookie.\n\n### `test_extract_token_no_token`\n- **Input:** Empty headers\n- **Expected:** `None`\n- **Verifies:** Missing auth state handled safely.\n\n### `test_token_parsing_edge_cases`\n- **Inputs & Expected:**\n  - `Authorization: Bearer` -> `None` (empty payload invalid)\n  - `Authorization: Bearer token  ` -> `\"token  \"` (preserves spaces after separator)\n  - `Authorization: Bearer token!@#$%` -> `\"token!@#$%\"` (preserves special characters)\n\n## Integration Points\n\n- **Target:** `app.api.v1.deps.extract_token_from_request`\n- **Framework:** `pytest`, `fastapi.Request`\n- **Execution:** Run via `pytest backend/tests/api/v1/test_auth_bearer.py`","api-routing-versioning":"# API Routing & Versioning\n\n# API Routing & Versioning\n\nCentralized API management layer handling versioned endpoints, authentication, documentation, and client integration.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[Router Registry] --> B[Version Router]\n    A --> C[Version Enum]\n    D[OpenAPI Script] --> E[FastAPI App]\n    F[Client API] --> G[Axios Wrapper]\n    H[Docs Site] --> I[Schema Generator]\n    J[Tests] --> K[Auth Bearer]\n```\n\n## Sub-modules\n\n- **[app](app.md)** - Core routing with `APIVersion` enum, router registration, and authentication dependencies\n- **[docs](docs.md)** - Static documentation serving interactive OpenAPI spec and endpoint reference\n- **[scripts](scripts.md)** - OpenAPI schema generation CLI for CI/CD and client SDK generation\n- **[site](site.md)** - MkDocs Material documentation site with Redoc integration\n- **[tests](tests.md)** - Unit tests for bearer token extraction and auth flows\n- **[src](src.md)** - Frontend Axios client with version routing and performance metrics\n- **[openwiki](openwiki.md)** - Cross-module dependency mapping and architecture reference\n\n## Key Workflows\n\n**Version Registration**: `APIVersion` enum → `register_version()` → router inclusion at `/api/v1`, `/api/v2`\n\n**Auth Flow**: Request → `extract_token_from_request()` → `get_current_user()` → endpoint authorization\n\n**Schema Generation**: `app.main:app` → `update_openapi.py` → `docs/openapi/openapi.json` → docs site\n\n**Client Calls**: `useApi()` → `wrapCall()` → Axios → backend API with version prefix","authentication-user-management":"# Authentication & User Management\n\n# Authentication & User Management Module\n\n## Overview\n\nThis module handles user authentication, registration, session management, and role-based access control. It spans both backend (FastAPI) and frontend (Vue 3 + Pinia) with JWT-based authentication stored in HttpOnly cookies.\n\n## Architecture\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                        Frontend (Vue 3)                         │\n├─────────────────────────────────────────────────────────────────┤\n│  LoginForm.vue / RegistrationForm.vue                           │\n│         │                                                       │\n│         ▼                                                       │\n│  useAuthStore (Pinia)                                           │\n│         │                                                       │\n│         ▼                                                       │\n│  authService (API calls)                                        │\n└─────────────────────────────────────────────────────────────────┘\n                              │\n                    HTTP + Cookies\n                              ▼\n┌─────────────────────────────────────────────────────────────────┐\n│                        Backend (FastAPI)                        │\n├─────────────────────────────────────────────────────────────────┤\n│  POST /api/v1/auth/register  →  User model + hash_password      │\n│  POST /api/v1/auth/login     →  verify_password + create_token  │\n│  GET  /api/v1/users/me       →  extract_token + verify_token    │\n│  GET  /api/v1/users          →  admin only (get_admin_user)     │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n## Backend Components\n\n### User Model (`backend/app/modules/user/user.py`)\n\n```python\nclass User(Base):\n    __tablename__ = \"users\"\n    id = Column(Integer, primary_key=True, index=True)\n    email = Column(String, unique=True, index=True, nullable=False)\n    hashed_password = Column(String, nullable=False)\n    roles = relationship(\"Role\", secondary=user_roles, back_populates=\"users\")\n```\n\n- **email**: Unique, indexed, required\n- **hashed_password**: Bcrypt hash (never plaintext)\n- **roles**: Many-to-many with `Role` via `user_roles` association table\n\n### Auth Endpoints (`backend/app/modules/user/api/auth.py`)\n\n| Endpoint | Method | Description |\n|----------|--------|-------------|\n| `/register` | POST | Create user, hash password, return user ID + email |\n| `/login` | POST | Verify credentials, issue JWT, set HttpOnly cookie |\n\n**Registration flow:**\n1. Validate email + password present\n2. Check email uniqueness\n3. Hash password with `hash_password()` (bcrypt)\n4. Create User, commit to DB\n5. Return `{id, email}`\n\n**Login flow:**\n1. Validate email + password present\n2. Find user by email\n3. Verify password with `verify_password()` (bcrypt)\n4. Create JWT via `create_access_token({\"sub\": str(user.id)})`\n5. Set cookie: `access_token`, HttpOnly, SameSite=strict, max_age=900s (15 min)\n6. Return `{message: \"Login successful\"}`\n\n### User Endpoints (`backend/app/modules/user/api/users.py`)\n\n| Endpoint | Method | Auth | Description |\n|----------|--------|------|-------------|\n| `/me` | GET | Required | Current user profile + roles |\n| `/` | GET | Admin | List all users with roles |\n\n**Dependency chain:**\n```\nget_me → get_current_user → extract_token_from_request → verify_token\nget_users → get_admin_user → get_current_user → extract_token_from_request → verify_token\n```\n\n### Exceptions (`backend/app/modules/core/exceptions.py`)\n\n- `EmailAlreadyExistsError` → 409, `error_code: \"EMAIL_ALREADY_EXISTS\"`\n- `InvalidCredentialsError` → 401, `error_code: \"INVALID_CREDENTIALS\"`\n\n## Frontend Components\n\n### Auth Service (`frontend/src/modules/user/services/auth.ts`)\n\n```typescript\nlogin(credentials) → POST /api/v1/auth/login → GET /api/v1/users/me → User\nregister(credentials) → POST /api/v1/auth/register → User\nlogout() → POST /api/v1/auth/logout\ngetCurrentUser() → GET /api/v1/users/me → User\n```\n\n**Error handling:** Catches axios errors, extracts `error.response.data` (contains `detail` + `error_code`), throws normalized error object.\n\n### Auth Store (`frontend/src/modules/user/stores/auth.ts`)\n\nPinia store with:\n- **State**: `user`, `loading`, `error`, `errorCode`, `isAuthenticated`\n- **Actions**:\n  - `login()` → calls service, fetches current user, returns redirect path (`/chat`)\n  - `register()` → calls service, no auto-login\n  - `logout()` → calls service, clears user\n  - `fetchCurrentUser()` → hydrates session on app load\n\n**Note:** Duplicate store exists at `frontend/src/stores/auth.ts` (Options API style). The module-specific store (`user/stores/auth.ts`) is the active one used by views.\n\n### Views\n\n- **LoginForm.vue**: Email/password fields, validation, error display, submit → `authStore.login()` → redirect to `/chat`\n- **RegistrationForm.vue**: Email/password, validation, error display, submit → `authStore.register()` → redirect to `/login`\n- **AuthLayout.vue**: Minimal centered container, no app chrome\n\n## Security Details\n\n| Aspect | Implementation |\n|--------|----------------|\n| Password hashing | bcrypt via `hash_password()` / `verify_password()` |\n| Token type | JWT (HS256) |\n| Token payload | `{\"sub\": \"<user_id>\"}` |\n| Token expiry | 15 minutes (cookie `max_age`) |\n| Cookie flags | `HttpOnly`, `SameSite=strict`, `Secure=False` (dev) |\n| Token transport | HttpOnly cookie (not localStorage) |\n| Role enforcement | `get_admin_user` dependency checks `user.roles` for \"admin\" |\n\n## Testing\n\n`backend/app/modules/user/tests/test_users.py` covers:\n- `test_auth_register` - successful registration\n- `test_auth_register_duplicate` - 409 on duplicate email\n- `test_auth_login_invalid` - 401 on wrong password\n- `test_users_me` - authenticated `/me` returns user\n- `test_users_me_unauthorized` - 401 without token\n- `test_users_list` - admin can list all users\n\nHelper `create_admin_client()` creates admin user + role, logs in, sets cookie.\n\n## Integration Points\n\n| Component | Depends On |\n|-----------|------------|\n| `register` | `get_db`, `hash_password`, `User` model |\n| `login` | `get_db`, `verify_password`, `create_access_token` |\n| `get_me` | `get_current_user` → `extract_token_from_request` → `verify_token` |\n| `get_users` | `get_admin_user` → `get_current_user` → ... |\n| Frontend `authService` | Axios instance (`@/shared/api`) with baseURL |\n| Frontend `authStore` | `authService`, router for redirects |\n\n## Configuration\n\nToken expiry controlled in `auth.py`:\n```python\nmax_age=15 * 60  # 15 minutes\n```\n\nCookie `secure=False` for local dev; must be `True` in production (HTTPS).\n\n## Common Issues\n\n1. **Cookie not sent** - Frontend must use `credentials: 'include'` (configured in axios instance)\n2. **CORS** - Backend must allow credentials: `allow_credentials=True` in CORS middleware\n3. **Token expiry** - 15 min is short; consider refresh token flow for production\n4. **Duplicate stores** - `frontend/src/stores/auth.ts` vs `frontend/src/modules/user/stores/auth.ts` - consolidate\n\n## File Map\n\n```\nbackend/app/modules/user/\n├── user.py                    # User SQLAlchemy model\n├── api/\n│   ├── auth.py               # register, login endpoints\n│   ├── users.py              # /me, / (admin) endpoints\n│   └── health.py             # health check\n└── tests/\n    ├── test_users.py         # Auth + user endpoint tests\n    └── test_api_errors.py    # Error handler tests\n\nfrontend/src/modules/user/\n├── services/auth.ts          # API calls\n├── stores/auth.ts            # Pinia auth store (active)\n├── views/\n│   ├── LoginForm.vue\n│   └── RegistrationForm.vue\n└── layouts/AuthLayout.vue    # Minimal auth page layout\n```","core-architecture-infrastructure-alembic":"# Core Architecture & Infrastructure — alembic\n\n# Alembic Database Migrations\n\nManages database schema changes. Uses Alembic with SQLAlchemy models.\n\n## Purpose\n\nTrack database schema changes over time. Apply upgrades, rollback downgrades. Keep schema synchronized across environments.\n\n## Structure\n\n`backend/alembic/`\n- `env.py` – Main configuration, entry point\n- `script.py.mako` – Migration file template\n- `versions/` – Individual migration scripts\n- `README` – Generic config note\n\n## Configuration (`env.py`)\n\nKey setup:\n- Adds app directory to `sys.path` for model imports\n- Uses `Base.metadata` from `app.modules.core.database` for autogenerate\n- Sets database URL from `settings.DATABASE_URL`\n- Imports all SQLAlchemy models (`User`, `SystemSetting`, `Document`) to ensure Alembic detects them\n\nTwo modes:\n- `run_migrations_offline()` – Generates SQL scripts without database connection\n- `run_migrations_online()` – Connects to database and applies migrations directly\n\n## Migration Files\n\nEach file in `versions/` follows pattern: `{revision_hash}_{description}.py`\n\nTemplate (`script.py.mako`) generates:\n- Revision identifiers (`revision`, `down_revision`)\n- `upgrade()` and `downgrade()` functions\n\n## Migration History\n\nCurrent revision chain:\n\n```mermaid\ngraph LR\n    A[ce3e0c013c1f<br>initial] --> B[8c4783b0e69d<br>create_users_table]\n    B --> C[8c4783b0e69d2<br>add roles tables]\n    C --> D[5c5a3b15fd7e<br>seed admin user/roles]\n    D --> E[f2a7b8c9d0e1<br>create_trace_configurations]\n    E --> F[739f2db1fc49<br>create_system_settings]\n    F --> G[3c4351fa93f3<br>migrate trace to settings]\n    G --> H[a1b2c3d4e5f6<br>create documents table]\n```\n\n## Key Migrations\n\n### User & Role System\n- `8c4783b0e69d`: Creates `users` table with email/password\n- `8c4783b0e69d2`: Creates `roles` and `user_roles` junction table\n- `5c5a3b15fd7e`: Seeds admin user (`admin@example.com`/`admin123`) and admin/user roles\n\n### System Settings\n- `739f2db1fc49`: Creates `system_settings` table (key-value JSON storage)\n- `3c4351fa93f3`: Migrates old `trace_configurations` data into `system_settings`\n\n### RAG Documents\n- `a1b2c3d4e5f6`: Creates `documents` table with pgvector HNSW index (PostgreSQL only). Skips on SQLite.\n\n## Usage\n\nCreate new migration (autogenerate from model changes):\n```bash\nalembic revision --autogenerate -m \"description\"\n```\n\nApply all pending migrations:\n```bash\nalembic upgrade head\n```\n\nRollback one migration:\n```bash\nalembic downgrade -1\n```\n\nGenerate SQL script without applying:\n```bash\nalembic upgrade head --sql\n```\n\n## Dependencies\n\n- `app.modules.core.config.settings` – Database URL\n- `app.modules.core.database.Base` – SQLAlchemy metadata for autogenerate\n- `app.modules.core.security.hash_password` – For password hashing in seed migration\n- All SQLAlchemy model imports in `env.py` must be kept current\n\n## Notes\n\n- Migration `a1b2c3d4e5f6` is PostgreSQL-specific (requires pgvector). SQLite environments skip it.\n- Always test downgrades before deploying.\n- Seed data migrations (`5c5a3b15fd7e`) include passwords – change default in production.\n- `env.py` imports models explicitly; add new models here when creating tables.","core-architecture-infrastructure-app":"# Core Architecture & Infrastructure — app\n\n# Core Architecture & Infrastructure\n\nCentral module for application lifecycle, configuration, and shared services.\n\n## Application Entry Point (`app/main.py`)\n\n`create_app()` factory builds `FastAPI` instance. Configure middleware, exception handlers, and routes.\n\n### Middleware Stack\nOrder of execution:\n1.  `RequestIDMiddleware`: Generate/inject `X-Request-ID` header.\n2.  `CostTrackingMiddleware`: Track AI usage costs.\n3.  `RateLimitingMiddleware`: Prevent API abuse.\n4.  `CORSMiddleware`: Manage cross-origin access via `settings.CORS_ORIGINS`.\n\n### Exception Mapping\nCustom handlers convert exceptions to `JSONResponse` with `X-Request-ID` for tracing:\n*   `AuthException`: Return specific `error_code` and status.\n*   `HTTPException`: Standard FastAPI errors.\n*   `Exception`: Catch-all for 500 Internal Server Errors.\n\n```mermaid\ngraph TD\n    App[FastAPI App] --> Mid[Middleware Stack]\n    Mid --> Router[API Router]\n    Mid --> Obs[Observability/Metrics]\n    Router --> DB[(Database)]\n    App --> Static[Internal Docs /site]\n```\n\n## Configuration (`modules/core/config.py`)\n\n`Settings` class use `pydantic-settings` to load environment variables.\n*   **Source**: `.env` file or system environment.\n*   **Key Vars**: `DATABASE_URL`, `REDIS_URL`, `SECRET_KEY`, `OTEL_COLLECTOR_ENDPOINT`.\n*   **Defaults**: Optimized for local development (e.g., SQLite, local Redis).\n\n## Database Management (`modules/core/database.py`)\n\nSQLAlchemy setup for persistence.\n*   `engine`: Configured for SQLite (local) or Postgres (production with connection pooling).\n*   `SessionLocal`: Factory for database sessions.\n*   `get_db()`: Dependency provider. Yield session, auto-close after request.\n\n## Security (`modules/core/security.py`)\n\nIdentity and access control utilities.\n*   `hash_password(password)`: Bcrypt hashing with salt.\n*   `verify_password(plain, hashed)`: Bcrypt verification.\n*   `create_access_token(data, expires)`: Generate JWT using `HS256` and `settings.SECRET_KEY`.\n*   `verify_token(token)`: Decode JWT; return payload or `None` if invalid/expired.\n\n## Observability & Logging\n\n*   **Logging (`modules/core/logging.py`)**: `setup_logging()` configures JSON format for console and file (`server.log`). Include timestamp, level, and message.\n*   **Tracing**: `RequestIDMiddleware` ensures every log entry can link to a specific request.\n*   **Metrics**: `Instrumentator` exposes Prometheus metrics at `/metrics`.\n*   **Health**: `/health` endpoint checks app status and database connectivity.\n\n## Testing Infrastructure (`app/conftest.py`)\n\nPytest fixtures for integration testing.\n*   `session`: Function-scoped. Create clean SQLite `test.db` for every test.\n*   `client`: `TestClient` using `app` instance with `get_db` dependency overridden to use the test session.\n*   **Env**: `LOG_FILE_PATH` forced to `./test.log` to avoid polluting production logs.\n\n## Versioning (`modules/core/version.py`)\n\n`get_version()` parse `pyproject.toml` via regex. Fallback to `0.0.0` if file missing. Used in FastAPI metadata.\n\n→ skipped: auto-migration in `lifespan`, add when DB schema stabilize.\n→ skipped: Redis health check, add when caching become critical path.","core-architecture-infrastructure-architecture-md":"# Core Architecture & Infrastructure — ARCHITECTURE.md\n\n# Architecture\n\n## Purpose\n\nGitNexus demonstrates FastAPI backend + Vue 3 frontend integration. Modular structure separates domains into `backend/app/modules/<feature>/`. Exposes REST API under `api/v1`, persists via SQLAlchemy to Postgres, offloads work to Dramatiq workers, proxies LLM calls to swappable providers.\n\n## Structure\n\n```\nbackend/app/\n├── api/v1/           # Versioned deps: auth, db session, admin guard\n├── modules/\n│   ├── core/         # database.py, security.py, config.py\n│   ├── ai/           # LLM providers, chat endpoints, actors\n│   ├── system/       # config, tracing\n│   ├── users/        # user management\n│   └── admin/        # admin operations\nfrontend/src/\n├── views/            # Vue page components\n└── stores/           # Pinia stores\n```\n\n## Key Components\n\n### API Layer (`modules/*/api/`)\nRouters per domain. Mounted under `api/v1`. Each router uses deps from `api/v1/deps.py`.\n\n### Services (`modules/*/services/`)\nBusiness logic. LLM service (`ai/services/llm_service.py`) manages provider registry + chat/stream/generate.\n\n### Actors (`modules/*/actors/`)\nDramatiq background workers. Handle async LLM jobs.\n\n### Core (`modules/core/`)\nShared infrastructure:\n- `database.py` — SQLAlchemy session management\n- `security.py` — JWT verify, token extraction\n- `config.py` — application configuration\n\n### Dependency Chain\nProtected endpoints use:\n```\nget_current_user → get_db\n```\nAdmin endpoints prepend:\n```\nget_admin_user → get_current_user → get_db\n```\n\n## Execution Flows\n\n### Chat Completion\n```\nchat_completion → generate → stream_chat → generate_stream → get_provider\n```\nPath: `backend/app/modules/ai/api/chat.py` → `backend/app/modules/ai/services/llm_service.py`\n\n### Config Read (Protected)\n```\nget_config → get_admin_user → get_current_user → get_db\n```\nPath: `modules/system/api/config.py` → `api/v1/deps.py` → `modules/core/database.py`\n\n### Token Extraction\n```\nget_config → get_admin_user → get_current_user → extract_token_from_request\n```\n\n### Token Verification\n```\nget_config → get_admin_user → get_current_user → verify_token\n```\nPath: `modules/core/security.py`\n\n## Data Flow\n\n```mermaid\nflowchart LR\n    subgraph FE[\"Frontend (Vue 3)\"]\n        Views[\"Views<br/>7 symbols\"]\n        Stores[\"Pinia Stores<br/>9 symbols\"]\n    end\n\n    subgraph BE[\"Backend (FastAPI)\"]\n        V1[\"v1 deps<br/>auth + db<br/>12 symbols\"]\n        ModApi[\"Modules API<br/>21 symbols\"]\n        AiSvc[\"ai/services<br/>LLM providers<br/>23 symbols\"]\n        Security[\"security.py<br/>JWT verify\"]\n        DB[\"database.py<br/>SQLAlchemy\"]\n    end\n\n    subgraph Workers[\"Workers\"]\n        Dramatiq[\"Dramatiq<br/>async jobs\"]\n    end\n\n    subgraph Data[\"Data\"]\n        Postgres[(\"Postgres\")]\n    end\n\n    subgraph External[\"External LLMs\"]\n        OpenAI[\"OpenAI\"]\n        Anthropic[\"Anthropic\"]\n        Local[\"Local\"]\n    end\n\n    Views --> Stores\n    Stores -->|HTTP /api/v1/*| V1\n    V1 --> ModApi\n    V1 --> Security\n    V1 --> DB\n    ModApi --> AiSvc\n    DB --> Postgres\n    AiSvc --> OpenAI\n    AiSvc --> Anthropic\n    AiSvc --> Local\n    Dramatiq --> AiSvc\n```\n\n## Module Boundaries\n\n- `backend/app/modules/<feature>/` — each domain owns `api/`, `services/`, `actors/`, `models/`, `tests/`\n- `backend/app/api/v1/` — dependency injection + router mounting\n- `backend/app/modules/core/` — shared `database.py`, `security.py`, `config.py`\n- Frontend: `frontend/src/views/`, `frontend/src/stores/`\n\n## Cohesion Clusters\n\n| Area | Symbols | Cohesion | Role |\n|---|---|---|---|\n| Tests | 45 | 77% | pytest suite |\n| Services | 23 | 87% | LLM provider registry |\n| Api | 21 | 90% | FastAPI routers |\n| V1 | 12 | 96% | deps wiring |\n| Stores | 9 | 100% | Pinia stores |\n| Views | 7 | 100% | Vue components |\n| Actors | 5 | 73% | Dramatiq workers |\n| Cluster_15 | 5 | 100% | focused cluster |\n| __init__ | 5 | 100% | module surface |","core-architecture-infrastructure-architecture":"# Core Architecture & Infrastructure — architecture\n\n# Core Architecture & Infrastructure — Architecture Module\n\n## Purpose\n\nDefines system-wide data structures, access control model, observability infrastructure, and RAG vector storage schema. Single source of truth for database design.\n\n## Database Schema\n\n### Entity Relationship Diagram\n\n```mermaid\nerDiagram\n    USERS {\n        int id PK\n        string email UK\n        string hashed_password\n    }\n\n    ROLES {\n        int id PK\n        string name UK\n    }\n\n    USER_ROLES {\n        int user_id PK, FK\n        int role_id PK, FK\n    }\n\n    SYSTEM_SETTINGS {\n        int id PK\n        string key UK\n        json settings\n        datetime updated_at\n    }\n\n    TRACE_CONFIGURATIONS {\n        int id PK\n        string service_name UK\n        boolean enabled\n    }\n\n    TRACE_ENTRIES {\n        int id PK\n        string function_name\n        string module_name\n        float duration\n        datetime timestamp\n    }\n\n    DOCUMENTS {\n        int id PK\n        text content\n        vector embedding\n        jsonb meta_data\n        datetime created_at\n    }\n\n    USERS ||--o{ USER_ROLES : \"has\"\n    ROLES ||--o{ USER_ROLES : \"assigned to\"\n```\n\n## Components\n\n### 1. User & Access Control (RBAC)\n\n**Tables:**\n- `users`: Identity storage (email, hashed_password)\n- `roles`: Permission levels (admin, user, etc.)\n- `user_roles`: Junction table for many-to-many mapping\n\n**Usage:**\n```sql\n-- Check user permissions\nSELECT r.name FROM users u\nJOIN user_roles ur ON u.id = ur.user_id\nJOIN roles r ON ur.role_id = r.id\nWHERE u.email = 'user@example.com';\n```\n\n### 2. System Settings\n\n**Table:** `system_settings`\n- Key-value store for runtime configuration\n- Settings stored as JSON\n- Real-time feature toggling without restarts\n\n**Pattern:**\n```python\n# Read setting\nsettings = db.query(SystemSettings).filter_by(key=\"feature.toggle\").first().settings\n\n# Update setting\ndb.query(SystemSettings).filter_by(key=\"feature.toggle\").update({\"settings\": {\"enabled\": True}})\n```\n\n### 3. Observability & Tracing\n\n**Tables:**\n- `trace_configurations`: Per-service trace toggles (deprecated)\n- `trace_entries`: Performance metrics (function_name, module_name, duration, timestamp)\n\n**Migration:** Move trace settings to `system_settings` with key pattern `tracing.{service_name}`\n\n### 4. Vector Database / RAG\n\n**Table:** `documents`\n- `content`: Chunked text documentation\n- `embedding`: 384-dimension vector (PGVector)\n- `meta_data`: JSONB for filtering (domain, category, etc.)\n- `created_at`: Document timestamp\n\n**Embedding Model:** `all-MiniLM-L6-v2`\n\n**Query Pattern:**\n```sql\n-- Similarity search\nSELECT content, meta_data \nFROM documents \nWHERE meta_data->>'domain' = 'api'\nORDER BY embedding <=> '[vector_data]' \nLIMIT 5;\n```\n\n## Integration Points\n\n### Authentication Layer\nUser credentials from `users` table feed into auth middleware. Role checks query `user_roles` → `roles`.\n\n### Configuration Management\n`system_settings` read at startup and cached. Changes propagate via polling or push notifications.\n\n### Tracing System\n`trace_entries` populated by instrumentation decorators. Sampling controlled by `trace_configurations` (migrate to `system_settings`).\n\n### RAG Pipeline\nDocument ingestion writes to `documents`. Embedding generation uses `all-MiniLM-L6-v2`. Retrieval queries use PGVector operators.\n\n## Migration Notes\n\n- `trace_configurations` → `system_settings` with key `tracing.{service_name}`\n- All new settings use `system_settings` key pattern `namespace.setting_name`","core-architecture-infrastructure-backend":"# Core Architecture & Infrastructure — backend\n\n\n\n## Core Architecture & Infrastructure — backend\n\n### Purpose\nInitialize database, manage migrations, seed default data, provide testing hooks.\n\n### Components\n- alembic.ini: migration config, DB URL, logging.\n- init_db.py: schema creation, token sync, role/user seeding, system settings.\n- main.py: entry point, prints greeting.\n- mutmut.conf.py: mutation test filters.\n- pyproject.toml: dependencies, package discovery.\n- pytest.ini: coverage options.\n\n```mermaid\ngraph TD\n    A[alembic.ini] --> B[alembic]\n    C[init_db.py] --> D[database]\n    C --> E[security.hash_password]\n    F[main.py] --> C\n    G[pyproject.toml] --> H[dependencies]\n```\n\n### Execution flow\nLifespan → init_db → hash_password\ninit_db → create tables\ninit_db → read .token, generate if missing\ninit_db → store token in SystemSetting\ninit_db → create Role admin, user\ninit_db → create User admin@example.com with password admin123\ninit_db → set SystemSetting keys: system.tracing, system.auth_method, system.token_expiry_hours\ninit_db → load .env into SystemSetting\n\n### External interfaces\n- SQLAlchemy engine, Session, Base\n- Alembic migration scripts\n- FastAPI lifespan\n- OpenTelemetry instruments\n- Prometheus exporter\n- ChromaDB, pgvector, sentence-transformers, MLflow, LangChain\n\n### Configuration\n- DB URL: sqlite:///./data/app.db\n- Bearer token: .token file, synced to SystemSetting\n- Admin credentials: admin@example.com / admin123\n- Auth method: cookie_or_bearer\n- Token expiry: 24h\n\n### Testing\n- pytest with coverage on app\n- mutmut skips tests, migrations\n\n### Extension\n- Add SystemSetting keys in init_db or migration\n- Create new Role instances\n- Register additional lifespan tasks in app/main.py","core-architecture-infrastructure-context-md":"# Core Architecture & Infrastructure — CONTEXT.md\n\n# Observability & Infrastructure Architecture\n\nObservability stack for centralized metrics, logs, traces. Uses OpenTelemetry (OTel), Prometheus, Loki, Tempo, Grafana.\n\n## Telemetry Pipeline\n\n```mermaid\nflowchart LR\n    App[Backend / Frontend App] -->|OTLP| Collector[OTel Collector]\n    Collector -->|Metrics| Prom[Prometheus]\n    Collector -->|Traces| Tempo[Tempo]\n    Collector -->|Logs| Loki[Loki]\n    Prom --> Grafana[Grafana Dashboards]\n    Tempo --> Grafana\n    Loki --> Grafana\n    Prom -->|Evaluate| Alert[Alertmanager]\n```\n\n## Core Components\n\n### 1. Telemetry Collection\n- **OTel Collector**: Ingests traces, metrics, logs via OTLP. Routes data to backend storage systems.\n- **Trace Context Propagation**: Passes Trace IDs across service and async boundaries (e.g., Dramatiq actors) for end-to-end request tracing.\n- **Log Correlation**: Injects Trace ID into structured logs for direct trace-to-log pivoting in Grafana.\n\n### 2. Monitoring & Alerts\nFile: `dockerdata/observability/prometheus/alerts.yml`\n\n| Alert Name | Condition | Window | Severity / Trigger |\n|---|---|---|---|\n| `HighErrorRate` | 5xx HTTP responses > 5% | 5m | Service degradation |\n| `ServiceDown` | `up == 0` | 1m | Outage / Pod failure |\n\n### 3. Dashboards\nLocation: `dockerdata/observability/grafana/provisioning/dashboards/`\n- `backend-observability.json`: Backend health, request throughput (RPS), error rates, latency percentiles.\n- `frontend-observability.json`: Client-side performance, frontend component metrics, user interaction tracking.\n\n### 4. Kubernetes Runtime Configuration\nFile: `kubernetes/backend-deployment.yaml`\n- **Workload Type**: `kind: Deployment`. Uses rolling update strategy for zero downtime.\n- **Environment Ingestion**: Injects `OTEL_EXPORTER_OTLP_ENDPOINT` pointing to cluster OTel Collector service.\n\n## Critical Failure Modes & Operational Edge Cases\n\n- **OTel Collector Backpressure**: High traffic bursts cause memory spikes in Collector. Dropped spans/metrics occur if buffers saturate before flush to Loki/Prometheus.\n- **Metric Cardinality Spikes**: Raw user IDs or unindexed paths inside Prometheus label sets degrade TSDB storage. Restrict labels to bounded enum values.\n- **Async Trace Dropping**: Tasks enqueued to Dramatiq drop trace context if worker middleware fails to unpack metadata headers.\n- **Loki Ingestion Lag**: Excessive unindexed log spam causes ingestion queues to back up. Require structured JSON formatting across services.","core-architecture-infrastructure-database":"# Core Architecture & Infrastructure — database\n\n# Core Architecture & Infrastructure — Database\n\n## Purpose\n\nDatabase layer optimization patterns and connection routing for PostgreSQL. Covers query performance, JSONB indexing, vector search, and read-replica readiness.\n\n---\n\n## Key Components\n\n| Component | File | Role |\n|-----------|------|------|\n| Query Examples | `docs/database/query-examples.md` | Optimization patterns reference |\n| Session Factory | `backend/app/core/database.py` | RoutingSession, engine config |\n| Models | `backend/app/models/` | User, Role, SystemSetting, Document |\n\n---\n\n## Optimization Patterns\n\n### 1. N+1 Prevention — Eager Loading\n\n**Problem**: Accessing `user.roles` in loop triggers N queries.\n\n**Fix**: `joinedload(User.roles)` → single JOIN query.\n\n```python\nfrom sqlalchemy.orm import joinedload\nusers = db.query(User).options(joinedload(User.roles)).all()\n```\n\n### 2. JSONB Search — GIN Index\n\n**Problem**: `settings['tracing']['enabled']` scan = O(N) sequential.\n\n**Fix**: GIN index + containment operator.\n\n```sql\nCREATE INDEX idx_system_settings_jsonb_gin ON system_settings USING gin (settings);\n```\n\n```python\nsettings = db.query(SystemSetting).filter(\n    SystemSetting.settings.contains({\"tracing\": {\"enabled\": True}})\n).all()\n```\n\n### 3. Vector Search — HNSW Index (PGVector)\n\n**Problem**: Exact cosine distance on 100k+ rows = slow.\n\n**Fix**: HNSW approximate nearest neighbor.\n\n```sql\nCREATE INDEX idx_documents_embedding_hnsw ON documents \nUSING hnsw (embedding vector_cosine_ops) \nWITH (m = 16, ef_construction = 64);\n```\n\n```python\nnearest_docs = db.query(Document).order_by(\n    Document.embedding.cosine_distance(query_embedding)\n).limit(5).all()\n```\n\n### 4. Read Replica Routing\n\n**Implementation**: `backend/app/core/database.py`\n\n```python\nclass RoutingSession(Session):\n    def get_bind(self, mapper=None, clause=None):\n        if self._flushing or (clause is not None and not clause.is_select):\n            return engines['writer']\n        return engines['reader']\n\nengines = {\n    'writer': create_engine(settings.DATABASE_WRITE_URL, pool_size=10, max_overflow=20),\n    'reader': create_engine(settings.DATABASE_READ_URL, pool_size=15, max_overflow=30)\n}\nSessionLocal = sessionmaker(class_=RoutingSession, autocommit=False, autoflush=False)\n```\n\n---\n\n## Architecture\n\n```mermaid\ngraph TD\n    App[Application] --> Session[RoutingSession]\n    Session -->|Write| Writer[(Primary DB)]\n    Session -->|Read| Reader[(Read Replica)]\n    Writer -->|Replication| Reader\n    Writer --> Models[User, Role, SystemSetting, Document]\n    Reader --> Models\n```\n\n---\n\n## Integration Points\n\n- **Models** define columns: `User.roles` (relationship), `SystemSetting.settings` (JSONB), `Document.embedding` (vector)\n- **Alembic migrations** create GIN/HNSW indexes\n- **Settings** (`settings.DATABASE_WRITE_URL`, `settings.DATABASE_READ_URL`) configure engines\n- **Services** use `SessionLocal()` → auto-routes via `RoutingSession`\n\n---\n\n## Usage Checklist\n\n- [ ] Add `joinedload` for all relationship accesses in loops\n- [ ] Create GIN index on JSONB columns before querying nested keys\n- [ ] Create HNSW index on vector columns before similarity search\n- [ ] Configure `DATABASE_READ_URL` for replica routing\n- [ ] Monitor `pg_stat_statements` for query performance\n\n---\n\n## Files\n\n```\ndocs/database/query-examples.md          # This reference\nbackend/app/core/database.py             # RoutingSession, engines\nbackend/app/models/user.py               # User, Role\nbackend/app/models/system_setting.py     # SystemSetting (JSONB)\nbackend/app/models/document.py           # Document (vector)\nalembic/versions/                        # Index migrations\n```","core-architecture-infrastructure-docs":"# Core Architecture & Infrastructure — docs\n\n# Core Architecture & Infrastructure Docs\n\nModule documents core backend infrastructure components: app settings, error handling, security utilities. Target source definitions reside in `app.modules.core`.\n\n## Structure\n\n```\nbackend/docs/modules/core/\n├── config.md       # Environment, runtime settings\n├── exceptions.md   # Domain exception hierarchies\n└── security.md     # Passwords, JWT token operations\n```\n\n## Documented Submodules\n\n### Configuration (`config.md`)\n\nDocuments `app.modules.core.config.Settings`.\n\nKey configuration attributes:\n* `DATABASE_URL`: Relational DB connection string.\n* `REDIS_URL`: Cache/broker connection string.\n* `SECRET_KEY`: Cryptographic signing key.\n* `CORS_ORIGINS`: Allowed cross-origin domains.\n\n### Exceptions (`exceptions.md`)\n\nDocuments error classes defined in `app.modules.core.exceptions`:\n\n* `AuthException`: Base auth error.\n* `EmailAlreadyExistsError`: User registration conflict.\n* `InvalidCredentialsError`: Login verification failure.\n* `ValidationError`: Input payload failure.\n* `TokenExpiredError`: Expired JWT payload.\n\n### Security (`security.md`)\n\nDocuments cryptographic functions in `app.modules.core.security`:\n\n* `hash_password`: Passlib/bcrypt password hashing.\n* `verify_password`: Cleartext comparison against stored hash.\n* `create_access_token`: JWT token encoder with expiry claims.\n* `verify_token`: JWT decoder, signature validator.\n\n## Generation Pattern\n\nUses `mkdocstrings` Python handler. Injects docstrings directly from `app.modules.core` source files at doc build time:\n\n```markdown\n::: app.modules.core.<submodule>.<symbol>\n    options:\n        show_source: true\n```","core-architecture-infrastructure-project-md":"# Core Architecture & Infrastructure — project.md\n\n# Core Architecture & Infrastructure\n\nArchitecture documentation defines structural boundaries, directory conventions, code sharing rules.\n\n## Module Layout\n\n```mermaid\ngraph TD\n    App[Application]\n    App --> Core[core/ - Infra, DB, Security]\n    App --> Modules[modules/ - Business Logic]\n    Modules --> ModuleA[modules/admin]\n    Modules --> ModuleB[modules/user]\n    Modules --> ModuleC[modules/dashboard]\n    ModuleA -. 3+ consumers .-> Shared[shared/ - Common Utilities]\n    ModuleB -. 3+ consumers .-> Shared\n    ModuleC -. 3+ consumers .-> Shared\n    Tests[tests/modules/] --> Modules\n```\n\n## Directory Responsibilities\n\n- `core/`: Application-level infrastructure. DB configuration, security middleware, base runtime setup.\n- `modules/`: Domain isolation. Each folder (`admin`, `user`, `dashboard`) holds isolated business logic.\n- `shared/`: Generic utilities. Code lives here only if consumed by 3+ business modules.\n- `tests/`: Module-mirrored test hierarchy. Test files live in `tests/modules/<module-name>/`.\n\n## Architectural Constraints\n\n- **Cross-module imports:** Do not use relative imports across module boundaries (avoid `../../other-module`). Use path aliases.\n- **Shared threshold:** Code used by 1 or 2 modules stays inside those modules. Move to `shared/` only when 3rd module requires it.\n- **Test location:** Tests mirror module layout. Do not put domain tests in root test folder; use `tests/modules/<module-name>/`.","core-architecture-infrastructure-setup-md":"# Core Architecture & Infrastructure — setup.md\n\n# Core Architecture & Infrastructure — Setup Guide\n\n## Purpose\n\nThis document defines the initial environment setup for the `vuetify-fastapi-ai-demo` project. It installs and configures the toolchain required for specification-driven development, AI-assisted documentation, and agentic skill management.\n\n## Prerequisites\n\n- Node.js ≥ 18 (for npm packages)\n- Git\n- Bash-compatible shell\n\n## Toolchain Overview\n\n| Tool | Purpose | Install Command |\n|------|---------|-----------------|\n| **OpenSpec CLI** | Specification-driven development, code generation from specs | `npm install -g @fission-ai/openspec@latest` |\n| **OpenWiki (LLM Wiki 2.0)** | Personal knowledge base + codebase documentation generator | `sudo npm install -g openwiki` |\n| **Understand Anything** | Codebase analysis and explanation plugin for opencode | `curl -fsSL https://raw.githubusercontent.com/Egonex-AI/Understand-Anything/main/install.sh \\| bash` |\n| **Agentic Awesome Skills** | Curated agent skills for development tasks | `npx agentic-awesome-skills --path .agents/skills --category development,backend --risk safe,none` |\n\n## Setup Procedure\n\n### 1. Initialize Project Repository\n\n```bash\nmkdir vuetify-fastapi-ai-demo\ncd vuetify-fastapi-ai-demo\ngit init\n```\n\n### 2. Install OpenSpec CLI\n\n```bash\nnpm install -g @fission-ai/openspec@latest\nopenspec --version  # verify\n```\n\n### 3. Initialize OpenSpec Project\n\n```bash\nopenspec init\n```\n\nThis creates the OpenSpec configuration and directory structure for specification files.\n\n### 4. Configure OpenWiki\n\n**Personal mode** (local knowledge base at `~/.openwiki/wiki`):\n```bash\nopenwiki personal --init\nopenwiki personal --update\n```\nSources: local repos, Gmail, Notion, Web Search, Hacker News, X/Twitter.\n\n**Code mode** (repository documentation at `./openwiki/`):\n```bash\nopenwiki --init\nopenwiki --update\n```\nGenerates documentation from the current codebase.\n\nEnvironment config: `~/.openwiki/.env`\n\n### 5. Install Understand Anything (opencode plugin)\n\n```bash\ncurl -fsSL https://raw.githubusercontent.com/Egonex-AI/Understand-Anything/main/install.sh | bash\n# or via opencode:\nopencode plugin marketplace add Egonex-AI/Understand-Anything\nopencode plugin install understand-anything\n```\n\n### 6. Install Agentic Awesome Skills\n\n```bash\nnpx agentic-awesome-skills --path .agents/skills --category development,backend --risk safe,none\n```\nInstalls curated skills into `.agents/skills/` for use with agentic workflows.\n\n## Configuration Files\n\n| File | Location | Purpose |\n|------|----------|---------|\n| OpenSpec config | Project root (created by `openspec init`) | Spec-driven development settings |\n| OpenWiki env | `~/.openwiki/.env` | API keys, source configuration |\n| Agent skills | `.agents/skills/` | Installed skill definitions |\n\n## Verification Checklist\n\n- [ ] `openspec --version` returns version string\n- [ ] `openwiki --version` returns version string\n- [ ] `opencode plugin list` shows `understand-anything`\n- [ ] `.agents/skills/` contains development/backend skills\n- [ ] `openwiki --update` generates docs in `./openwiki/`\n- [ ] `openwiki personal --update` populates `~/.openwiki/wiki/`\n\n## Integration Points\n\n- **OpenSpec** drives the specification → code workflow for the FastAPI + Vuetify stack\n- **OpenWiki code mode** produces living documentation consumed by LLMs and developers\n- **Understand Anything** enables natural-language codebase queries in opencode\n- **Agentic Skills** provide reusable automation for backend/frontend tasks\n\n## Troubleshooting\n\n| Issue | Resolution |\n|-------|------------|\n| `openspec` command not found | Ensure npm global bin is in PATH (`npm config get prefix`) |\n| OpenWiki personal init fails | Check `~/.openwiki/.env` for valid API keys |\n| Agent skills install fails | Run with `--risk safe,none` to avoid elevated-permission skills |\n| Understand Anything not loading | Restart opencode after plugin install |\n\n## Next Steps\n\nAfter setup complete:\n1. Define project specifications in OpenSpec format\n2. Run `openspec generate` to scaffold FastAPI/Vuetify structure\n3. Use `openwiki --update` to maintain living docs\n4. Leverage agent skills for repetitive development tasks","core-architecture-infrastructure-site":"# Core Architecture & Infrastructure — site\n\n# Core Architecture & Infrastructure — site\n\nPre-built static documentation site generated by MkDocs Material. Serves internal API reference and architecture docs for backend modules (`core`, `user`, `ai`).\n\n## Layout\n\n```\nbackend/site/\n└── modules/\n    └── core/\n        ├── config/index.html      # Settings documentation\n        ├── exceptions/index.html  # Error hierarchy documentation\n        └── security/index.html    # Auth and hashing utilities documentation\n```\n\n## Documented Subsystems\n\n```mermaid\ngraph TD\n    Config[core.config.Settings] --> Security[core.security]\n    Exceptions[core.exceptions] --> AuthFlow[Authentication Flow]\n    Security --> AuthFlow\n```\n\n### 1. Configuration (`app.modules.core.config`)\n\nPydantic settings loaded from envi
