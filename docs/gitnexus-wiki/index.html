:\n\n1. Review proposals before implementing any feature\n2. Follow the task checklist in each proposal\n3. Run verification commands after `/opsx:apply`\n4. Update `gitnexus analyze .`, `gitnexus wiki .`, and `openwiki --update` after changes\n5. Archive completed changes with `/opsx-archive`\n6. For module restructuring, scan existing directories first, then reorganize into `frontend/src/modules/`, `backend/app/modules/`, and `tests/modules/` with corresponding import updates\n7. For authentication features, ensure `withCredentials: true` in `frontend/src/services/api.ts` and HttpOnly cookie handling on the frontend","documentation-specifications-readme-md":"# Documentation & Specifications — README.md\n\n# README.md — Project Documentation & Specifications\n\n## Purpose\n\n`README.md` serves as the **primary entry point and specification document** for the Full-Stack Demo project. It defines:\n\n- Project scope and goals\n- Technology stack and architecture\n- Development methodology (modular TDD)\n- Setup, build, and deployment instructions\n- Observability and DevOps practices\n- Mapping of demonstrated competencies to job requirements\n\nThis file is the **single source of truth** for developers, reviewers, and stakeholders evaluating the project.\n\n---\n\n## How It Works\n\n`README.md` is a static Markdown file rendered by GitHub (or any Markdown viewer). It does not execute code. Its role is **documentation-as-specification**:\n\n1. **Describes** the project’s purpose, features, and architecture.\n2. **Instructs** developers on how to set up, run, test, and deploy the application.\n3. **Links** to other specification files (`OBSERVABILITY_SPEC.md`, `docker-compose.observability.yml`, `kubernetes/`, `.github/workflows/`).\n4. **Maps** project components to job requirement competencies (DevOps, AI Platform, Backend, Frontend, etc.).\n\nIt is **not** generated from code. It is hand-maintained and updated alongside major project changes.\n\n---\n\n## Key Components\n\n### 1. Project Goal & Key Features\n\nDefines the project as a **full-stack demo** integrating:\n\n- **Frontend**: Vue 3 + Vuetify\n- **Backend**: FastAPI (Python)\n- **AI/LLM**: OpenAI, Anthropic, Local LLMs, RAG, streaming chat\n- **Auth**: JWT access/refresh tokens\n- **DB**: PostgreSQL + SQLAlchemy + Alembic\n- **Async**: Dramatiq workers\n- **Testing**: Pytest (backend), Vitest (frontend)\n- **DevOps**: Docker, GitHub Actions, Kubernetes, OpenTelemetry stack\n\n### 2. Competency Mapping\n\nMaps project features to **Senior Software Engineer job requirements**, including:\n\n- DevOps (CI/CD, IaC)\n- System Maintenance (observability stack)\n- Container Usage (Docker Compose, entrypoint migrations)\n- Cloud Deployment (Azure/GCP via GitHub Actions)\n- System Architecture (modular backend/frontend)\n- Backend/Frontend Development\n- AI Platform Development\n- API Design & Documentation\n- Software Quality (linting, typing, testing)\n\n### 3. Development Methodology\n\nDocuments the **modular, domain-driven TDD approach**:\n\n- **Backend modules**: `backend/app/modules/` (e.g., `ai`, `auth`, `system`)\n- **Frontend modules**: `frontend/src/modules/`\n- Each module encapsulates endpoints, services, models, and tests.\n- TDD workflow: write failing test → implement → refactor.\n\n### 4. Observability & Monitoring\n\nSpecifies the **OpenTelemetry-based observability stack**:\n\n- **OpenTelemetry Collector**: telemetry aggregation\n- **Prometheus**: metrics\n- **Loki**: logs\n- **Tempo**: traces\n- **Grafana**: dashboards\n\nLinks to:\n- `OBSERVABILITY_SPEC.md`\n- `docker-compose.observability.yml`\n- `kubernetes/`\n\n### 5. Project Structure\n\nProvides a **tree view** of the repository:\n\n```\n.\n├── backend/\n│   ├── app/\n│   │   ├── api/\n│   │   ├── core/\n│   │   ├── modules/\n│   │   └── main.py\n│   ├── alembic/\n│   ├── Dockerfile\n│   └── tests/\n├── frontend/\n│   ├── src/\n│   │   ├── components/\n│   │   ├── composables/\n│   │   ├── layouts/\n│   │   ├── modules/\n│   │   ├── router/\n│   │   ├── services/\n│   │   ├── stores/\n│   │   └── views/\n│   ├── Dockerfile\n│   └── src/__tests__/\n├── docker-compose.yml\n└── .env.example\n```\n\n### 6. Setup & Run Instructions\n\n#### Backend\n\n```bash\ncd backend\nuv sync\nuv run uvicorn app.main:app --reload\n```\n\n#### Frontend\n\n```bash\ncd frontend\nnpm install\nnpm run dev\n```\n\n#### Docker\n\n```bash\ncp .env.example .env\ndocker compose up\n```\n\n#### Podman\n\n```bash\ncp .env.example .env\npodman compose up\n```\n\n### 7. API Endpoints\n\nDocuments key endpoints:\n\n- `GET /api/v1/health`\n- `GET /api/v1/dashboard/stats`\n- `GET /api/v1/users`\n- `POST /api/v1/auth/register`\n- `POST /api/v1/auth/login`\n- `GET /api/v1/users/me`\n\n### 8. Testing\n\n- **Backend**: `cd backend && uv run pytest`\n- **Frontend**: `cd frontend && npm run test`\n\n### 9. Kubernetes / GCP Deployment\n\nLinks to `deploy-k8s.sh` and `kubernetes/` directory.\n\n### 10. Frontend Layout Architecture\n\nDocuments the **layout component pattern**:\n\n- `src/layouts/DefaultLayout.vue` — main layout\n- `App.vue` must use `<DefaultLayout />`\n- Pre-commit hook enforces layout usage\n\n---\n\n## Connections to Codebase\n\n`README.md` is the **top-level document** that references and contextualizes all other modules:\n\n| Component | Referenced In |\n|----------|---------------|\n| `backend/app/` | Project Structure, Setup, API Endpoints |\n| `frontend/src/` | Project Structure, Setup, Layout Architecture |\n| `docker-compose.yml` | Docker, Podman |\n| `OBSERVABILITY_SPEC.md` | Observability & Monitoring |\n| `kubernetes/` | Kubernetes / GCP Deployment |\n| `.github/workflows/` | CI/CD (implied) |\n| `deploy-k8s.sh` | Kubernetes / GCP Deployment |\n| `backend/alembic/` | Alembic Migrations |\n| `backend/tests/`, `frontend/src/__tests__/` | Testing |\n\n---\n\n## Maintenance Notes\n\n- Update `README.md` when adding new endpoints, changing setup steps, or modifying project structure.\n- Keep competency mapping aligned with evolving job requirements.\n- Ensure links to `OBSERVABILITY_SPEC.md`, `kubernetes/`, and `.github/workflows/` remain valid.\n- Pre-commit hook for frontend layout enforcement is documented but not implemented in this file — see `frontend/` for hook config.","documentation-specifications-scripts":"# Documentation & Specifications — scripts\n\n`docs-update.sh` updates API docs and changelog in one atomic flow.\n\n### Purpose  \nAutomates documentation sync: regenerates OpenAPI spec, validates MkDocs build, logs changes, opens PR.  \n\n### How it works  \n1. Requires change description as argument  \n2. Checks out `master`, pulls latest  \n3. Creates branch `docs/update-<timestamp>`  \n4. Runs `update_openapi.py` in `backend/` to regenerate OpenAPI spec  \n5. Runs `mkdocs build --strict` to validate docs  \n6. Appends changelog entry to `docs/changelog/updates.md`  \n7. Commits all changes with `docs: <description>`  \n8. Pushes branch and creates GitHub PR  \n\n### Key components  \n- `update_openapi.py`: Generates OpenAPI spec from backend code (assumed to exist)  \n- `mkdocs`: Static site generator for docs (must be installed via `uv`)  \n- `gh`: GitHub CLI (must be installed and authenticated)  \n\n### Integration  \n- Depends on `backend/` structure and `update_openapi.py` output  \n- Output: `docs/` directory updated, PR opened in GitHub  \n- No inbound calls — triggered manually or via CI  \n\n### Requirements  \n- `git`, `uv`, `gh` installed  \n- GitHub token configured for `gh`  \n- `update_openapi.py` must exist and write to `docs/openapi.yaml`  \n\n```mermaid\ngraph LR\nA[Run docs-update.sh] --> B[Checkout master]\nB --> C[Create docs branch]\nC --> D[Regenerate OpenAPI]\nD --> E[Build docs]\nE --> F[Add changelog]\nF --> G[Commit & push]\nG --> H[Create PR]\n```\n\n→ skipped: auto-merge, CI trigger  \nadd when: team requires zero-touch deploys","documentation-specifications-specs-architecture":"# Documentation & Specifications — specs-architecture\n\n# Project Architecture Specification\n\nStandardize code organization. Prevent dependency rot.\n\n## Directory Structure\n\n- `modules/`: Domain logic (admin, user, dashboard).\n- `shared/`: Common code. Use only if 3+ modules consume.\n- `core/`: Backend foundation. Security, DB, global config.\n- `tests/`: Mirror module structure.\n\n```mermaid\ngraph TD\nRoot --> modules\nRoot --> shared\nRoot --> core\nRoot --> tests\nmodules --> DomainLogic\ntests --> modules\n```\n\n## Testing Alignment\n\n- Frontend: `modules/<module-name>/__tests__/`.\n- Backend: `tests/modules/<module-name>/`.\n- Global utils: `tests/` root.\n- No flat root `tests/` directory for module logic.\n\n## Import Strategy\n\n- Cross-module relative paths forbidden.\n- Use aliases: `@/modules/<name>/...`.\n- Maintain strict module boundaries.\n\n→ skipped: automated lint enforcement, add when circular dependencies occur.","documentation-specifications-todo":"# Documentation & Specifications — todo\n\n# Documentation & Specifications — Todo Module\n\nDocumentation and technical specification for full-stack application architecture (Vue 3/Vuetify frontend, FastAPI backend, PostgreSQL, Dramatiq workers, OpenTelemetry monitoring).\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    Client[Browser Client] --> FE[Frontend: Vue 3 + Vuetify :5173]\n    FE -->|HTTP / Axios| BE[Backend: FastAPI :8000]\n    BE -->|SQLAlchemy / Alembic| DB[(PostgreSQL)]\n    BE -->|Async Tasks| Worker[Dramatiq Worker]\n    BE -->|LLM API| LLM[LLM Providers: OpenAI/Anthropic/Local]\n    BE -.->|Traces / Logs / Metrics| OTel[OpenTelemetry Collector]\n    OTel --> Prom[Prometheus]\n    OTel --> Loki[Loki]\n    OTel --> Tempo[Tempo]\n    Prom & Loki & Tempo --> Grafana[Grafana Dashboards]\n```\n\nDomain-driven design and Modular TDD structure applied across `backend/app/modules/` and `frontend/src/modules/`.\n\n---\n\n## Directory Layout\n\n```\n.\n├── backend/\n│   ├── alembic/              # Migration scripts\n│   ├── app/\n│   │   ├── api/v1/           # Versioned API routes\n│   │   ├── core/             # DB, config, security setup\n│   │   ├── modules/          # Feature domains (ai, auth, system)\n│   │   └── main.py           # FastAPI entrypoint\n│   ├── pyproject.toml        # Dependencies (uv lockfile)\n│   └── tests/                # Pytest suites\n├── frontend/\n│   ├── src/\n│   │   ├── layouts/          # Layout wrapper components\n│   │   ├── modules/          # Domain components & routes\n│   │   ├── stores/           # Pinia state modules\n│   │   ├── composables/      # useApi and shared composables\n│   │   └── views/            # Route pages\n│   ├── package.json          # Node dependencies\n│   └── tsconfig.json         # TypeScript config\n├── docker-compose.yml        # Multi-service setup\n└── .env.example              # Env var template\n```\n\n---\n\n## Backend Implementation\n\nFastAPI handles routing, dependency injection, and data persistence via SQLAlchemy ORM.\n\n### Key Components\n- `app/core/config.py`: Pydantic Settings reads from `.env`.\n- `app/core/database.py`: Session factory and engine management. FastAPI route dependency injection provides sessions.\n- `app/core/security.py`: JWT token generation and validation.\n- `entrypoint.sh`: Runs `alembic upgrade head` on container startup before booting Uvicorn.\n\n### Local Run Commands\n\n```bash\ncd backend\nuv sync\nuv run uvicorn app.main:app --reload\n```\n\nGenerate Alembic migrations:\n```bash\ndocker compose exec backend uv run alembic revision --autogenerate -m \"Migration description\"\n```\n\n---\n\n## Frontend Implementation\n\nVue 3 using Composition API, TypeScript, Vuetify components, and Pinia stores.\n\n### Layout Wrapper Rule\n`App.vue` must not contain direct layout UI elements. Must wrap views inside layout components:\n\n```vue\n<template>\n  <DefaultLayout />\n<\/template>\n\n<script setup lang=\"ts\">\nimport DefaultLayout from '@/modules/layouts/DefaultLayout.vue'\n<\/script>\n```\n\n*Note:* Pre-commit hook enforces layout usage in `App.vue`.\n\n### Core Services\n- `src/composables/useApi.ts`: Axios client handling base URLs, authentication tokens, and request/response interceptors.\n- `src/stores/auth.ts`: User session state.\n- `src/stores/theme.ts`: UI theme persistence (dark/light).\n\n### Local Run Commands\n\n```bash\ncd frontend\nnpm install\nnpm run dev\n```\n\n---\n\n## API Specification\n\nEndpoints prefixed with `/api/v1`. OpenAPI docs served at `/docs`.\n\n| Method | Path | Description |\n|---|---|---|\n| `GET` | `/health` | Legacy health check |\n| `GET` | `/api/v1/health` | Service health status |\n| `POST` | `/api/v1/auth/register` | Register user account |\n| `POST` | `/api/v1/auth/login` | Authenticate user and issue JWT cookie |\n| `GET` | `/api/v1/users/me` | Fetch active user profile |\n| `GET` | `/api/v1/users` | List mock user records |\n| `GET` | `/api/v1/dashboard/stats` | Return system metrics (user count, active sessions, API calls) |\n\n---\n\n## Observability Infrastructure\n\nMonitored via OpenTelemetry SDK integration.\n\n- **OpenTelemetry Collector**: Ingests traces, metrics, logs.\n- **Prometheus**: Scrapes time-series metrics.\n- **Loki**: Ingests structured logs enriched with `trace_id`.\n- **Tempo**: Stores distributed traces.\n- **Grafana**: Pre-configured dashboards for backend latency, error rates, frontend component render times.\n\n---\n\n## Testing & Containerization\n\n### Test Execution\n\nRun backend tests:\n```bash\ncd backend && uv run pytest\n```\n\nRun frontend unit tests:\n```bash\ncd frontend && npm run test\n```\n\n### Docker / Podman Orchestration\n\n```bash\ncp .env.example .env\n\n# Docker\ndocker compose up\n\n# Podman\npodman compose up\n```\n\nExposed default ports:\n- Frontend: `5173`\n- Backend: `8000`","documentation-specifications":"# Documentation & Specifications\n\nDocumentation & Specifications — Core\n\n`README.md` is the single source of truth. All other docs serve it.\n\n`AGENTS.md` enforces tool order: `codebase-memory` → `GitNexus` → `OpenWiki` → `OpenSpec`. No raw grep. No guesswork.\n\n`AGENTS.sample.md` templates agent configs. Standardizes stack, commands, conventions. Used by `docs-agents` and `openspec`.\n\n`openspec/` drives spec-first development. `config.yaml` defines schema. `openspec-changes/` tracks each change as dated dir with `design.md`, `proposal.md`, `specs/`, `tasks.md`. `openspec-specs` aggregates Gherkin-style requirements across backend, frontend, infra.\n\n`openwiki/` is the canonical wiki. `index.md` maps architecture, APIs, RAG, observability. `INSTRUCTIONS.md` governs updates. `knowledgeGraph.sh` auto-generates wiki from `gitnexus` + `openwiki --update`.\n\n`backend-docs` and `backend-site` build static API docs. `mkdocs.yml` + `mkdocstrings` extract Google-style docstrings from `app/modules/`. `generate_nav.py` syncs filesystem to `nav:` in `mkdocs.yml`. `update_openapi.py` generates OpenAPI JSON from FastAPI app.\n\n`backend-tests` validates `/docs/internal/` endpoint serves built HTML. `client` fixture hits `/docs/internal/` → asserts 200 + `text/html`.\n\n`docs/` holds operational guides: `cypress-testing-guide.md`, `feature-dev-workflow.md`, `security-analysis.md`.\n\n`docs-research` evaluates Vue charting libs: `vue3-apexcharts`, `vue-echarts`, `vue-chartjs`.\n\n`docs-architecture-decisions` stores ADRs: ChromaDB vs PGVector, modular monolith, embedding consistency.\n\n`docs-changelog` tracks changes: `updates.md` index + dated `.md` files per change.\n\n`prompts.md` lists feature proposals. Acts as roadmap + execution checklist.\n\n`scripts/docs-update.sh` atomic doc pipeline: regenerate OpenAPI → build MkDocs → log change → open PR.\n\n`specs-architecture` enforces module boundaries: `modules/`, `core/`, `shared/`, `tests/` mirror. No cross-module relative imports. Aliases only: `@/modules/<name>`.\n\n`todo` diagrams full-stack: Vue → FastAPI → PostgreSQL → Dramatiq → LLM → OpenTelemetry → Grafana.\n\nAll docs are static. No runtime. No execution. Only generation, validation, and reference.\n\n`knowledgeGraph.sh` → `gitnexus` → `openwiki` → `mkdocs` → `docs-update.sh` → `openspec-changes/` → `README.md`\n\nOne flow: Change → Spec → Code → Doc → Validate → PR.\n\n```mermaid\nflowchart LR\n    A[openspec-changes/] --> B[docs-update.sh]\n    B --> C[update_openapi.py]\n    B --> D[generate_nav.py]\n    B --> E[docs/changelog/updates.md]\n    C --> F[mkdocs build]\n    D --> F\n    F --> G[backend/site/]\n    G --> H[/docs/internal/]\n    H --> I[backend-tests/test_docs_mount.py]\n    I --> J[README.md]\n    K[openwiki/] --> L[knowledgeGraph.sh]\n    L --> M[AGENTS.md]\n    M --> N[Agent Query]\n    N --> O[OpenSpec / OpenWiki]\n    O --> J\n```","frontend-shell-ui-components":"# Frontend Shell & UI Components\n\n# Frontend Shell & UI Components\n\nVue 3 + Vuetify 3 application shell. Handle layout orchestration, theme state, routing, and observability integration.\n\n## Core Architecture\n\nApp use dynamic layout injection in `App.vue`. Route meta field `layout` determine component.\n\n```mermaid\ngraph TD\n    A[App.vue] --> B{Route Meta}\n    B -- layout[\"layout:\"] 'auth' --> C[AuthLayout]\n    B -- default --> D[DefaultLayout]\n    D --> E[v-app-bar]\n    D --> F[v-navigation-drawer]\n    D --> G[v-main / router-view]\n```\n\n## Key Components\n\n### App Shell (`App.vue`)\nRoot component. Switch between `DefaultLayout` and `AuthLayout` via `computed` property.\n\n### Default Layout (`DefaultLayout.vue`)\nMain UI wrapper. \n- **Navigation**: Responsive drawer. `temporary` on mobile, `v-side-navigation-drawer` on desktop.\n- **Theme Toggle**: Trigger `themeStore.toggleTheme()`. Increment OTel counter `theme_toggle_count`.\n- **Role Access**: Hide/show Admin links via `authStore.user.roles`.\n\n### Theme Store (`src/stores/theme.ts`)\nPinia store manage `isDark` state.\n- **Persistence**: Save to `localStorage`.\n- **System Sync**: `initTheme` check `prefers-color-scheme`.\n- **DOM Sync**: `applyTheme` set `data-theme` attribute on `html` element.\n\n## Routing & Security (`src/router/index.ts`)\n\nVue Router handle navigation and guards.\n\n- **Auth Guard**: `beforeEach` check `meta.requiresAuth`. Redirect to `/login` if no session.\n- **Admin Guard**: Check `meta.requiresAdmin` and user roles. Redirect to `/` if unauthorized.\n- **Metrics**: `afterEach` call `recordPageView` for OTel tracking.\n\n## UI Configuration (`src/plugins/vuetify.ts`)\n\nVuetify 3 setup with custom color palettes.\n- **Light Theme**: Primary `#1976D2`, Surface `#FFFFFF`.\n- **Dark Theme**: Primary `#90CAF9`, Surface `#1E1E1E`.\n- **Icons**: Material Design Icons (`@mdi/font`).\n\n## Observability Integration\n\nInitialized in `main.ts` before app mount.\n- **Tracing**: `setupObservability` hook into document load and user interaction.\n- **Interceptors**: `axiosInstrumentation` and `routerInstrumentation` track network and navigation spans.\n\n## Deployment & Proxy (`nginx.conf`)\n\nNginx serve production build.\n- **SPA Routing**: `try_files $uri $uri/ /index.html` handle client-side routes.\n- **API Proxy**: Forward `/api/` to `http://backend:8000`.\n- **Metrics**: `/nginx_status` enabled for internal network scraping.\n\n## Testing\n\n### E2E Flow (`cypress/e2e/criticalUserFlow.cy.ts`)\nTest full RAG pipeline:\n1. Login via `LoginForm`.\n2. Navigate to `/documents`.\n3. Upload PDF via `attachFile`.\n4. Query RAG system in `/rag`.\n5. Assert response visibility.\n\n### Unit Tests\nVitest run in `happy-dom` environment. Config in `vitest.config.ts`.\n\n## Development Commands\n\n- `npm run dev`: Start Vite server on port 5173.\n- `npm run build`: Generate production assets in `dist/`.\n- `npm test`: Run Vitest suite.\n- `npm run cypress:run`: Execute E2E tests headless.\n\n→ skipped: complex component library, add when UI scale.\n→ skipped: server-side rendering, add when SEO need.","observability-tracing-app":"# Observability & Tracing — app\n\n# Observability & Tracing Module\n\n## Purpose\n\nProvides OpenTelemetry integration for distributed tracing, metrics, and structured logging. Gracefully degrades when OTEL Collector is unreachable.\n\n## Key Components\n\n### `setup_observability(app: FastAPI, engine=None)`\n\nMain entry point. Configures:\n- **TracerProvider**: Distributed tracing with OTLP exporter\n- **MeterProvider**: Metrics collection with periodic export\n- **LoggerProvider**: Structured JSON logging with trace context\n- **Instrumentations**: FastAPI, HTTPX, SQLAlchemy, system metrics\n\n**Flow**:\n1. Check OTEL Collector availability via TCP socket\n2. If available: configure full OTLP pipeline with all providers\n3. If unavailable: configure metrics-only, skip tracing/logging\n4. Apply instrumentations regardless of collector status\n\n### `is_otel_collector_available(endpoint, timeout=1.0) -> bool`\n\nTCP connectivity check to OTEL Collector gRPC endpoint. Parses URL, attempts socket connection.\n\n### `traced(name: str = None)`\n\nDecorator for manual function tracing. Wraps sync/async functions with OpenTelemetry spans. Sets `function` attribute on span.\n\n```python\n@traced()\nasync def my_function():\n    ...\n```\n\n### `tracer`\n\nModule-level tracer instance from `trace.get_tracer(__name__)`.\n\n## Architecture\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│                    FastAPI Application                       │\n└─────────────────────┬─────────────────────────────────────────┘\n                      │\n┌─────────────────────▼─────────────────────────────────────────┐\n│              setup_observability()                             │\n│  ┌─────────────────────────────────────────────────────────┐  │\n│  │  OTEL Collector Available?                               │  │\n│  │  Yes: Full pipeline (traces/metrics/logs)               │  │\n│  │  No:  Metrics only                                     │  │\n│  └─────────────────────────────────────────────────────────┘  │\n└─────────────────────┬─────────────────────────────────────────┘\n                      │\n┌─────────────────────▼─────────────────────────────────────────┐\n│                 Instrumentations                               │\n│  • FastAPIInstrumentor (HTTP tracing)                        │\n│  • HTTPXClientInstrumentor (outbound HTTP)                   │\n│  • SQLAlchemyInstrumentor (DB queries)                       │\n│  • SystemMetricsInstrumentor (CPU/memory)                    │\n└─────────────────────────────────────────────────────────────┘\n```\n\n## Integration Points\n\n### Application Bootstrap\n\n```python\n# backend/app/main.py\nfrom app.modules.core.observability import setup_observability\n\ndef create_app():\n    app = FastAPI()\n    setup_observability(app, engine=db_engine)\n    return app\n```\n\n### Manual Tracing\n\n```python\nfrom app.modules.core.observability import traced\n\n@traced(\"custom-operation-name\")\nasync def business_logic():\n    ...\n```\n\n### Function Execution Tracing\n\n```python\n# backend/app/modules/core/tracing.py\nfrom app.modules.core.tracing import trace_execution\n\n@trace_execution\nasync def slow_operation():\n    ...\n```\n\nRecords duration to `trace_entries` table when `TraceConfiguration.enabled=True` for \"admin\" service.\n\n## Configuration\n\nSettings from `app.modules.core.config`:\n- `OTEL_COLLECTOR_ENDPOINT`: gRPC endpoint (default: `http://localhost:4317`)\n- `OTEL_COLLECTOR_HTTP_ENDPOINT`: HTTP endpoint for connectivity check\n- `SERVICE_NAME`: Service identifier in OTEL\n\n## Test Coverage\n\n- `test_observability.py`: Validates span export via mocked OTLP exporters\n- `test_tracing.py`: Tests `trace_execution` decorator with database persistence","observability-tracing-cypress":"# Observability & Tracing — cypress\n\n# Observability E2E Test\n\n`frontend/cypress/e2e/observability.cy.ts`\n\nVerifies frontend OpenTelemetry metrics export pipeline. Confirms browser metrics reach OpenTelemetry Collector Prometheus endpoint.\n\n## Architecture Flow\n\n```mermaid\nflowchart LR\n    Browser[\"Cypress / Browser (:5173)\"] -->|Export Metrics| Collector[\"OTel Collector Prometheus Exporter (:8889)\"]\n    Cypress[\"Cypress Test Runner\"] -->|cy.visit| Browser\n    Cypress -->|cy.request /metrics| Collector\n```\n\n## Test Specification\n\nSuite: `Observability E2E`\nTest case: `sends metrics to the collector`\n\n### Execution Steps\n\n1. **Visit Frontend**: Calls `cy.visit('http://localhost:5173')`. Triggers page load and frontend OpenTelemetry auto-instrumentation.\n2. **Wait for Export**: Calls `cy.wait(2000)`. Gives OTel SDK time to flush metrics batch to collector.\n3. **Query Metrics Endpoint**: Calls `cy.request('http://localhost:8889/metrics')` on OTel Collector Prometheus scrape target.\n4. **Assertions**:\n   - `expect(response.status).to.eq(200)`: Collector Prometheus endpoint reachable.\n   - `expect(response.body).to.include('document_load_duration_seconds')`: Confirms browser document load duration metric present.\n\n## Environment Requirements\n\n- Frontend dev server running on `http://localhost:5173`.\n- OpenTelemetry Collector running with Prometheus exporter active on `http://localhost:8889`.\n- Frontend OTel SDK configured to push web vitals/document load metrics to collector receiver.\n\n## Run Test\n\n```bash\nnpx cypress run --spec \"cypress/e2e/observability.cy.ts\"\n```","observability-tracing-docker-compose-observability-yml":"# Observability & Tracing — docker-compose.observability.yml\n\n# Observability Stack — docker-compose.observability.yml\n\n## Purpose\n\nLocal development observability stack. Collects traces, metrics, logs from services via OpenTelemetry Collector. Stores in Tempo (traces), Prometheus (metrics), Loki (logs). Visualizes in Grafana. Jaeger provides alternate trace UI. Alertmanager routes alerts; telegram-bot placeholder for notifications.\n\n## Architecture\n\n```mermaid\nflowchart LR\n    App[Application Services] -->|OTLP gRPC/HTTP| OTel[otel-collector]\n    OTel -->|Traces| Tempo[Tempo]\n    OTel -->|Metrics| Prom[Prometheus]\n    OTel -->|Logs| Loki[Loki]\n    OTel -->|Traces| Jaeger[Jaeger]\n    Prom -->|Alerts| AlertMgr[Alertmanager]\n    AlertMgr -->|Webhook| TGBot[telegram-bot]\n    Grafana[Grafana] --> Tempo\n    Grafana --> Prom\n    Grafana --> Loki\n    Grafana --> Jaeger\n    TestSender[test-sender] --> OTel\n```\n\n## Services\n\n| Service | Image | Ports | Role |\n|---------|-------|-------|------|\n| **otel-collector** | `otel/opentelemetry-collector-contrib:0.90.1` | 4317 (gRPC), 4318 (HTTP), 8889 (Prometheus) | Receives OTLP, exports to all backends |\n| **prometheus** | `prom/prometheus:v2.48.0` | 9090 | Metrics storage, scraping, alerting |\n| **alertmanager** | `prom/alertmanager:v0.27.0` | 9093 | Alert routing, deduplication |\n| **telegram-bot** | `alpine:latest` | — | Placeholder; replace with real bot image |\n| **grafana** | `grafana/grafana:10.2.2` | 3000 | Dashboards, datasources pre-provisioned |\n| **jaeger** | `jaegertracing/all-in-one:latest` | 16686, 14268, 14250 | Trace UI, receives from Tempo |\n| **loki** | `grafana/loki:2.9.2` | 3100 | Log aggregation |\n| **tempo** | `grafana/tempo:2.2.2` | 3200, 14268, 14250, 9411 | Trace storage, Jaeger/Zipkin compatible |\n| **test-sender** | `alpine/curl` | — | Sends test traces/metrics/logs to collector |\n\n## Data Flow\n\n1. **Applications** send OTLP to `otel-collector:4317` (gRPC) or `:4318` (HTTP)\n2. **Collector** processes via `collector-config.yml` (see below), forwards:\n   - Traces → Tempo (OTLP), Jaeger (gRPC/Thrift)\n   - Metrics → Prometheus (remote write), self-scraped on `:8889`\n   - Logs → Loki (OTLP)\n3. **Prometheus** scrapes collector metrics, evaluates rules, fires alerts to Alertmanager\n4. **Alertmanager** routes to telegram-bot webhook (placeholder)\n5. **Grafana** queries all backends via provisioned datasources\n6. **test-sender** runs once on startup, validates pipeline\n\n## Configuration Files (mounted)\n\n```\ndockerdata/observability/\n├── otel-collector/\n│   ├── collector-config.yml      # Receivers, processors, exporters\n│   └── test-sender.sh            # Generates sample telemetry\n├── prometheus/\n│   ├── prometheus.yml            # Scrape configs, remote write\n│   └── alertmanager.yml          # Alert routes, receivers\n├── grafana/\n│   ├── provisioning/datasources/ # Tempo, Prometheus, Loki, Jaeger\n│   └── provisioning/dashboards/  # Pre-built dashboards\n├── loki/\n│   └── loki-config.yml           # Storage, limits\n└── tempo/\n    └── tempo-config.yml          # Storage, receivers, compaction\n```\n\n## Collector Config (key points)\n\n`collector-config.yml` defines:\n- **Receivers**: `otlp` (grpc/http), `prometheus` (self-metrics)\n- **Processors**: `batch`, `memory_limiter`, `resource` (adds service.name)\n- **Exporters**: `otlp/tempo`, `otlp/jaeger`, `prometheus`, `loki`\n- **Pipelines**: traces → tempo+jaeger, metrics → prometheus, logs → loki\n\n## Startup\n\n```bash\ndocker compose -f docker-compose.observability.yml up -d\n```\n\n- Grafana: http://localhost:3000 (anonymous admin)\n- Prometheus: http://localhost:9090\n- Jaeger: http://localhost:16686\n- Tempo: http://localhost:3200\n- Alertmanager: http://localhost:9093\n\n## Integration with Application Code\n\nApplications must configure OpenTelemetry SDK to export to `http://otel-collector:4318` (HTTP) or `otel-collector:4317` (gRPC). Example (Python):\n\n```python\nfrom opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter\nexporter = OTLPSpanExporter(endpoint=\"http://otel-collector:4318/v1/traces\")\n```\n\nSet `OTEL_SERVICE_NAME` per service for trace correlation.\n\n## Volumes\n\n- `grafana_data` — named volume for Grafana DB (dashboards, users)\n- All other data bind-mounted under `./dockerdata/observability/` for persistence and config editing\n\n## Notes\n\n- `telegram-bot` is a stub. Replace with `ghcr.io/yourorg/telegram-alert-bot` or similar that accepts POST at `/alert`\n- `loki` runs as `user: \"0\"` for Podman/SELinux compatibility\n- `tempo` uses local filesystem storage (`/tmp/tempo`); not production-grade\n- `test-sender` exits after one run; check logs to verify pipeline: `docker compose -f docker-compose.observability.yml logs test-sender`\n\n## Extending\n\n- Add scrape targets in `prometheus.yml` for custom metrics\n- Add alert rules in `prometheus.yml` → `rule_files`\n- Add Grafana dashboards to `provisioning/dashboards/` (auto-loaded)\n- For production: enable TLS, authentication, object storage backends (S3/GCS) for Tempo/Loki","observability-tracing-docs":"# Observability & Tracing — docs\n\n# Observability & Tracing Docs\n\nDocumentation and metric reference samples for backend (FastAPI/CPython) and frontend OpenTelemetry + Prometheus observability pipeline.\n\n## Pipeline Architecture\n\n```mermaid\nflowchart LR\n    FE[Frontend App] -->|OTel Metrics/Spans| Collector[OTel Collector]\n    BE[Backend FastAPI] -->|Prometheus Scrape| Prom[Prometheus Server]\n    BE -->|OTel Traces/Logs| Collector\n    Collector --> Prom\n    Collector --> Tempo[Tempo Tracing]\n    Collector --> Loki[Loki Logs]\n    Prom --> Grafana[Grafana Dashboard :3000]\n    Tempo --> Grafana\n    Loki --> Grafana\n```\n\n---\n\n## Metric Reference\n\n### Backend Metrics (`job=\"backend-service\"`)\n\nGenerated by `prometheus-fastapi-instrumentator` and OpenTelemetry Python SDK (`1.44.0`, CPython 3.11).\n\n| Metric | Type | Description | Key Labels |\n|---|---|---|---|\n| `http_server_duration_milliseconds` | Histogram | Request latency in ms | `http_method`, `http_status_code`, `http_target`, `http_server_name` |\n| `http_server_active_requests` | Gauge | Currently in-flight HTTP requests | `http_method`, `http_server_name` |\n| `http_server_request_size_bytes` | Histogram | Compressed incoming request body size | `http_method`, `http_target` |\n| `http_server_response_size_bytes` | Histogram | Compressed outgoing response body size | `http_method`, `http_target` |\n| `http_requests_total` | Counter | Legacy request counter | `handler`, `method`, `status` |\n| `http_request_duration_highr_seconds` | Histogram | High-resolution duration without route labels | `le` |\n| `process_cpu_seconds_total` | Counter | Total CPU spent in user/system space | None |\n| `process_resident_memory_bytes` | Gauge | Resident memory size (RSS) in bytes | None |\n| `python_gc_collections_total` | Counter | GC runs per generation | `generation=\"0\\|1\\|2\"` |\n| `target_info` | Gauge | Telemetry target metadata | `service_version`, `telemetry_sdk_version` |\n\n### Frontend Metrics (`job=\"frontend-app\"`)\n\nGenerated by `@opentelemetry/instrumentation-document-load` and `@opentelemetry/instrumentation-user-interaction`.\n\n| Metric | Type | Description | Key Labels |\n|---|---|---|---|\n| `frontend_app_page_view_total` | Counter | Total route views | `route_name`, `route_path` |\n| `frontend_app_button_click_total` | Counter | Button interaction events | `element_id`, `element_type`, `page_route` |\n| `frontend_app_form_submit_total` | Counter | Submitted forms count | `form_name`, `page_route` |\n| `frontend_app_component_render_duration_milliseconds` | Histogram | Component mount/render latency | `component_name`, `route_path` |\n| `http_client_duration_milliseconds` | Histogram | Outbound API client duration | `http_method`, `http_status_code`, `http_url` |\n\n---\n\n## Alert Rules Reference\n\nDefined in `alerts.yml`:\n\n```yaml\n# Backend Alerts\n- alert: HighBackendLatency\n  expr: histogram_quantile(0.95, sum(rate(http_server_duration_milliseconds_bucket{job=\"backend-service\"}[5m])) by (le, job)) > 200\n  for: 2m\n\n- alert: TooManyActiveBackendRequests\n  expr: sum(http_server_active_requests{job=\"backend-service\"}) > 50\n  for: 5m\n\n- alert: HighErrorRate\n  expr: rate(http_server_duration_milliseconds_count{status=~\"5..\"}[5m]) > 0.05\n  for: 1m\n\n- alert: ServiceDown\n  expr: up == 0\n  for: 1m\n\n# Frontend Alerts\n- alert: SlowComponentRender\n  expr: histogram_quantile(0.95, sum(rate(frontend_app_component_render_duration_milliseconds_bucket[5m])) by (le, component_name)) > 500\n  for: 5m\n\n- alert: PageViewDrop\n  expr: increase(frontend_app_page_view_total{job=\"frontend-app\"}[10m]) < 1\n\n- alert: HighFrontendClientLatency\n  expr: histogram_quantile(0.95, sum(rate(http_client_duration_milliseconds_bucket{job=\"frontend-app\"}[5m])) by (le, http_url)) > 1000\n  for: 2m\n\n- alert: NoLoginButtonClicks\n  expr: increase(frontend_app_button_click_total{element_id=\"login-submit\"}[15m]) == 0\n  for: 15m\n```\n\n---\n\n## Custom Metric Instrumentation\n\nFollow OpenTelemetry semantic naming: `{domain}_{action}_{unit}`.\n\n### Python Backend Example\n\n```python\nfrom opentelemetry import metrics\n\nmeter = metrics.get_meter(\"myapp\")\norder_counter = meter.create_counter(\"order_created_total\")\norder_counter.add(1, {\"status\": \"success\", \"payment_method\": \"credit_card\"})\n```\n\n---\n\n## Verification & Troubleshooting\n\n### Stack Boot\n\n```bash\ndocker-compose -f docker-compose.yml -f docker-compose.override.yml up -d\n```\n\n### Dashboard Access\n\n- **Location**: `http://localhost:3000`\n- **Auth**: `admin` / `admin`\n\n### Dashboards\n\n1. **System Overview**: Cluster health, CPU, memory (`process_resident_memory_bytes`), disk.\n2. **FastAPI Metrics**: Request rate (`http_server_duration_milliseconds_count`), p50/p95/p99 latency, error rates.\n3. **OpenTelemetry Collector**: Export throughput for spans/metrics/logs.\n4. **Tempo Traces**: Trace waterfall views.\n5. **Loki Logs**: Query via `{service=\"backend\"}` or `{service=\"frontend\"}`.\n\n### Debugging Steps\n\n1. No data in Prometheus: Check `/metrics` endpoint returns `200` and target state `UP`.\n2. Missing Traces: Check OTel exporter endpoint connection to Tempo datasource on collector port `4317`/`4318`.\n3. Missing Logs: Check Loki log shipper container and service label tags.","observability-tracing-observability-check-sh":"# Observability & Tracing — observability.check.sh\n\n# Observability Stack Health Check Script\n\n## Purpose\n\n`observability.check.sh` validates the entire observability stack (Prometheus, Loki, Tempo, Otel-Collector, Backend) is running and correctly exporting/receiving metrics, logs, and traces. Runs as a standalone verification script after stack deployment.\n\n## How It Works\n\nScript executes sequential health checks against local endpoints. Each check:\n1. Queries a specific HTTP endpoint or Docker status\n2. Validates expected response pattern\n3. On failure: prints colored error, shows recent error logs via `show_service_logs()`\n4. Continues to next check (non-blocking)\n\nAll checks target `localhost` ports — assumes stack runs via `podman-compose` on host network.\n\n## Key Components\n\n### `show_service_logs(service, lines=50)`\nHelper that fetches recent logs for a failed service, filters for error-level keywords (`error|fail|exception|panic|fatal|critical|warning`), displays first 20 matches.\n\n### Check Sequence\n\n| # | Check | Target | Success Criteria |\n|---|-------|--------|------------------|\n| 1 | Container status | `podman-compose ps` | All `vue-python-demo` containers show `Up` |\n| 2 | Prometheus `up` | `localhost:9090/api/v1/query?query=up` | `otel-collector:8889` target present |\n| 3 | Prometheus metrics | `localhost:9090/api/v1/query?query=http_server_duration_milliseconds_count` | Non-empty result array |\n| 4 | Loki readiness | `localhost:3100/ready` | Returns `\"ready\"` |\n| 5 | Loki logs | `localhost:3100/loki/api/v1/query?query={service_name=\"backend-service\"}` | Streams array present |\n| 6 | Tempo readiness | `localhost:3200/ready` | Returns `\"ready\"` |\n| 7 | Otel-Collector export | Loki query for `backend-service` | **Empty** streams = FAIL (inverted logic) |\n| 8 | Backend health | `localhost:8000/health` | HTTP 200 |\n\n> **Note**: Check 7 logic inverted — `OTEL_LOGS` counts empty streams (`\"streams\":[]`). Count > 0 = FAIL. This detects missing log export.\n\n## Mermaid: Health Check Flow\n\n```mermaid\nflowchart TD\n    A[Start] --> B[1. Container Status]\n    B --> C[2. Prometheus up]\n    C --> D[3. Prometheus Metrics]\n    D --> E[4. Loki Ready]\n    E --> F[5. Loki Logs]\n    F --> G[6. Tempo Ready]\n    G --> H[7. Otel Export Check]\n    H --> I[8. Backend Health]\n    I --> J[Complete]\n    \n    style B fill:#e1f5fe\n    style C fill:#e1f5fe\n    style D fill:#e1f5fe\n    style E fill:#f3e5f5\n    style F fill:#f3e5f5\n    style G fill:#fff3e0\n    style H fill:#e8f5e9\n    style I fill:#e8f5e9\n```\n\n## Integration Points\n\n- **podman-compose**: Orchestrates all services; script assumes project name `vue-python-demo`\n- **Prometheus** (9090): Scrapes metrics from otel-collector (8889) and backend\n- **Loki** (3100): Receives logs from otel-collector via `service_name=\"backend-service\"` label\n- **Tempo** (3200): Receives traces (readiness only — no trace query check)\n- **Otel-Collector** (8889): Exports metrics/logs/traces; Prometheus scrape target\n- **Backend** (8000): Application instrumented with OTEL; `/health` endpoint\n\n## Usage\n\n```bash\n# From repo root (where podman-compose.yml lives)\n./observability.check.sh\n```\n\n## Common Failure Modes\n\n| Check | Typical Cause |\n|-------|---------------|\n| 1 | Container crash, port conflict, image pull failure |\n| 2 | Otel-collector not scraping, wrong target config |\n| 3 | Backend not instrumented, metric name mismatch |\n| 4/5 | Loki not started, otel-collector log exporter misconfigured |\n| 6 | Tempo not started, otel-collector trace exporter misconfigured |\n| 7 | `SERVICE_NAME` env var missing, otel-collector Loki exporter broken |\n| 8 | Backend process dead, port 8000 not exposed |\n\n## Extending\n\nAdd new checks by appending to script:\n```bash\necho -n \"N. New service: \"\nif curl -s \"http://localhost:PORT/health\" | grep -q \"ok\"; then\n    echo -e \"${GREEN}OK${NC}\"\nelse\n    echo -e \"${RED}FAIL${NC}\"\n    show_service_logs service-name\nfi\n```\n\nKeep `show_service_logs` calls consistent for debugging.","observability-tracing-observability-spec-md":"# Observability & Tracing — OBSERVABILITY_SPEC.md\n\n# Observability Specification\n\nSpecification defines metrics, monitoring, alerting architecture for full stack.\n\n## Architecture\n\n```mermaid\ngraph LR\n    BE[FastAPI Backend] -->|OTLP| OC[OTel Collector]\n    FE[Vue Frontend] -->|OTLP| OC\n    NG[Nginx + Exporter] -->|Scrape| OC\n    OC -->|Scrape| PR[Prometheus]\n    PR --> GF[Grafana]\n    PR --> AM[Alertmanager]\n```\n\n## Instrumentation Layer\n\n- **Backend (FastAPI)**: Instrument via `prometheus-fastapi-instrumentator`. Emits OpenTelemetry metrics. Targets Latency (< 200ms P95) and Availability (> 99.9%) SLIs.\n- **Frontend (Vue)**: Real User Monitoring (RUM) via `@opentelemetry/instrumentation-document-load` and `@opentelemetry/instrumentation-user-interaction`.\n- **Proxy (Nginx)**: Exposes metrics via `stub_status` module. Scraped by `nginx-prometheus-exporter`. Tracks active connections, request rates, status codes.\n\n## Collection & Storage Pipeline\n\n- **OpenTelemetry Collector (`otel-collector`)**:\n  - Ingests OTLP from backend and frontend.\n  - Scrapes `nginx-prometheus-exporter` via Prometheus receiver.\n  - Adds `exported_job` label to preserve source service names.\n- **Prometheus**:\n  - Scrapes `otel-collector` endpoint.\n  - Evaluates alerting rules defined in `alerts.yml`.\n- **Grafana**:\n  - Prometheus configured as primary data source.\n  - Pre-built dashboards for backend, frontend, proxy.\n- **Alertmanager**:\n  - Handles alerts triggered by Prometheus rules.\n  - Local dev orchestrated via `podman-compose`.\n\n## Testing & Verification\n\n1. **Generation**: Validate metrics emission on backend, frontend, and `nginx-prometheus-exporter`.\n2. **Ingestion**: Query Prometheus to verify OTel Collector scrape success and label preservation.\n3. **Alert Validation**: Validate rule syntax via `promtool check rules alerts.yml`. Trigger simulated threshold spikes to verify `FIRING` state.\n\n## Operational Constraints\n\n- **Scope Boundary**: No distributed tracing (Jaeger/Zipkin) or log aggregation (Loki/ELK). No production notification transports (Slack, PagerDuty).\n- **Metric Reference**: Detailed metrics catalog documented in `docs/metrics-reference.md`.\n- **Known Issue**: Alertmanager container fails on start with `permission denied` on storage volume. Fix: adjust directory ownership (`chown`) or Podman security context.","observability-tracing-observability":"# Observability & Tracing — observability\n\n# Observability & Tracing — observability module\n\n## Overview\n- Centralizes metrics, traces, logs for all services.\n- Provides Grafana dashboards and alerting for health, performance, errors.\n\n## Architecture\n- Services emit OpenTelemetry data.\n- OTel collector receives → processes → forwards:\n  - Traces → Tempo\n  - Logs → Loki\n  - Metrics → Prometheus\n- Prometheus scrapes collector metrics and service metrics.\n- Tempo stores traces, Loki stores logs.\n- Grafana queries datasources (Prometheus, Tempo, Loki) to render dashboards.\n- Alertmanager evaluates Prometheus alert rules, sends notifications.\n\n## Key components\n- **Grafana dashboards** (`dockerdata/observability/grafana/provisioning/dashboards/*.json`):\n  - Overall, Backend, Frontend, Nginx.\n- **Provisioning** (`dashboards.yml`, `datasources.yml`).\n- **Loki** (`loki-config.yml`).\n- **OTel collector** (`otel-collector/collector-config.yml`).\n- **Tempo** (`tempo-config.yml`).\n- **Prometheus** (`prometheus.yml`, `alerts.yml`, `alert.rules`, `slo-alert.rules`).\n- **Alertmanager** (`alertmanager.yml`).\n- **Test sender** (`otel-collector/test-sender.sh`).\n\n## Data flow diagram\n```mermaid\nflowchart TD\n    A[Service (metrics/traces/logs)] --> B[OTel Collector]\n    B --> C[Tempo]\n    B --> D[Loki]\n    B --> E[Prometheus]\n    C --> F[Grafana (traces)]\n    D --> G[Grafana (logs)]\n    E --> H[Grafana (metrics)]\n    H --> I[Alertmanager]\n    I --> J[Notification channels]\n```\n\n## Dashboards\n- **Overall**: request rate, error rate, traces, logs.\n- **Backend**: availability, request rate, latency, traces, logs.\n- **Frontend**: page views, latency, button clicks, form submits, traces, logs.\n- **Nginx**: connections, request rate.\n\n## Alerting\n- Prometheus alert rules (`alerts.yml`, `alert.rules`, `slo-alert.rules`).\n- Alertmanager routes to telegram-webhook, pagerduty.\n- Alerts cover:\n  - High error rate\n  - Service down\n  - High backend latency\n  - Too many active backend requests\n  - Slow component render\n  - Page view drop\n  - High frontend client latency\n  - No login button clicks\n  - Nginx down\n  - High active connections\n  - High request rate\n  - Availability burn rate (SLO)\n\n## Configuration\n- Grafana provisioning mounts dashboards and datasources.\n- Loki, Tempo, Prometheus configs define storage and retention.\n- OTel collector defines pipelines and exporters.\n\n## Integration points\n- New service adds OpenTelemetry instrumentation.\n- Metrics appear in Prometheus scrape.\n- Traces flow to Tempo via OTel collector.\n- Logs flow to Loki.\n- Grafana dashboards automatically include new time series.\n\n## Maintenance\n- Update dashboard JSON to add panels.\n- Adjust Prometheus queries in dashboards.\n- Modify alert rules in `alerts.yml`.\n- Rotate logs/storage per backend configs.\n- Test OTel sender script for trace ingestion.","observability-tracing-research":"# Observability & Tracing — research\n\n# Observability & Tracing — Research\n\n## Purpose\n\nDesign OpenTelemetry integration for FastAPI backend and Vue.js frontend. Collect application metrics, traces, logs. Export to Prometheus, Jaeger/Tempo, Loki via OpenTelemetry Collector. Deploy with Docker Compose.\n\n## Architecture\n\n```mermaid\nflowchart LR\n    FE[Vue.js Frontend] -->|OTel JS SDK| Collector\n    BE[FastAPI Backend] -->|OTel Python SDK| Collector\n    Collector --> Prometheus[(Prometheus)]\n    Collector --> Jaeger[(Jaeger/Tempo)]\n    Collector --> Loki[(Loki)]\n    Prometheus --> Grafana[Grafana]\n    Jaeger --> Grafana\n    Loki --> Grafana\n```\n\n## Technology Stack\n\n| Layer | Technology |\n|-------|------------|\n| Backend | FastAPI + OpenTelemetry Python SDK |\n| Frontend | Vue.js + OpenTelemetry JavaScript SDK |\n| Metrics Export | Prometheus Exporter |\n| Traces/Logs Export | OTLP Exporter |\n| Collector | OpenTelemetry Collector |\n| Visualization | Grafana |\n| Deployment | Docker Compose + `docker-compose.override.yml` |\n\n## Key Components\n\n### Backend Instrumentation (Planned)\n- **Zero-code instrumentation** — auto-instrument FastAPI, SQLAlchemy, Redis, HTTP clients\n- **Process code instrumentation** — custom spans for business logic\n- **Route management instrumentation** — per-endpoint latency, error rates\n- **FastAPI instrumentation** — request/response hooks, middleware\n\n### Frontend Instrumentation (Planned)\n- **Pinia/Vuex instrumentation** — state change tracing\n- **Route management instrumentation** — navigation timing, component render spans\n- **FastAPI instrumentation** — correlate frontend requests with backend traces\n\n### Collector Configuration\n- Receivers: `otlp` (HTTP/gRPC) from backend and frontend\n- Processors: `batch`, `memory_limiter`, `resource` (add service.name, deployment.environment)\n- Exporters: `prometheus` (metrics), `otlp` (traces → Jaeger/Tempo, logs → Loki)\n\n## Deployment\n\n```yaml\n# docker-compose.override.yml (example structure)\nservices:\n  otel-collector:\n    image: otel/opentelemetry-collector-contrib\n    volumes:\n      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml\n    ports:\n      - \"4317:4317\"   # OTLP gRPC\n      - \"4318:4318\"   # OTLP HTTP\n      - \"8889:8889\"   # Prometheus scrape\n  prometheus:\n    image: prom/prometheus\n    volumes:\n      - ./prometheus.yml:/etc/prometheus/prometheus.yml\n  jaeger:\n    image: jaegertracing/all-in-one\n  loki:\n    image: grafana/loki\n  grafana:\n    image: grafana/grafana\n```\n\n## Current Status\n\nResearch phase only. No implementation exists. Decisions documented; code not written.\n\n## Future Work\n\n1. Implement zero-code instrumentation (backend + frontend)\n2. Implement process code instrumentation (custom spans)\n3. Implement route management instrumentation\n4. Implement FastAPI-specific instrumentation\n5. Implement Pinia/Vuex instrumentation\n6. Define collector config with resource attributes, sampling\n7. Add Grafana dashboards for RED metrics, trace exploration, log correlation\n\n## References\n\n- [OpenTelemetry Python SDK](https://docs.opentelemetry.io/python/docs/)\n- [OpenTelemetry JavaScript SDK](https://docs.opentelemetry.io/javascript/docs/)\n- [OpenTelemetry Collector](https://docs.opentelemetry.io/collector/docs/)\n- [Prometheus](https://prometheus.io/docs/)\n- [Grafana](https://grafana.com/docs/)\n- [Docker Compose](https://docs.docker.com/compose/)","observability-tracing-specs":"# Observability & Tracing — specs\n\n\n\n# Observability & Tracing — specs\n\n## Architecture\n```mermaid\ngraph LR\n    Backend__FastAPI[\"Backend((FastAPI))\"] --> OTelCollector__OTel[\"OTelCollector((OTel\"] Collector))\n    Frontend__Vue_js[\"Frontend((Vue.js))\"] --> OTelCollector\n    OTelCollector --> Prometheus__Prometheus[\"Prometheus((Prometheus))\"]\n    OTelCollector --> Jaeger__Jaeger[\"Jaeger((Jaeger))\"]\n    OTelCollector --> Loki__Loki[\"Loki((Loki))\"]\n    Prometheus --> Grafana__Grafana[\"Grafana((Grafana))\"]\n    Jaeger --> Grafana\n    Loki --> Grafana\n```\n\n## Backend instrumentation\n- FastAPI app instrumented with OpenTelemetry Python SDK\n- Traces, logs exported via OTLP to Collector\n- Metrics exposed through Prometheus exporter endpoint\n- Key files: `backend/app/main.py`, `backend/app/observability.py`\n\n## Frontend instrumentation\n- Vue.js app instrumented with OpenTelemetry JavaScript SDK\n- Traces, metrics, logs exported via OTLP to Collector\n- Key files: `frontend/src/main.ts`, `frontend/src/observability.ts`\n\n## Collector configuration\n- `collector-config.yaml` defines OTLP receiver\n- Exporters: Prometheus, Jaeger, Loki\n- Collector routes data to appropriate backends\n\n## Monitoring stack integration\n- Prometheus scrapes metrics from Collector (optionally from FastAPI exporter)\n- Grafana visualizes metrics, logs, traces\n- Jaeger/Tempo provides distributed tracing\n- Loki aggregates logs\n\n## Deployment\n- Docker Compose orchestrates services: backend, frontend, otel-collector, prometheus, grafana, jaeger, loki\n- Core definitions in `docker-compose.yml`\n- Development overrides in `docker-compose.override.yml`\n\n## Testing\n- Verify telemetry emission from backend endpoints\n- Verify telemetry emission from frontend interactions\n- End-to-end tests confirm data flow to Collector and backends\n- Extend pytest, Vitest, Cypress with telemetry assertions\n\n## Out of scope\n- Zero-code instrumentation\n- Advanced process instrumentation\n- Specific route management instrumentation\n- Deep Pinia/Vuex integration\n- Automatic Grafana dashboard generation\n- Long-term storage cost optimization\n- Alerting rule configuration\n\n## Further notes\n- Collector decouples applications from backend tools\n- Docker Compose provides reproducible environment","observability-tracing-src":"# Observability & Tracing — src\n\n# Observability & Tracing Module\n\nModule configures OpenTelemetry SDK for browser telemetry. Captures distributed traces, custom performance metrics, and logs. Exports data to OTLP collector via HTTP.\n\n```mermaid\nflowchart TD\n    App[Vue App / Router / Pinia / Axios] --> Plugins[Instrumentation Plugins & Composables]\n    Plugins --> Core[modules/core/observability.ts]\n    Core --> OTel[OpenTelemetry SDK API]\n    OTel -->|Traces| ExporterT[OTLP HTTP Trace Exporter]\n    OTel -->|Metrics| ExporterM[OTLP HTTP Metric Exporter]\n    OTel -->|Logs| ExporterL[OTLP HTTP Log Exporter]\n    ExporterT --> Collector[(OTLP Collector)]\n    ExporterM --> Collector\n    ExporterL --> Collector\n```\n\n---\n\n## Configuration & Environment Variables\n\nSetup uses Vite environment variables. Default endpoints target local OTLP collector:\n\n| Variable | Description | Default |\n| :--- | :--- | :--- |\n| `VITE_SERVICE_NAME` | Logical service name for all telemetry resources | `frontend-app` |\n| `VITE_OTEL_COLLECTOR_URL` | OTLP endpoint for spans | `http://localhost:4318/v1/traces` |\n| `VITE_OTEL_METRICS_ENABLED` | Toggle metric export pipeline (`'false'` disables) | `true` |\n| `VITE_OTEL_COLLECTOR_METRICS_URL` | OTLP endpoint for metrics | `http://localhost:4318/v1/metrics` |\n| `VITE_OTEL_COLLECTOR_LOGS_URL` | OTLP endpoint for logs | `http://localhost:4318/v1/logs` |\n\n---\n\n## Core Initialization\n\n### `setupObservability()`\nLocation: `frontend/src/modules/core/observability.ts`\n\nInitializes three OpenTelemetry pillars:\n\n1. **Traces**:\n   - Creates `WebTracerProvider` with `Resource` service name.\n   - Registers `ZoneContextManager` for async context propagation.\n   - Attaches auto-instrumentations: `DocumentLoadInstrumentation`, `FetchInstrumentation`, `UserInteractionInstrumentation`.\n   - Sends spans immediately via `SimpleSpanProcessor` and `OTLPTraceExporter`.\n   - Exports singleton `tracer` instance (`vue-frontend-tracer`).\n\n2. **Metrics**:\n   - Creates `MeterProvider` with `PeriodicExportingMetricReader` (30-second export interval).\n   - Registers global meter and executes `initializeMetrics()`.\n\n3. **Logs**:\n   - Creates `LoggerProvider` with `SimpleLogRecordProcessor` and `OTLPLogExporter`.\n   - Emits test initialization log at level 9 (`INFO`).\n\n---\n\n## Metrics System\n\nLocation: `frontend/src/modules/core/metrics/metrics.ts`\n\nMeter name: `frontend-app`. Instruments initialized lazily on `initializeMetrics()` call.\n\n### Defined Instruments\n\n| Metric Name | Instrument | Unit | Attributes | Purpose |\n| :--- | :--- | :--- | :--- | :--- |\n| `frontend.app.page_view` | Counter | `1` | `route.name`, `route.path` | Route transition count |\n| `frontend.app.button_click` | Counter | `1` | `element_id`, `element_type`, `page_route` | UI click interactions |\n| `frontend.app.form_submit` | Counter | `1` | `form_name`, `page_route` | Form submit events |\n| `frontend.app.component_render_duration` | Histogram | `ms` | `component_name`, `route.path` | Component mount time |\n| `http.client.duration` | Histogram | `ms` | `http.method`, `http.url`, `http.status_code` | API client latency |\n\n### Metric Functions\n- `recordPageView(routeName, routePath)`: Increment page view counter.\n- `recordButtonClick(elementId, elementType, pageRoute)`: Track UI click target.\n- `recordFormSubmit(formName, pageRoute)`: Track form execution.\n- `recordComponentRender(componentName, routePath, duration)`: Record component lifecycle mount latency.\n- `recordApiCall(method, url, statusCode, duration)`: Record outgoing HTTP duration with standard semantic conventions.\n\n---\n\n## Vue Composables\n\n### `useComponentRenderMetrics`\nLocation: `frontend/src/modules/core/metrics/useComponentRenderMetrics.ts`\n\nMeasures component mount duration.\n- Hook records `performance.now()` in `onBeforeMount`.\n- Calculates difference in `onMounted`.\n- Resolves component name via `getCurrentInstance()?.type.__name`.\n- Calls `recordComponentRender(name, route.path, duration)`.\n\n### `useMetrics`\nLocation: `frontend/src/modules/core/metrics/useMetrics.ts`\n\nExtracts current route path reactively and exposes UI tracking functions:\n- `trackButtonClick(elementId, elementType = 'button')`: Calls `recordButtonClick`.\n- `trackFormSubmit(formName)`: Calls `recordFormSubmit`.\n\n---\n\n## Plugins & Instrumentation\n\n### Router Instrumentation\nLocation: `frontend/src/plugins/router-instrumentation.ts` (and `modules/core/router-observability.ts`)\n\nFunction: `routerInstrumentation(router: Router)`\n- `router.beforeEach`: Starts span `Navigation to <name|path>`, sets `from` and `to` full path attributes.\n- `router.afterEach`: Sets `SpanStatusCode.OK` (or `SpanStatusCode.ERROR` on failure) and ends span.\n- `router.onError`: Sets `SpanStatusCode.ERROR` with error message and ends span.\n\n### Axios Instrumentation\nLocation: `frontend/src/plugins/axios-instrumentation.ts`\n\nFunction: `axiosInstrumentation()`\n- Intercepts requests: Starts span `http: <METHOD> <URL>`, writes `X-Trace-Id` header to config, attaches span object to request config.\n- Intercepts responses: Sets span status `SpanStatusCode.OK` and ends span.\n- Intercepts errors: Records exception, sets `SpanStatusCode.ERROR`, ends span, returns rejected promise.\n\n### Pinia Plugin\nLocation: `frontend/src/plugins/pinia-instrumentation.ts`\n\nFunction: `piniaPlugin(context: PiniaPluginContext)`\n- Hooks into `$onAction`.\n- Starts span `Pinia Action: <actionName>`.\n- Adds `store`, `action`, and `args` attributes.\n- Closes span on action completion (`after`) with serialized result or on error (`onError`) with error message.\n\n---\n\n## Integration Setup\n\nInitialize observability in application bootstrap entrypoint (`main.ts`):\n\n```typescript\nimport { createApp } from 'vue';\nimport { createPinia } from 'pinia';\nimport router from '@/router';\nimport App from '@/App.vue';\n\nimport { setupObservability } from '@/modules/core/observability';\nimport { routerInstrumentation } from '@/plugins/router-instrumentation';\nimport { axiosInstrumentation } from '@/plugins/axios-instrumentation';\nimport { piniaPlugin } from '@/plugins/pinia-instrumentation';\n\n// 1. Initialize OTel SDK providers\nsetupObservability();\n\n// 2. Initialize plugins\naxiosInstrumentation();\n\nconst pinia = createPinia();\npinia.use(piniaPlugin);\n\nrouterInstrumentation(router);\n\n// 3. Mount Vue app\nconst app = createApp(App);\napp.use(pinia);\napp.use(router);\napp.mount('#app');\n```","observability-tracing-tests":"# Observability & Tracing — tests\n\n# Observability & Tracing — Tests\n\nUnit test suites for frontend OpenTelemetry (OTel) metrics and tracing setup.\n\n## Files\n\n- `frontend/tests/modules/core/observability.spec.ts` — Verifies OTel metric provider and counter pipeline.\n- `frontend/tests/modules/core/observability.test.ts` — Verifies `setupObservability()` tracing initialization and collector endpoint configuration.\n\n## Test Coverage\n\n```mermaid\nflowchart TD\n    A[Test Suites] --> B[observability.spec.ts]\n    A --> C[observability.test.ts]\n    B --> D[MeterProvider + PeriodicExportingMetricReader]\n    C --> E[setupObservability Execution]\n    E --> F[Default WebTracerProvider init]\n    E --> G[Custom VITE_OTEL_COLLECTOR_URL injection]\n```\n\n### Metrics Suite (`observability.spec.ts`)\n\nTests OpenTelemetry metric pipeline creation without actual network export.\n\n- **Mocked Module**: `@opentelemetry/exporter-metrics-otlp-http` (`OTLPMetricExporter`).\n- **Target Flow**:\n  1. Instantiates `MeterProvider`.\n  2. Hooks mocked `OTLPMetricExporter` via `PeriodicExportingMetricReader` (100ms interval).\n  3. Registers provider via `metrics.setGlobalMeterProvider()`.\n  4. Fetches meter `test-meter` and creates counter `test_counter`.\n  5. Increments counter (`counter.add(1)`).\n  6. Asserts runtime setup completes without error.\n\n### Tracing Suite (`observability.test.ts`)\n\nTests frontend tracing bootstrap function `setupObservability()`.\n\n- **Mocked Modules**:\n  - `@opentelemetry/sdk-trace-web` (`WebTracerProvider`, `SimpleSpanProcessor`, `TraceSDK`)\n  - `@opentelemetry/exporter-trace-otlp-http` (`OTLPTraceExporter`)\n  - `@opentelemetry/instrumentation-document-load` (`DocumentLoadInstrumentation`)\n  - `@opentelemetry/instrumentation-fetch` (`FetchInstrumentation`)\n  - `@opentelemetry/instrumentation-user-interaction` (`UserInteractionInstrumentation`)\n  - `@opentelemetry/context-zone` (`ZoneContextManager`)\n\n- **Cases**:\n  - **Default Collector**: Calls `setupObservability()` with empty environment. Asserts `WebTracerProvider` instantiated.\n  - **Custom Collector URL**: Sets `import.meta.env.VITE_OTEL_COLLECTOR_URL = 'http://custom-collector:4318/v1/traces'`. Calls `setupObservability()`. Asserts `OTLPTraceExporter` receives matching `url` parameter.\n\n## Test Configuration & Environment\n\n- **Runner**: Vitest.\n- **State Reset**: `beforeEach` resets module registry (`vi.resetModules()`), clears mocks (`vi.clearAllMocks()`), deletes `import.meta.env.VITE_OTEL_COLLECTOR_URL`. Prevents state leak across test runs.","observability-tracing-todo":"# Observability & Tracing — todo\n\n`fix_grafana_dashboard.sh` → skipped: dashboard auto-rebuild, add when Grafana API exists.  \n\nThis script dumps raw observability data to debug misconfigured metrics/logs. It does not fix dashboards. It never did.  \n\n### Purpose  \nDiagnose why Grafana panels show no data. Checks:  \n- Prometheus metrics and targets  \n- Loki log labels and sample queries  \n- OTel collector metrics endpoint  \n- Backend `/metrics` exposure  \n\n### How It Works  \n1. Queries Prometheus, Loki, OTel collector, and app `/metrics` endpoints  \n2. Extracts label values (`job`, `exporter`, `level`)  \n3. Samples recent logs and metrics  \n4. Saves all output to `metrics-and-labels.txt`  \n\n### Key Components  \n- **Prometheus** (`localhost:9090`) → checks `up`, metric names, scrape health  \n- **Loki** (`localhost:3100`) → lists labels, queries last hour of logs  \n- **OTel collector** (`localhost:8889`) → dumps raw OpenTelemetry metrics  \n- **App backend** (`localhost:8000`) → verifies `/metrics` is reachable  \n\n### Output  \n`metrics-and-labels.txt` contains:  \n- Top 40 Prometheus metric names  \n- Active scrape targets + errors  \n- Loki label values (`job`, `exporter`, `level`)  \n- 5 recent log entries  \n- First 30 lines of OTel metrics  \n- First 40 lines of app `/metrics`  \n- OTel collector config (`collector-config.yml`)  \n\n### Connection to Codebase  \nNo code calls this. It’s a manual debug tool. Used when:  \n- Grafana shows “no data”  \n- Logs don’t appear in Loki  \n- Metrics missing from Prometheus  \n\n### Why Not Auto-Fix?  \nGrafana dashboards are JSON files. This script doesn’t touch them.  \nFix dashboards manually:  \n1. Open Grafana → Dashboard → Edit  \n2. Verify data source = Prometheus/Loki  \n3. Match label selectors to what `curl` returned  \n\n`ponytail:` Add Grafana API calls when dashboard templating breaks. Until then: copy-paste labels from `metrics-and-labels.txt` into query editors.","observability-tracing":"# Observability & Tracing\n\n# Observability & Tracing\n\n```mermaid\nflowchart TD\n    OBSERVABILITY_SPEC[\"OBSERVABILITY_SPEC.md\"] -->|defines SLIs, instrumentation| app[\"app\"]\n    app -->|checks OTel availability, configures pipeline| docker[\"docker-compose.observability.yml\"]\n    docker -->|services emit OTLP| observability[\"observability\"]\n    observability -->|Grafana dashboards query| docs[\"docs\"]\n    cypress[\"cypress\"] -->|E2E verifies frontend metrics export| tests[\"tests\"]\n    src[\"src\"] -->|browser OTel SDK config| tests\n    research[\"research\"] -->|designs OTel integration| specs[\"specs\"]\n    todo[\"todo\"] -->|diagnoses Grafana misconfig| observability_check_sh[\"observability.check.sh\"]\n```\n\n**Purpose**  \nOpenTelemetry integration for distributed tracing, metrics, and structured logging across backend (FastAPI), frontend (Vue), and infrastructure. Graceful degradation when OTel Collector unreachable. Enables health, performance, and error monitoring via Prometheus, Grafana, Tempo, Loki.\n\n**Sub-modules & Relationships**  \n- `OBSERVABILITY_SPEC.md` — Defines metrics, monitoring, alerting architecture. Backend instrumentation via `prometheus-fastapi-instrumentator`; Frontend RUM via `@opentelemetry/instrumentation-document-load` and `@opentelemetry/instrumentation-user-interaction`; Nginx proxy exports. SLIs: Latency <200ms P95, Availability >99.9%.  \n- `app` — Main entry `setup_observability(app, engine)`. Checks OTel Collector TCP availability; configures full OTLP pipeline if available, metrics-only if unavailable. Applies instrumentations: FastAPI, HTTPX, SQLAlchemy, system metrics.  \n- `docker-compose.observability.yml` — Local dev stack. Application services emit OTLP gRPC/HTTP → OTel Collector → Tempo (traces), Prometheus (metrics), Loki (logs). Grafana visualizes. Jaeger alternate trace UI. Alertmanager routes alerts; telegram-bot placeholder notifications.  \n- `observability` — Centralizes metrics, traces, logs for all services. Grafana dashboards (Overall, Backend, Frontend, Nginx) query Prometheus, Tempo, Loki. Prometheus scrapes collector and service metrics.  \n- `docs` — Metric reference samples for backend (`job=\"backend-service\"`) and frontend OpenTelemetry + Prometheus pipeline. Architecture diagram of data flow across components.  \n- `cypress` — E2E test `observability.cy.ts` verifies frontend OTel metrics export pipeline. Cypress visits frontend, triggers auto-instrumentation, validates metrics reach Collector Prometheus endpoint (:8889).  \n- `src` — Browser OpenTelemetry SDK configuration via Vite environment variables. Instrumentation plugins & composables feed Core `observability.ts` → OTel SDK API → OTLP HTTP exporters (traces, metrics, logs) → OTLP Collector.  \n- `tests` — Unit suites `observability.spec.ts` and `observability.test.ts` verify OTel metric provider/counter pipeline, `setupObservability()` tracing initialization, collector endpoint configuration. Coverage: `MeterProvider`, `PeriodicExportingMetricReader`, default `WebTracerProvider`, `VITE_OTEL_COLLECTOR_URL` injection.  \n- `observability.check.sh` — Standalone health verification after stack deployment. Sequential endpoint checks against localhost ports. Validates response patterns; on failure prints colored error, shows recent logs via `show_service_logs()`. Non-blocking continuation to next check.  \n- `research` — Design OTel integration for FastAPI backend and Vue.js frontend. Collect application metrics, traces, logs. Export to Prometheus, Jaeger/Tempo, Loki via OTel Collector. Deploy with Docker Compose.  \n- `specs` — Architecture graph: Backend FastAPI → OTelCollector; Frontend Vue.js → OTelCollector. OTelCollector → Prometheus, Jaeger, Loki. Prometheus → Grafana. Jaeger/Loki → Grafana. Backend instrumentation via OpenTelemetry Python SDK.  \n- `todo` — `fix_grafana_dashboard.sh` diagnoses why Grafana panels show no data. Checks Prometheus metrics/targets, Loki log labels/sample queries, OTel collector metrics endpoint, backend `/metrics` exposure. Saves output to `metrics-and-labels.txt`.\n\n**Key Workflows Spanning Sub-modules**  \n1. **Instrumentation → Export**: Backend FastAPI + Vue emit OTel data (`OBSERVABILITY_SPEC.md`, `src`). Collector receives (`observability`, `specs`). If collector available (`app`), full pipeline; else metrics-only (`app`).  \n2. **Collection → Storage → Visualization**: OTel Collector forwards traces to Tempo, metrics to Prometheus, logs to Loki (`docker-compose.observability.yml`, `observability`). Prometheus scrapes; Grafana queries all datasources for dashboards (`observability`, `docs`).  \n3. **Verification & Diagnostics**: Health check script (`observability.check.sh`) validates stack export correctness. E2E test (`cypress`) confirms frontend metrics pipeline. Dashboard diagnostic script (`todo`) surfaces misconfiguration.  \n4. **Alerting & Notification**: Prometheus alert rules (`observability`) → Alertmanager → telegram-bot placeholder (`docker-compose.observability.yml`).\n\n**[OBSERVABILITY_SPEC.md](OBSERVABILITY_SPEC.md) · [app](app.md) · [docker-compose.observability.yml](docker-compose.observability.yml.md) · [observability](observability.md) · [docs](docs.md) · [cypress](cypress.md) · [src](src.md) · [tests](tests.md) · [observability.check.sh](observability.check.sh.md) · [research](research.md) · [specs](specs.md) · [todo](todo.md)**","overview":"# omnisight-platform-poc — Wiki\n\n# Omnisight Platform POC\n\nFull-stack POC. FastAPI backend. Vue 3 frontend. AI/LLM integration. DevOps ready. Showcase Python, Vue, containerization, cloud-native readiness.\n\n## Architecture\n\n```mermaid\ngraph TD\n    UI[Frontend: Vue/Vuetify] --> API[Backend: FastAPI]\n    API --> Auth[Auth: JWT]\n    API --> AI[AI Service]\n    AI --> RAG[RAG Pipeline]\n    RAG --> VS[(Vector Store)]\n    API --> DB[(Postgres)]\n    API --> OTel[OTel Collector]\n    OTel --> Grafana[Observability Stack]\n```\n\n## System Overview\n\n[Core Architecture & Infrastructure](core-architecture.md) manage runtime, persistence, security. [API Routing & Versioning](api-routing.md) handle versioned endpoints. [Authentication & User Management](auth-management.md) secure system via JWT in HttpOnly cookies.\n\n[AI & LLM Services](ai-llm-services.md) orchestrate OpenAI, Anthropic, local models. [RAG Pipeline](rag-pipeline.md) ingest documents into vector stores for grounded generation.\n\n[Frontend Shell & UI Components](frontend-shell.md) use Vue 3 and Vuetify 3. [Dashboard & Analytics](dashboard-analytics.md) show real-time metrics via ApexCharts. [System Administration & Configuration](system-admin.md) manage roles, logs, runtime settings.\n\n[Observability & Tracing](observability-tracing.md) provide full-stack telemetry via OTel, Prometheus, Loki, Tempo. [Deployment & Operations](deployment-ops.md) cover Docker, Kubernetes, CI/CD. [Documentation & Specifications](docs-specs.md) define project standards.\n\n## Key Flows\n\n- **Chat**: User query. `LLMService` process. Provider stream result.\n- **RAG**: Document upload. `VectorStore` index. Context retrieval ground LLM.\n- **Auth**: Login. JWT cookie store. `get_current_user` verify access.\n- **Config**: `get_config` request. `verify_token` check. `get_db` fetch data.\n\n## Quick Start\n\n1. Clone repo.\n2. Run `docker-compose up`.\n3. Run `alembic upgrade head`.\n4. Access UI at `localhost:80`.","rag-pipeline":"# RAG Pipeline\n\n# RAG Pipeline Module\n\nRAG module handle ingest, embed, index, retrieve, prompt augment for LLM context grounding.\n\n```mermaid\nflowchart LR\n    File[PDF / TXT File] --> Loader[document_loader.py]\n    Loader --> Splitter[text_splitter.py]\n    Splitter --> Embedder[embedding_generator.py]\n    Embedder --> VectorStore[vector_store.py / ChromaDB / pgvector]\n    Query[User Query] --> Retriever[retriever.py]\n    VectorStore --> Retriever\n    Retriever --> LLMIntegrator[llm_integrator.py]\n    LLMIntegrator --> LLMService[ai/services/llm_service.py]\n```\n\n---\n\n## Core Components\n\n### 1. Document Loading (`document_loader.py`)\nExtract raw text to LangChain `Document` objects.\n- `load_document(file_path)`: Inspect file extension. PDF use `PyPDFLoader`. TXT use `TextLoader` with UTF-8. Other extensions throw `ValueError`.\n- `load_documents_from_directory(directory_path)`: Iterate folder, process matching `.pdf` and `.txt` files. Catch and log per-file errors without breaking loop.\n\n### 2. Text Splitting (`text_splitter.py`)\nChunk documents for token limit fit and search granularity.\n- `split_documents(documents, chunk_size=1000, chunk_overlap=200)`: Wrapper over LangChain `RecursiveCharacterTextSplitter`. Preserve source metadata across chunks.\n\n### 3. Embedding Generation (`embedding_generator.py`)\nTransform text chunks to vectors.\n- Class: `EmbeddingGenerator(model_name='all-MiniLM-L6-v2')`\n  - Initialize HuggingFace `SentenceTransformer`. Vector size: 384 dimensions.\n  - `generate_embedding(text)`: Output single `list[float]`.\n  - `generate_embeddings(texts)`: Output batch `list[list[float]]`.\n\n### 4. Ingestion Pipeline (`ingestion_service.py`)\nGlue loading, splitting, embedding, persistence.\n- `ingest_document(file_path, chunk_size, chunk_overlap)`: Read file, chunk text, calculate embeddings, write embeddings to chunk metadata dict. Return `List[Document]`.\n- `ingest_documents_from_directory(directory_path, chunk_size, chunk_overlap)`: Batch ingest directory chunks with embedded metadata.\n- `ingest_and_store_document(file_path, chunk_size, chunk_overlap)`: Async. Run `ingest_document`, format docs into `{id, embedding, document, metadata}`, call `VectorStore.add_documents()`.\n- `ingest_and_store_documents_from_directory(directory_path, chunk_size, chunk_overlap)`: Async directory ingestion with vector store persistence.\n\n### 5. Vector Storage & Schema (`vector_store.py`, `models.py`)\n- **ChromaDB wrapper (`vector_store.py`)**:\n  - `VectorStore(persist_directory=\"./chroma_db\", collection_name=\"rag_documents\")`: Manage `chromadb.PersistentClient`.\n  - `add_documents(documents)`: Batch push IDs, vectors, content strings, metadata.\n  - `query(query_embedding, n_results=5)`: Nearest neighbor vector lookup.\n  - `get_vector_store()`: Global singleton factory.\n- **Relational DB fallback (`models.py`)**:\n  - Model `Document(Base)`: SQL table `documents`.\n  - Columns: `id` (Integer PK), `content` (Text), `embedding` (`Vector(384)` via `pgvector`), `meta_data` (JSON), `created_at` (DateTime).\n\n### 6. Retrieval Engine (`retriever.py`, `retrieval_service.py`)\n- **Search orchestration (`retriever.py`)**:\n  - `generate_query_embedding(query)`: Helper for query vector generation.\n  - `retrieve(query, n_results=5, filter_metadata=None)`: Convert query string to vector, query `VectorStore`, reformat response into Chroma shape (`ids`, `documents`, `metadatas`, `distances`).\n  - `retrieve_with_embedding(query_embedding, n_results=5, filter_metadata=None)`: Direct search with pre-computed vector.\n- **API route (`retrieval_service.py`)**:\n  - `POST /retrieve`: Accept `RetrievalRequest` (`query: str`, `n_results: int = 5`), invoke `retrieve()`, return match payload.\n\n### 7. LLM Integration (`llm_integrator.py`)\nFormat vector search outputs for context prompts.\n- `format_context_for_llm(documents)`: Join `page_content` list into numbered blocks (`Document 1:\\n...`).\n- `generate_rag_prompt(query, context, template)`: Interpolate `{context}` and `{query}` into template string.\n\n### 8. Experiment Tracking (`mlflow_tracker.py`)\nTrack parameters, run metrics, model configs in MLflow.\n- `init_mlflow_tracking(experiment_name, tracking_uri)`: Configure MLflow endpoint and active experiment.\n- `log_embedding_model_params(model_name)`: Track model identifier.\n- `log_rag_params(chunk_size, chunk_overlap, n_results)`: Track chunking/retrieval hyperparameters.\n- `log_llm_metrics(model, usage, finish_reason)`: Track token count metrics (`prompt_tokens`, `completion_tokens`, `total_tokens`).\n- `register_rag_components(...)`: Save complete RAG setup as run config tag `rag_pipeline_config`.\n- `register_rag_model(run_id, model_name, model_path)`: Add artifact to MLflow Model Registry.\n\n---\n\n## Integration Points\n\n| Source | Target | Operation |\n|---|---|---|\n| `app.modules.ai.api.chat.rag_chat_completion` | `retriever.retrieve` | Fetch relevant context for user chat input |\n| `ingestion_service` / `retriever` | `app.modules.ai.services.vector_store_factory` | Fetch initialized vector backend |\n| `llm_integrator` | `app.modules.ai.services.llm_service` | Inject formatted context into LLM system/user prompts |\n\n---\n\n## Testing\n\nUnit and integration tests located in `tests/`:\n- `test_document_processing.py`: Validate loaders, unsupported file rejection, text chunking bounds.\n- `test_embedding_vector.py`: Test `SentenceTransformer` wrappers and Chroma client ops.\n- `test_integration.py`: End-to-end checks for chat completions, streaming chat, and ingestion retrieval loops.\n- `test_mlflow.py`: Validate telemetry hooks and experiment parameter tracking.\n\nRun tests:\n```bash\npytest backend/app/modules/llm/rag/tests/\n```","system-administration-configuration":"# System Administration & Configuration\n\n# System Administration & Configuration Module\n\n## Purpose\nProvides endpoints for system monitoring, log access, role-based access control, and dynamic configuration management. Enables administrators to view system status, retrieve logs, manage user roles, and adjust runtime settings.\n\n## Key Components\n\n### Admin API Endpoints\n- **`logs.py`**: `/logs` endpoint returns redacted system log entries. Reads log file, parses JSON lines, applies sensitive data redaction.\n- **`status.py`**: `/system-info` endpoint returns static system metadata: version, OS, database type.\n\n### System API Endpoints\n- **`config.py`**: \n  - `GET /`: Returns all system settings as key-value pairs.\n  - `GET /{key}`: Returns specific setting value. For `system.default_bearer_token`, syncs from `.token` file if DB value differs.\n  - `PUT /{key}`: Updates setting value. For `system.default_bearer_token`, writes to `.token` file.\n- **`health.py`**: `/health` endpoint checks database connectivity via `SELECT 1`.\n\n### Core Models\n- **`Role`** (`admin/models/role/role.py`): Defines RBAC roles. Links to users via association table.\n- **`SystemSetting`** (`system/models/system_setting.py`): Stores settings as JSON in `settings` column. Unique `key` constraint.\n- **`TraceEntry`** (`admin/models/trace/trace_entry.py`): Logs function performance traces (module, function, duration).\n- **`TraceConfiguration`** (`admin/models/trace/trace_configuration.py`): *Deprecated*. Use `SystemSetting` for tracing config (`tracing.{service}`).\n\n### Utilities & Services\n- **`redactor.py`**: `redact_sensitive_data()` recursively replaces values for keys in `SENSITIVE_KEYS` (password, token, etc.) with `[REDACTED]`.\n- **`setting_service.py`**: \n  - `get_setting()`: Fetches setting by key.\n  - `set_setting()`: Creates or updates setting.\n  - `sync_token_to_file()`: Writes bearer token to `.token` file.\n  - `get_all_settings()`: Returns all settings as dict.\n\n## Authentication & Authorization\nAll admin endpoints require `get_admin_user` dependency (from `app.api.v1.deps`), which validates:\n1. Valid authentication token (Bearer or cookie)\n2. User possesses `admin` role (via `Role` model)\n\n## Configuration Flow\n### Getting Bearer Token\n1. Client requests `GET /api/v1/system/config/system.default_bearer_token`\n2. Endpoint checks DB value via `get_setting()`\n3. If key matches `system.default_bearer_token`:\n   - Reads `.token` file if exists\n   - Updates DB with file token if different\n   - Returns (potentially updated) token value\n4. For other keys: returns DB value directly\n\n### Updating Bearer Token\n1. Client requests `PUT /api/v1/system/config/system.default_bearer_token` with `{ \"value\": \"new_token\" }`\n2. Endpoint:\n   - Updates DB via `set_setting()`\n   - Calls `sync_token_to_file()` to write token to `.token` file\n3. Returns success response\n\n## Health Check\n- Executes `SELECT 1` via SQLAlchemy\n- Returns `{\"status\": \"ok\", \"database\": \"ok\"}` on success\n- Throws 503 error on database failure\n\n## Log Retrieval\n1. Client requests `GET /api/v1/admin/logs`\n2. Endpoint:\n   - Verifies admin privileges\n   - Reads log file (`settings.LOG_FILE_PATH`)\n   - Parses last `tail` lines as JSON\n   - Applies `redact_sensitive_data()` to each entry\n3. Returns `{\"logs\": [redacted_entries]}`\n\n## Database Integration\n- Uses `get_db` dependency for session management\n- `SystemSetting` and `Role` models mapped via SQLAlchemy ORM\n- All modifications committed via `db.session.commit()`\n\n## Tracing Configuration (Deprecated)\n- Legacy `TraceConfiguration` model replaced by `SystemSetting`\n- Tracing enabled via `system.tracing.{service}` setting (e.g., `system.tracing.admin`)\n- Value format: `{\"enabled\": true}`\n\n## Frontend Integration\n
