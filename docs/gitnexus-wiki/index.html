ronment or `.env` files.\n\n| Attribute | Default Value | Purpose |\n| :--- | :--- | :--- |\n| `DATABASE_URL` | `sqlite:///./app.db` | Primary database connection string |\n| `REDIS_URL` | `redis://localhost:6379/0` | Cache and message broker connection |\n| `SECRET_KEY` | `change-me-in-production` | Secret for cryptographic signing (JWT) |\n| `CORS_ORIGINS` | `http://localhost:5173` | Allowed CORS origins |\n\n### 2. Exceptions (`app.modules.core.exceptions`)\n\nStructured error types inheriting from base `AuthException`.\n\n* `AuthException(detail: str, error_code: str, status_code: int = 400)`: Root exception. Stores human-readable `detail`, machine-readable `error_code`, and HTTP `status_code`.\n* `EmailAlreadyExistsError(detail='Email already registered')`: `status_code=409`, `error_code=\"EMAIL_ALREADY_EXISTS\"`.\n* `InvalidCredentialsError(detail='Incorrect email or password')`: `status_code=401`, `error_code=\"INVALID_CREDENTIALS\"`.\n* `ValidationError(detail='Validation failed')`: `status_code=422`, `error_code=\"VALIDATION_ERROR\"`.\n* `TokenExpiredError(detail='Token has expired')`: `status_code=401`, `error_code=\"TOKEN_EXPIRED\"`.\n\n### 3. Security Utilities (`app.modules.core.security`)\n\nPassword hashing and JWT token operations.\n\n* `hash_password(password: str) -> str`: Hashes UTF-8 string with `bcrypt.gensalt()`.\n* `verify_password(plain_password: str, hashed_password: str) -> bool`: Verifies plaintext password against bcrypt hash.\n* `create_access_token(data: dict, expires_delta: timedelta | None = None) -> str`: Encodes payload to HS256 JWT. Expiration defaults to 15 minutes.\n* `verify_token(token: str) -> dict | None`: Decodes HS256 JWT using `settings.SECRET_KEY`. Catches `JWTError` and returns `None` on failure.","core-architecture-infrastructure-tests":"# Core Architecture & Infrastructure — tests\n\n# Core Architecture & Infrastructure — Tests: Database Initialization\n\nModule verifies database bootstrap logic in `backend/init_db.py`. Ensures default bearer token creates correctly on startup, either read from disk or generated fresh.\n\n## Purpose\n\n`tests/system/test_init_db.py` tests `init_db()` behavior:\n1. Load existing token from `TOKEN_FILE` into DB.\n2. Generate new secret token, write to `TOKEN_FILE`, and persist to DB when file absent.\n\n## Flow\n\n```mermaid\ngraph TD\n    A[Run init_db] --> B{TOKEN_FILE exists?}\n    B -- Yes --> C[Read token value]\n    B -- No --> D[Generate token + write file]\n    C --> E[Insert system.default_bearer_token to DB]\n    D --> E\n    E --> F[Commit DB session]\n```\n\n## Test Cases\n\n### `test_init_db_seeds_token_from_file`\n- **Target**: `init_db()`\n- **Scenario**: `.token` file exists in workdir.\n- **Mocks**:\n  - `init_db.SessionLocal`: Returns mock `sqlalchemy.orm.Session`.\n  - DB query chain (`mock_db.query().filter().first()`): Returns `None` (table empty).\n- **Assertions**:\n  - `SystemSetting` object with key `system.default_bearer_token` added to DB session via `mock_db.add()`.\n  - Setting value matches contents of `.token` file (`\"existing-secret-token\"`).\n  - `mock_db.commit()` invoked.\n\n### `test_init_db_generates_new_token`\n- **Target**: `init_db()`\n- **Scenario**: `.token` file absent.\n- **Mocks**: Same as above.\n- **Assertions**:\n  - `TOKEN_FILE` created on disk.\n  - Generated token file not empty.\n  - Matching token value written to DB under key `system.default_bearer_token`.\n\n## Key Dependencies & Integrations\n\n- `init_db.init_db`: Main bootstrap entrypoint.\n- `init_db.TOKEN_FILE`: Target filename for bearer token storage on filesystem.\n- `app.modules.system.models.system_setting.SystemSetting`: SQLAlchemy model for key-value system settings.\n- `pytest` + `tmp_path`: Provides clean temporary directory via `os.chdir(tmp_path)` to isolate disk reads/writes during test runs.","core-architecture-infrastructure":"# Core Architecture & Infrastructure\n\n# Core Architecture & Infrastructure\n\nCore module group manage runtime initialization, data persistence, security baseline, and telemetry pipeline.\n\n```mermaid\ngraph TD\n    App[app: FastAPI Entry] --> MW[app: Middleware Stack]\n    MW --> Auth[core.security: Token & Hash]\n    App --> Lifespan[app: Lifespan]\n    Lifespan --> InitDB[backend: init_db.py]\n    InitDB --> Auth\n    InitDB --> DB[(database: Postgres)]\n    Alembic[alembic: Migrations] --> DB\n    App --> OTel[CONTEXT: OTel Collector]\n    OTel --> Observability[CONTEXT: Grafana / Tempo / Loki]\n```\n\n## Sub-Modules\n\n- [Architecture Overview](ARCHITECTURE.md): System topography, directory conventions, Vue 3 + FastAPI domain structure.\n- [Project Boundaries](project.md): Module dependencies and shared utilities rules.\n- [Application Entry & Middleware](app.md): FastAPI factory (`create_app`), request ID injection, rate limiting, exception mapping.\n- [Backend Bootstrap](backend.md): Root initialization entrypoints, dependency configuration (`pyproject.toml`), test hooks.\n- [Database Configuration](database.md): SQLAlchemy connection routing, session factory, query optimization patterns.\n- [Database Schema](architecture.md): Relational entities (`User`, `Role`, `SystemSetting`, `Document`) and vector storage layout.\n- [Database Migrations](alembic.md): Alembic environment (`env.py`), autogenerate metadata tracking, migration execution.\n- [Database Initialization Tests](tests.md): Verification test suites for bootstrap logic and bearer token creation in `init_db.py`.\n- [Observability Pipeline](CONTEXT.md): OpenTelemetry collector setup, trace context propagation, Prometheus/Tempo/Loki ingestion.\n- [Setup & Toolchain](setup.md): Environment dependencies, Node.js toolchain, OpenSpec CLI integration.\n- [Core Docs Specifications](docs.md): Source API reference for config settings, exception trees, security helpers.\n- [Documentation Site](site.md): MkDocs Material build output and static asset hierarchy.\n\n## Key Cross-Module Workflows\n\n### 1. Application Startup & Bootstrap\n1. `create_app()` in [app](app.md) invokes lifespan context.\n2. Lifespan calls `init_db()` in [backend](backend.md).\n3. `init_db()` applies metadata schema against [database](database.md) session, seeds admin user credentials with `hash_password()` from [docs](docs.md), and reads or generates default bearer token verified by [tests](tests.md).\n4. [alembic](alembic.md) tracks runtime schema changes against models declared in [architecture](architecture.md).\n\n### 2. Request Security & Dependency Resolution\n1. Incoming HTTP request hits middleware stack in [app](app.md) (`RequestIDMiddleware` assigns tracing ID).\n2. Endpoint dependencies (`api/v1/deps.py`) call `get_current_user` -> `verify_token` in `core.security`.\n3. Database sessions inject via `get_db` from [database](database.md).\n4. Request execution logs and metrics stream through OTLP pipeline in [CONTEXT](CONTEXT.md).","dashboard-analytics":"# Dashboard & Analytics\n\n# Dashboard & Analytics Module\n\nModule provides real-time system metrics, user stats, and performance visual charts. Consists of FastAPI backend endpoints and Vue 3 + Vuetify + ApexCharts frontend views.\n\n```mermaid\ngraph TD\n    UI[Dashboard.vue] -->|GET /dashboard/stats| S_API[DashboardStats Endpoint]\n    UI -->|GET /dashboard/realtime| RT_API[RealtimeDataPoint Endpoint]\n    UI -->|GET /users| U_API[User Service]\n    UI --> AC[ApexChart.vue Component]\n    UI -->|Poll every 5000ms| RT_API\n    RT_API -->|Fallback| Mock[generateMockRealtimeData]\n```\n\n## Backend API\n\nEndpoints defined in `backend/app/modules/dashboard/api/dashboard.py`. Base router mounts to `/api/v1/dashboard`.\n\n### Models\n\n- **`DashboardStats`**: System counters.\n  - `total_users` (`int`): Registered user count.\n  - `active_sessions` (`int`): Current active sessions.\n  - `api_calls_24h` (`int`): Requests in last 24 hours.\n- **`RealtimeDataPoint`**: Time-series metrics block.\n  - `timestamp` (`str`): ISO datetime string.\n  - `requests` (`int`): Request throughput.\n  - `avgResponseTime` (`float`): Latency in milliseconds.\n  - `status2xx` (`int`): Successful response count.\n  - `status4xx` (`int`): Client error count.\n  - `status5xx` (`int`): Server error count.\n  - `activeUsers` (`int`): Concurrently active users.\n\n### Endpoints\n\n- `GET /stats`: Returns `DashboardStats` object. Generates randomized mock values.\n- `GET /realtime`: Returns `list[RealtimeDataPoint]` containing single latest snapshot.\n\n*Note:* `backend/app/modules/user/api/dashboard.py` contains alternate static stats endpoint (`total_users: 1250, active_sessions: 42, api_calls_24h: 15420`).\n\n---\n\n## Frontend Components\n\n### `Dashboard.vue`\nPath: `frontend/src/modules/dashboard/views/Dashboard.vue`.\n\nMain dashboard layout. Handles state management, data polling, error boundaries, rendering.\n\n- **Metrics Tracking**: Calls `useComponentRenderMetrics()` on setup.\n- **Data Fetching (`fetchData`)**: Fires concurrent requests via `Promise.all` using `useApi()` wrapper:\n  - `/dashboard/stats`\n  - `/users`\n  - `/dashboard/realtime`\n- **Polling Loop (`startRealtimeUpdates`)**:\n  - Runs `setInterval` every 5000ms.\n  - Appends new item to `realtimeData` array, maintains sliding window of 20 points.\n  - If backend returns empty array or network fails, mutates local history using jitter offsets in client memory.\n- **Visuals**:\n  - 3 Top stat cards (Total Users, Active Sessions, 24h Calls).\n  - 4 ApexCharts:\n    1. **Area**: `realtimeSeries` (Request count trends).\n    2. **Line**: `distributionSeries` (Average latency ms).\n    3. **Donut**: `statusSeries` (2xx, 4xx, 5xx distribution).\n    4. **Bar**: `usersSeries` (Active users over time intervals).\n  - 1 Vuetify `v-data-table` listing users (`id`, `name`, `email`, `status`).\n\n### `ApexChart.vue`\nPath: `frontend/src/modules/shared/components/ApexChart.vue`.\n\nThin wrapper over `apexcharts` library.\n\n- **Props**:\n  - `title` (`String`): Card title.\n  - `chartId` (`String`): DOM container ID.\n  - `series` (`ApexAxisChartSeries | ApexNonAxisChartSeries`): Data series array.\n  - `chartOptions` (`ApexOptions`): Apex chart config object.\n- **Reactivity**: Deep watchers on `props.series` and `props.chartOptions` trigger `chart.updateSeries()` and `chart.updateOptions()`.\n\n---\n\n## Testing & Quality\n\nTests located in `backend/app/modules/dashboard/tests/`:\n\n- `test_dashboard.py`:\n  - `test_dashboard_stats`: Validates field presence and integer types for `/stats`.\n  - `test_dashboard_realtime_endpoint`: Checks schema and list length for `/realtime`.\n  - `test_dashboard_realtime_camelcase_fields`: Asserts camelCase naming convention on response model (`avgResponseTime`, `status2xx`, etc.).\n  - `test_dashboard_realtime_value_ranges`: Validates generated mock data bounds.\n- `test_api_cors.py`:\n  - `test_cors_preflight_request`: Validates `OPTIONS` preflight headers for frontend origin `http://localhost:5173`.\n  - `test_cors_request_from_allowed_origin`: Checks `Access-Control-Allow-Origin` headers.","deployment-operations":"# Deployment & Operations\n\n# Deployment & Operations\n\n## Architecture Overview\n\nModule manage containerization, environment orchestration, Kubernetes manifests, CI/CD deployment scripts, and observability stack.\n\n```mermaid\nflowchart TD\n    Client[Client Traffic] --> Ingress[Nginx / K8s Ingress]\n    Ingress -->|/api/*| Backend[FastAPI Backend :8000]\n    Ingress -->|/*| Frontend[Vue SPA Static :80]\n    Backend --> DB[(SQLite / PostgreSQL)]\n    Backend -->|OTLP :4317/:4318| Collector[OTel Collector]\n    Collector --> Prometheus[Prometheus :9090]\n    Collector --> Tempo[Tempo :3200]\n    Collector --> Loki[Loki :3100]\n    Prometheus --> Grafana[Grafana :3000]\n    Tempo --> Grafana\n    Loki --> Grafana\n```\n\n---\n\n## Local & Container Orchestration\n\nRun with Docker Compose or Podman Compose. System detect engine automatically in `deploy.sh`.\n\n### 1. Dev Mode (Core Services Only)\nStart FastAPI and Vue frontend without monitoring stack:\n```bash\npodman-compose -f docker-compose.yml up -d --build\n```\n- Frontend mount: port `5173:80`\n- Backend mount: port `8000:8000`\n- Live code mount: `./backend/app -> /app/app`\n\n### 2. Dev Mode (With Full Observability Stack)\nInclude `docker-compose.override.yml`:\n```bash\npodman-compose -f docker-compose.yml -f docker-compose.override.yml up -d --build\n```\n\nStack components:\n- `otel-collector` (`otel/opentelemetry-collector-contrib:0.90.1`): Receives traces/metrics/logs on ports `4317` (gRPC), `4318` (HTTP). Exposes metrics on `8889`, health on `13133`.\n- `prometheus` (`prom/prometheus:v2.48.0`): Port `9090`. Config at `dockerdata/observability/prometheus/prometheus.yml`.\n- `grafana` (`grafana/grafana:10.2.2`): Port `3000`. Postgres backend. Auto-provisions dashboards/datasources. Anonymous Admin enabled.\n- `postgres` (`postgres:13`): Port `5432`. Backs Grafana database.\n- `loki` (`grafana/loki:2.9.2`): Port `3100`. Log aggregation. Run as `user: \"0\"` for permission handling.\n- `tempo` (`grafana/tempo:2.2.2`): Ports `3200` (UI/HTTP), `14268` (Jaeger gRPC), `9411` (Zipkin). Distributed tracing.\n- `alertmanager` (`prom/alertmanager:v0.27.0`): Port `9093`. Prometheus alert routing.\n- `nginx-exporter` (`nginx/nginx-prometheus-exporter:1.1.0`): Port `9113`. Scrapes `http://frontend/nginx_status`.\n\n### 3. Production Compose Mode\nCombine base with `docker-compose.prod.yml`:\n```bash\npodman-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build\n```\n- Sets `APP_ENV=prod`.\n- Disables live source volume mounts. Persists DB and logs to `dockerdata/prod/`.\n- Backend configures JSON logging with 10MB file rotation (`max-file: \"3\"`).\n\n---\n\n## Data Persistence & Directory Layout\n\nAll persistent state isolates inside `dockerdata/`:\n\n```text\ndockerdata/\n├── dev/\n│   ├── backend/\n│   │   ├── data/          # Dev SQLite databases (app.db, dev.db)\n│   │   └── logs/          # Dev logs (app.log, server.log)\n│   └── frontend/\n│       └── nginx/         # Dev Nginx reverse proxy configs\n├── prod/\n│   ├── backend/\n│   │   ├── data/          # Prod databases\n│   │   └── logs/          # Prod logs\n│   └── frontend/\n│       └── nginx/         # Prod Nginx configs\n└── observability/         # Monitoring configurations & persistent storage\n    ├── grafana/           # Dashboards, datasources, Postgres volume\n    ├── loki/              # loki-config.yml, storage data\n    ├── otel-collector/    # collector-config.yml\n    ├── prometheus/        # prometheus.yml, alertmanager.yml, alerts.yml\n    └── tempo/             # tempo-config.yml, storage data\n```\n\n---\n\n## Backend Containerization Lifecycle\n\n### Build (`backend/Dockerfile`)\n1. Base image: `python:3.11-slim`.\n2. Binary install: copies `uv` from `ghcr.io/astral-sh/uv:latest`.\n3. Dependency install: executes `uv venv && uv pip install .`.\n4. Doc build: executes `uv run mkdocs build --site-dir site`.\n5. Exposes port `8000`.\n\n### Container Startup (`backend/docker-entrypoint.sh`)\nRuns automatically on container boot:\n```bash\n# 1. Apply database schema migrations\nuv run alembic upgrade head\n\n# 2. Run initial database seed/bootstrap\nuv run python init_db.py\n\n# 3. Exec passed command (defaults to uvicorn app.main:app --host 0.0.0.0 --port 8000)\nexec uv run \"$@\"\n```\n\n### Local Dev Helper (`backend/Makefile`)\n- `make install`: Sync uv dependencies.\n- `make run`: Run Uvicorn server locally with hot-reload.\n- `make test`: Run pytest suite.\n- `make migrate`: Run `alembic upgrade head`.\n- `make makemigrations message=\"...\"`: Auto-generate Alembic revision.\n- `make lint` / `make format`: Ruff checks and formatting.\n- `make docs-serve`: Serve MkDocs locally.\n\n---\n\n## Kubernetes Deployment (GKE)\n\nProduction cluster deployment managed via Kubernetes manifests in `kubernetes/` and script `deploy-k8s.sh`.\n\n### Manifest Specifications\n\n#### `kubernetes/backend-deployment.yaml`\n- Deployment: `backend`\n- Strategy: `RollingUpdate` (`maxSurge: 25%`, `maxUnavailable: 0`)\n- Port: `8000`\n- Readiness probe: `HTTP GET /health` on port 8000 (`initialDelaySeconds: 5`, `periodSeconds: 5`)\n- Service: ClusterIP on port `80` targeting container port `8000`.\n\n#### `kubernetes/frontend-deployment.yaml`\n- Deployment: `frontend`\n- Strategy: `RollingUpdate` (`maxSurge: 25%`, `maxUnavailable: 0`)\n- Port: `80`\n- Service: `LoadBalancer` exposing port `80`.\n\n#### `kubernetes/ingress.yaml`\nGKE Ingress routes external traffic using `vue-python-demo-ip` static IP:\n- Host routing: `your-domain.com` (replaced dynamically during deploy)\n- `/api/*` -> backend service port `80`\n- `/*` -> frontend service port `80`\n\n### Automated Deployment Script (`deploy-k8s.sh`)\nDeploys code directly to GKE.\n\n**Usage:**\n```bash\n./deploy-k8s.sh <PROJECT_ID> <CLUSTER_NAME> <ZONE> <DOMAIN>\n```\n\n**Execution steps:**\n1. Verifies local `gcloud`, `docker`, `kubectl` availability.\n2. Configures GCP auth: `gcloud auth configure-docker --quiet`.\n3. Sets cluster context: `gcloud container clusters get-credentials`.\n4. Builds and pushes images:\n   - Backend: `gcr.io/${PROJECT_ID}/vue-python-demo-backend:latest`\n   - Frontend: `gcr.io/${PROJECT_ID}/vue-python-demo-frontend:latest`\n5. Replaces domain placeholder in `kubernetes/ingress.yaml` using `sed`.\n6. Applies manifests (`backend-deployment.yaml`, `frontend-deployment.yaml`, `ingress.yaml`).\n7. Executes rollout validation via `scripts/verify-rollout.sh`.\n\n---\n\n## Operations & Verification Scripts\n\n### Full CI/CD Local Test & Deploy (`deploy.sh`)\nAutomates pre-flight checks, testing, container build, and log output.\n- Logs stdout/stderr to `todo/normal.<timestamp>.log` and `todo/error.<timestamp>.log`.\n- Runs:\n  1. Backend unit tests: `OTEL_COLLECTOR_ENDPOINT=localhost:4317 uv run python -m pytest -v`\n  2. Frontend unit tests: `npm test`\n  3. Frontend build check: `npm run build`\n  4. OpenSpec registry checks: `openspec list`, `openspec view`\n  5. Container teardown and forced rebuild with override configuration: `$COMPOSE_CMD -f docker-compose.yml -f docker-compose.override.yml up -d --build --force-recreate`\n  6. Tails logs (50 lines) across backend, frontend, and all observability containers.\n\n### Rollout Verification (`scripts/verify-rollout.sh`)\nUsed in CI/CD pipeline to confirm zero-downtime rolling upgrades.\n```bash\n./scripts/verify-rollout.sh <deployment_name>\n```\n1. Detects newest ReplicaSet by creation timestamp.\n2. Waits for condition `Ready` with 120s timeout.\n3. Checks all older ReplicaSets have active replicas scaled to `0`. Fails pipeline if stale pods persist.\n\n### Security Audit (`scripts/security-tests.sh`)\nRuns suite of security scanners:\n- Secret leaks: `trufflehog filesystem . --fail`\n- Python vulnerabilities: `pip-audit`\n- Node dependencies: `npm audit --audit-level=high`\n- Container images: `trivy image --severity HIGH,CRITICAL`\n- Python AST security checks: `bandit -r backend/ -ll`\n\n### Performance Testing (`scripts/performance-test.py`)\nLocust load test suite. Tests root endpoint `GET /` and latency of prediction API `POST /predict`. Run with:\n```bash\nlocust -f scripts/performance-test.py\n```","documentation-specifications-agents-md":"# Documentation & Specifications — AGENTS.md\n\n# AGENTS.md Documentation\n\n`AGENTS.md` define operational rules, tool priorities, safety constraints for automated agents and developers working in `omnisight-platform-poc` repository.\n\n## Purpose\n\nFile configure AI agent behavior. Prevent uncontrolled refactors, enforce graph-based impact checks, route queries to correct documentation subsystems.\n\n## Tool Priority\n\nExecute operations in order:\n\n1. **Structure, call graph, blast radius:** `codebase-memory` first, `GitNexus` second. Avoid raw file grep.\n2. **Architecture docs:** OpenWiki (`openwiki/quickstart.md`) + GitNexus map generator.\n3. **Feature workflow:** OpenSpec (`opsx`).\n4. **Domain alignment & TDD:** `mattpocock` skills.\n\n```\nAgent Query\n  │\n  ├─ Graph / Impact ──> codebase-memory ─(fallback)─> GitNexus\n  ├─ Architecture   ──> OpenWiki (read-only)\n  ├─ Workflow       ──> OpenSpec (opsx)\n  └─ Domain / Tests ──> docs/agents/ + mattpocock skills\n```\n\n## Mandatory GitNexus Rules\n\nHard constraints. Do not bypass.\n\n### Required Actions\n- **Before edit symbol (function, class, method):** Run `impact({target: \"symbolName\", direction: \"upstream\"})`. Report blast radius to user.\n- **High/Critical risk:** Warn user before writing edits.\n- **Before commit:** Run `detect_changes()` to verify affected execution flows match expectations. For regression check: `detect_changes({scope: \"compare\", base_ref: \"master\"})`.\n- **Search concepts:** Run `query({search_query: \"concept\"})`. Returns process-grouped call traces.\n- **Symbol context:** Run `context({name: \"symbolName\"})` for callers, callees, flows.\n- **Security audit:** Run `explain({target: \"fileOrSymbol\"})` for taint analysis.\n\n### Prohibited Actions\n- NEVER modify symbols without prior `impact` check.\n- NEVER ignore HIGH or CRITICAL risk impact score.\n- NEVER rename symbols via text search-and-replace. Use `rename` tool.\n- NEVER commit changes without running `detect_changes()`.\n\n## CLI Index Management\n\nRefresh stale graph index:\n\n```bash\n# Auto-runner\nnode .gitnexus/run.cjs analyze\n\n# Fallback\nnpx gitnexus analyze\n```\n\n## Related Agent References\n\n| Context | Target Path | Notes |\n|---|---|---|\n| Wiki quickstart | `openwiki/quickstart.md` | Auto-generated via GitHub Actions. Do not edit manually. |\n| Issues | `docs/agents/issue-tracker.md` | GitHub Issues integration rules |\n| Labels | `docs/agents/triage-labels.md` | Default triage taxonomy |\n| Domain specs | `docs/agents/domain.md` | Single-context repository model |\n| Exploration skill | `.claude/skills/gitnexus/gitnexus-exploring/SKILL.md` | System architecture navigation |\n| Impact skill | `.claude/skills/gitnexus/gitnexus-impact-analysis/SKILL.md` | Blast radius calculation |\n| Debug skill | `.claude/skills/gitnexus/gitnexus-debugging/SKILL.md` | Error trace analysis |\n| Refactor skill | `.claude/skills/gitnexus/gitnexus-refactoring/SKILL.md` | Graph-aware refactor workflows |","documentation-specifications-agents-sample-md":"# Documentation & Specifications — AGENTS.sample.md\n\n# AGENTS.sample.md\n\n## Purpose\n\nTemplate for OpenCode-compatible agent instructions. Defines project configuration, commands, conventions, and tooling workflows.\n\n## Structure\n\n### Project Overview Section\n- **Name**: Project identifier\n- **Stack**: Technology stack (e.g., Vue 3 + Python FastAPI)\n- **Package manager**: Package manager used (pnpm/npm/bun/uv/poetry)\n- **Default branch**: Primary branch name (main/master)\n\n### Commands Section\nStandard development lifecycle commands:\n- **Install**: Dependency installation\n- **Dev**: Development server\n- **Build**: Production build\n- **Test**: Test execution\n- **Lint / typecheck**: Code quality checks\n- **Format**: Code formatting\n- **Useful one-liners**: Combined workflow commands\n\n### Conventions Section\n- Change granularity guidelines\n- Style consistency rules\n- Language/type system constraints\n- Test organization patterns\n- Commit message conventions\n- Branch/PR workflow\n\n### Tooling Priority Section\nDefines tool selection hierarchy:\n\n| Need | Prefer | Fallback |\n|------|--------|----------|\n| Spec/change lifecycle | OpenSpec | — |\n| Alignment/TDD/review | mattpocock skills | — |\n| Call graph/symbol search | codebase-memory MCP | GitNexus |\n| Architecture/process flows | GitNexus MCP | codebase-memory |\n| Narrative docs | OpenWiki | GitNexus generate_map |\n\n## Key Components\n\n### OpenSpec (Change Spine)\n- Non-trivial features: explore → propose/new → accept → apply → verify → archive\n- Tiny fixes may skip OpenSpec\n\n### mattpocock Skills\nAvailable skills:\n- `grill-with-docs` — alignment + CONTEXT.md/ADRs\n- `tdd` — red-green-refactor\n- `code-review` — standards + spec review\n- `improve-codebase-architecture` — periodic deepening\n- `diagnosing-bugs` — hard bug investigation\n- `ask-matt` — skill/flow selection\n- `setup-matt-pocock-skills` — initial setup\n\n### codebase-memory MCP\n- After large refactors: \"Index this project\"\n- Everyday use: `search_graph`, `trace_path`, `get_architecture`, `detect_changes`\n\n### GitNexus MCP\n- Indexed with repo-specific ID\n- Stale index: `node .gitnexus/run.cjs analyze`\n- Pre-edit impact: run upstream analysis\n- Pre-commit: `detect_changes()`\n- Graph-aware renames: GitNexus rename tool\n\n### OpenWiki\n- Source: `openwiki/quickstart.md`\n- Auto-generated documentation\n- CI workflow refreshes wiki\n- Update source docs, let OpenWiki regenerate\n\n## Feature Workflow\n\n```text\n1. Fuzzy idea → opsx explore or grill-with-docs + graph explore\n2. OpenSpec → propose/new → review proposal/design/tasks/specs\n3. Implement → apply + tdd; use codebase-memory/GitNexus\n4. Verify → opsx verify + change impact + code-review\n5. Close out → archive → refresh indexes → OpenWiki update\n```\n\n## Checklist\n- [ ] Explore/grill if problem fuzzy\n- [ ] OpenSpec artifacts accepted (non-trivial)\n- [ ] Impact checked (non-trivial symbol edits)\n- [ ] Tests green (new tests for new behavior)\n- [ ] detect_changes/review_change_impact before commit\n- [ ] Archive + index/docs refresh when done\n\n## Safety Rules\n- No secrets/.env with real credentials\n- No destructive git commands without explicit request\n- Prefer feature branches + PRs for shared work\n- Ask before CI/release/prod config changes\n\n## Domain References\n- Shared vocabulary: `CONTEXT.md` and `docs/adr/`\n- OpenSpec source: `openspec/specs/` and `openspec/changes/`\n- Workflow detail: `docs/feature-dev-workflow.md` (if present)\n\n## Template Status\nContains `TODO` placeholders requiring project-specific values.","documentation-specifications-backend-docs":"# Documentation & Specifications — backend-docs\n\n# Documentation & Specifications — backend-docs\n\nSystem auto-generates, validates, deploys backend API reference and module documentation.\n\n## Architecture\n\nMkDocs Material builds site from markdown docs, docstrings via `mkdocstrings`, and OpenAPI JSON spec.\n\n```mermaid\nflowchart TD\n    PYP[pyproject.toml] -->|Version single source| VER[core.version.get_version]\n    VER --> APP[FastAPI App]\n    APP -->|Generate| OAS[OpenAPI Spec JSON]\n    OAS -->|Render| REDOC[Redoc View]\n    CODE[app/modules/*] -->|Extract Google-style docs| MKD[mkdocstrings]\n    OAS --> MKDOCS[MkDocs Material Build --strict]\n    MKD --> MKDOCS\n    MKDOCS -->|Deploy merge| GHP[GitHub Pages]\n```\n\n## Key Components\n\n- **Build Engine**: `mkdocs-material` + `mkdocstrings[python]` (Google-style docstring parsing).\n- **API Spec Viewer**: Embedded Redoc rendering `openapi.json`.\n- **Breaking Change Checker**: `oasdiff` compares PR spec against `master` baseline.\n- **Coverage Checker**: `interrogate` enforces docstring coverage threshold on `app/modules/`.\n- **Nav Generator**: `scripts/generate_nav.py` maps `app/modules/` directory to `mkdocs.yml` nav tree.\n- **Update Automation**: `scripts/docs-update.sh` handles spec regen, strict build, changelog, and PR creation.\n\n## Versioning Strategy\n\n`backend/pyproject.toml` version field is single source of truth.\n\n- `app.modules.core.version.get_version()` reads version at runtime for FastAPI/OpenAPI metadata.\n- MkDocs tracks `master` continuously. No version tags for doc builds.\n- Releases bump version via edit in `backend/pyproject.toml`.\n\n## Local Operations\n\n### Build and Serve Documentation\n```bash\ncd backend\nPYTHONPATH=. uv run python scripts/update_openapi.py\nuv run mkdocs build --strict\nuv run mkdocs serve\n```\n\n### Auto-Update Navigation\nRun after adding files to `docs/modules/` or modules to `app/modules/`:\n```bash\ncd backend\npython scripts/generate_nav.py\n```\n\n### Automated Update Script\n```bash\n./scripts/docs-update.sh \"description of changes\"\n```\n\n### Check Docstring Coverage\nEnforces Phase 1 limit (>= 35%). Excludes tests.\n```bash\ncd backend\nuv run interrogate --fail-under 35 app/modules/admin app/modules/core app/modules/user app/modules/ai --exclude \"*/tests/*\"\n```\n\n### Check Version Sync\n```bash\ncd backend\nuv run python -c \"from app.modules.core.version import get_version; print('Version from pyproject.toml:', get_version())\"\n```\n\n## CI/CD Pipeline\n\nDefined in `.github/workflows/docs.yml`. Runs on PR to `master`:\n\n1. Start fresh app server, fetch OpenAPI JSON.\n2. Run `oasdiff` against `master` baseline. Block breaking changes without approval.\n3. Run `interrogate` check on target modules (`admin`, `core`, `user`, `ai`).\n4. Run `mkdocs build --strict`. Fails on broken links or unmapped docs.\n5. Post summary of API diff to GitHub PR.\n6. Merge to `master` triggers automatic deploy to GitHub Pages.\n\n## Module Documentation Structure\n\nModular monolith docs map to `app/modules/` structure:\n\n- `docs/modules/core/`: Shared utils, config, DB connections.\n- `docs/modules/ai/`: LLM integrations, RAG pipelines, vector store.\n- `docs/modules/user/`: User models, auth, RBAC.\n- `docs/modules/admin/`: Admin endpoints, status reporting.\n- `docs/modules/system/`: Health checks, system config.\n\n## Review Standards\n\nPR checklist for docs updates:\n\n- Module `\"\"\"` docstring and public function docstrings present (Google style).\n- Type hints present on all public methods.\n- Docstring coverage passes minimum 35% threshold.\n- `mkdocs build --strict` exits 0.\n- Changelog entry added under `docs/changelog/`.\n- PR label `api-breaking` applied if contract changes.\n\n## Known Issues\n\n- **OTEL Collector Unreachable (Port 4318)**: Build environment might fail connecting to local collector for trace data. Non-blocking; build continues without trace visualizations.","documentation-specifications-backend-scripts":"# Documentation & Specifications — backend-scripts\n\n# Documentation & Specifications — backend-scripts\n\nScript synchronizes `mkdocs.yml` navigation block with filesystem structure under `app/modules/` and markdown files under `docs/modules/`.\n\n```mermaid\nflowchart LR\n    A[app/modules/] --> C[generate_nav.py]\n    B[docs/modules/] --> C\n    C -->|Regex replace nav:| D[mkdocs.yml]\n```\n\n## Functions\n\n### `generate_nav() -> str`\nScans filesystem, builds YAML navigation string.\n\n- Iterates `app/modules/`. Ignores entries starting with `_`.\n- For each directory, checks `docs/modules/<module_name>/`.\n- Sorts found `.md` files. Converts `snake_case` filenames and directory names to Title Case.\n- Constructs hardcoded core navigation entries:\n  - `Home: index.md`\n  - `Workflow: WORKFLOW.md`\n  - `API Reference` (`api/index.md`, `api/openapi.md`)\n  - `Internal Modules` overview (`modules/index.md`)\n- Appends scanned module docs under `Internal Modules`.\n- Returns YAML string block.\n\n### `main() -> None`\nEntry point. Updates configuration file in place.\n\n1. Checks existence of `mkdocs.yml` in working directory. Exits if missing.\n2. Reads `mkdocs.yml` content.\n3. Locates `nav:` section using regex `^nav:.*?^(?=^[^ \\n]|\\Z)`.\n4. Replaces matched section with output from `generate_nav()`.\n5. Writes updated content back to `mkdocs.yml`.\n\n## Filesystem Expectations\n\nScript assumes execution from project root containing:\n\n| Path | Description |\n|---|---|\n| `app/modules/<module>/` | Python backend modules |\n| `docs/modules/<module>/*.md` | Markdown documentation per module |\n| `mkdocs.yml` | MkDocs configuration file target |\n\n## Usage\n\nRun directly via Python CLI from repository root:\n\n```bash\npython3 backend/scripts/generate_nav.py\n```","documentation-specifications-backend-site":"# Documentation & Specifications — backend-site\n\n# Documentation & Specifications — backend-site\n\nStatic HTML site bundle generated by MkDocs Material (`mkdocs-1.6.1`, `mkdocs-material-9.7.7`) and `mkdocstrings`. Serves internal API reference, workflow guidelines, and Python module documentation for OmniSight backend.\n\n```mermaid\nflowchart LR\n    PY[\"pyproject.toml<br/>(version single source)\"] --> V[\"app.modules.core.version\"]\n    APP[\"FastAPI App<br/>(app/main.py)\"] --> OA[\"OpenAPI JSON<br/>(scripts/update_openapi.py)\"]\n    CODE[\"Backend Modules<br/>(app/modules/*)\"] --> NAV[\"scripts/generate_nav.py\"]\n    NAV --> MK[\"mkdocs build --strict\"]\n    OA --> MK\n    MK --> SITE[\"backend/site/<br/>(HTML/CSS/JS Assets)\"]\n```\n\n## Structure & Generated Content\n\n- `backend/site/index.html`: Entry page. System overview, build instructions, CI/CD integration.\n- `backend/site/WORKFLOW/index.html`: Development workflow. Docstring policies, coverage thresholds, versioning strategy, CI validation rules.\n- `backend/site/modules/index.html`: Python module directory overview.\n- `backend/site/404.html`: Custom 404 handler configured for Material theme.\n- `backend/site/assets/_mkdocstrings.css`: Custom formatting for Python API signatures, parameters, symbol badges (`attr`, `func`, `meth`, `class`, `mod`).\n- `backend/site/assets/javascripts/lunr/tinyseg.js`: Japanese tokenizer module for Lunr client-side search indexing.\n\n## Tooling & Dependencies\n\n| Tool | Purpose | Configuration / Command |\n|---|---|---|\n| `mkdocs-material` | Static site generator & theme | `mkdocs.yml` (`features: navigation.tabs, navigation.sections, search.suggest`) |\n| `mkdocstrings[python]` | Extracts Google/NumPy-style docstrings | Embedded in navigation via markdown pages |\n| `interrogate` | Docstring coverage enforcement | Threshold $\\ge 35\\%$ (`--fail-under 35`) across `admin`, `core`, `user`, `ai` |\n| `oasdiff` | OpenAPI breaking change detection | Baseline comparison against `master` |\n| `scripts/generate_nav.py` | Auto-generates module navigation | Scans `app/modules/` |\n| `scripts/update_openapi.py` | Exports OpenAPI schema from FastAPI | Run with `PYTHONPATH=.` |\n\n## Versioning & Single Source of Truth\n\n- Version defined in `backend/pyproject.toml` (`version = \"x.y.z\"`).\n- FastAPI metadata reads version dynamically via `app.modules.core.version.get_version()`.\n- Docs site does not maintain standalone version; tracks latest commit on `master` branch.\n- Deployment fires automatically on merge to `master` (GitHub Pages).\n\n## Build & Local Preview\n\n```bash\ncd backend\n\n# 1. Update OpenAPI schema\nPYTHONPATH=. uv run python scripts/update_openapi.py\n\n# 2. Update navigation tree\npython scripts/generate_nav.py\n\n# 3. Check docstring coverage\nuv run interrogate --fail-under 35 app/modules/admin app/modules/core app/modules/user app/modules/ai --exclude \"*/tests/*\"\n\n# 4. Strict build and serve\nuv run mkdocs build --strict\nuv run mkdocs serve\n```\n\n## Known Operational Notes\n\n- **OTEL Collector Warning**: Build pipeline handles unreachable OTEL Collector (`localhost:4318`) gracefully. Non-blocking; docs compile without active trace visualizer data.","documentation-specifications-backend-tests":"# Documentation & Specifications — backend-tests\n\n# Documentation & Specifications — backend-tests\n\nLocation: `backend/tests/system/test_docs_mount.py`\n\n## Purpose\n\nSystem tests for internal documentation routes. Validates FastAPI app serves built MkDocs HTML pages at `/docs/internal/` prefix.\n\n## Fixtures\n\n### `client`\n- **Scope**: Function\n- **Type**: `starlette.testclient.TestClient`\n- **Action**: Wrap `app.main.app` in context manager. Yield client for HTTP calls.\n\n## Test Cases\n\n### `test_docs_mount_serves_index(client)`\n- **Target URL**: `/docs/internal/`\n- **Checks**:\n  - HTTP status 200\n  - `content-type` header contains `text/html`\n- **Purpose**: Verify root index page of documentation serves correctly.\n\n### `test_docs_mount_serves_module_pages(client)`\n- **Target URL**: `/docs/internal/modules/`\n- **Checks**:\n  - HTTP status 200\n  - `content-type` header contains `text/html`\n- **Purpose**: Verify generated module documentation subpath accessible.\n\n## Execution\n\nRun tests with `pytest`:\n\n```bash\npytest backend/tests/system/test_docs_mount.py\n```\n\n## Integration\n\n```\n[pytest TestClient] -> GET /docs/internal/* -> [FastAPI (app.main.app)] -> [Mounted Static Directory]\n```\n\nDepends on:\n- `app.main.app`: Main FastAPI application instance containing internal docs route mount.\n- MkDocs output files present in mounted static directory before test execution.","documentation-specifications-backend":"# Documentation & Specifications — backend\n\nBackend documentation module generates and serves API reference docs from source code and config. No runtime code. Pure static site generator.\n\nUses MkDocs with Material theme. Docs built from docstrings in Python files (`docstring_style: google`). Auto-generates API reference from `.py` files under `backend/`.\n\nKey components:\n- `mkdocs.yml`: configures site structure, theme, plugins\n- `nav:` defines hierarchy: Home, Workflow, API Reference, Internal Modules\n- `mkdocstrings` plugin: extracts docstrings → HTML\n- `search` plugin: enables full-text search\n- `admonition`, `superfences`, `tabbed`: enhance readability\n\nNo execution flows. No incoming/outgoing calls. This module does not run. It builds.\n\nDocs live at `backend/docs/`. Deployed as static site. Developers edit source code docstrings. Docs auto-update on build.\n\n`strict: true` → fails build on broken links or missing pages. Enforces completeness.\n\nponytail: if API grows beyond 50 endpoints, add OpenAPI validation hook. Add when CI/CD pipeline needs schema enforcement.\n\n→ skipped: live reload server, add when local dev needs hot-reload during doc editing.","documentation-specifications-docs-agents":"# Documentation & Specifications — docs-agents\n\n# Documentation & Specifications — docs-agents Module\n\n## Purpose\n\nThe `docs-agents` module defines conventions and workflows for consuming domain documentation and managing issues in this repository. It serves as a guide for engineering skills navigating the codebase and for contributors interacting with the issue tracker.\n\n## Key Components\n\n### 1. Domain Documentation (`docs/agents/domain.md`)\n\n**Purpose**: Standardizes how developers explore and understand the codebase's domain model.\n\n**Key Concepts**:\n\n- **CONTEXT.md**: Primary entry point for understanding repository context. Located at repo root for single-context repos, or in each context directory for multi-context repos.\n- **CONTEXT-MAP.md**: For multi-context repos, points to individual `CONTEXT.md` files per context.\n- **ADR (Architecture Decision Records)**: Found in `docs/adr/` (system-wide) or `src/<context>/docs/adr/` (context-specific). Documents resolved decisions.\n\n**Workflow**:\n1. Read `CONTEXT.md` or `CONTEXT-MAP.md` first\n2. Review relevant ADRs in `docs/adr/`\n3. Use glossary terms from `CONTEXT.md` consistently\n4. Flag conflicts with existing ADRs explicitly\n\n**File Structure Patterns**:\n\nSingle-context repo:\n```\n/\n├── CONTEXT.md\n├── docs/adr/\n│   ├── 0001-event-sourced-orders.md\n│   └── 0002-postgres-for-write-model.md\n└── src/\n```\n\nMulti-context repo:\n```\n/\n├── CONTEXT-MAP.md\n├── docs/adr/\n└── src/\n    ├── ordering/\n    │   ├── CONTEXT.md\n    │   └── docs/adr/\n    └── billing/\n        ├── CONTEXT.md\n        └── docs/adr/\n```\n\n### 2. Issue Tracker (`docs/agents/issue-tracker.md`)\n\n**Purpose**: Defines GitHub-based issue management using the `gh` CLI.\n\n**Core Operations**:\n\n| Operation | Command |\n|-----------|---------|\n| Create issue | `gh issue create --title \"...\" --body \"...\"` |\n| Read issue | `gh issue view <number> --comments` |\n| List issues | `gh issue list --state open --json number,title,body,labels,comments --jq '...'` |\n| Comment | `gh issue comment <number> --body \"...\"` |\n| Add label | `gh issue edit <number> --add-label \"...\"` |\n| Remove label | `gh issue edit <number> --remove-label \"...\"` |\n| Close | `gh issue close <number> --comment \"...\"` |\n\n**Triage Labels** (from `triage-labels.md`):\n- `needs-triage` - Maintainer evaluation needed\n- `needs-info` - Waiting on reporter\n- `ready-for-agent` - Fully specified, ready for automated agent\n- `ready-for-human` - Requires human implementation\n- `wontfix` - Will not be actioned\n\n**Wayfinding Operations** (used by `/wayfinder`):\n\n- **Map**: Single issue with label `wayfinder:map`, containing Notes/Decisions/Fog\n- **Child tickets**: Issues linked as sub-issues or in task lists with `Part of #<map>`\n- **Blocking**: Native GitHub dependencies via `gh api` calls\n- **Frontier query**: List open, unblocked, unassigned children\n- **Claim**: `gh issue edit <n> --add-assignee @me`\n- **Resolve**: Comment answer, close issue, update map's Decisions-so-far\n\n### 3. Triage Labels (`docs/agents/triage-labels.md`)\n\n**Purpose**: Maps abstract triage roles to concrete label strings.\n\n**Role Mapping**:\n\n| Skills Role | Tracker Label | Meaning |\n|-------------|---------------|---------|\n| `needs-triage` | `needs-triage` | Maintainer needs to evaluate |\n| `needs-info` | `needs-info` | Waiting on reporter |\n| `ready-for-agent` | `ready-for-agent` | Ready for AFK agent |\n| `ready-for-human` | `ready-for-human` | Requires human implementation |\n| `wontfix` | `wontfix` | Will not be actioned |\n\n## Integration with Codebase\n\n### Connection Points\n\n1. **Domain Docs → Issue Tracker**: ADRs and CONTEXT.md files are referenced when creating issues to ensure consistent terminology and decision history.\n\n2. **Triage Labels → Wayfinding**: Labels determine issue state in the wayfinder workflow, controlling which tickets appear in frontier queries.\n\n3. **Issue Tracker → Domain Docs**: Wayfinding maps and decisions-so-far sections link back to ADRs and CONTEXT.md for context.\n\n### Skill Integration\n\nSkills interact with this module through:\n- `/domain-modeling` - Creates CONTEXT.md and ADRs lazily\n- `/wayfinder` - Uses issue tracker operations for navigation\n- Various skills - Apply triage labels based on role mappings\n\n## Usage Patterns\n\n### Exploring the Codebase\n\n```bash\n# Read primary context\ncat CONTEXT.md\n\n# List relevant ADRs\nls docs/adr/\n\n# View specific ADR\ncat docs/adr/0001-event-sourced-orders.md\n```\n\n### Managing Issues\n\n```bash\n# Create issue with heredoc body\ngh issue create --title \"Fix auth middleware\" --body \"$(cat <<'EOF'\nBug in auth middleware. Token expiry check use `<` not `<=`.\n\nFix:\n- Change comparison operator\n- Add test case\nEOF\n)\"\n\n# Query frontier tickets\ngh issue list --state open --label \"wayfinder:map\" --json ...\n```\n\n### Wayfinding Workflow\n\n```bash\n# Create a wayfinder map\ngh issue create --label wayfinder:map --title \"Explore billing context\"\n\n# Add child ticket\ngh issue create --title \"Document billing domain\" --body \"Part of #123\"\n\n# Block ticket\ngh api --method POST repos/owner/repo/issues/456/dependencies/blocked_by -F issue_id=123\n\n# Claim ticket\ngh issue edit 456 --add-assignee @me\n```","documentation-specifications-docs-architecture-decisions":"# Documentation & Specifications — docs-architecture-decisions\n\n# Architecture Decision Records (ADR)\n\nModule store design choices for RAG system. Use ADRs to track evolution, prevent regression, and onboard developers.\n\n## Core Stack\n- **Frontend**: Vue 3 (Composition API), Pinia, ECharts.\n- **Backend**: FastAPI (Async), SQLAlchemy 2.0.\n- **Infrastructure**: Docker, K8s (GKE), Prometheus/Grafana.\n\n## Data & Vector Strategy\nSystem use `VectorStore` abstraction to swap implementations based on environment.\n- **Development**: ChromaDB. Local, file-based, zero infra requirements.\n- **Production**: PGVector. ACID compliance, HNSW index, shared PostgreSQL infra.\n- **Constraint**: Keep embedding dimension (384) and metadata schema identical across providers.\n\n## System Pattern: Modular Monolith\nCode split into `backend/app/modules/` (auth, ai, dashboard, system).\n- **Boundary**: Logic isolated in code; shared database.\n- **Communication**: Direct function calls. No network latency.\n- **Benefit**: Simple deployment, transactional consistency, easy microservice migration path.\n\n## Scaling & Performance\n- **API**: Horizontal Pod Autoscaling (2-10 replicas) triggered at 70% CPU.\n- **Database**: Read replicas for RAG retrieval. Connection pooling (size=10, overflow=20).\n- **Search**: HNSW index (m=16, ef_construction=64) for sub-linear ANN search.\n- **Limits**: Per-user token caps and global RPS limits protect LLM budget and DB stability.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    UI[Vue 3 Frontend] --> API[FastAPI Gateway]\n    subgraph \"Modular Monolith\"\n        API --> Auth[Auth Module]\n        API --> AI[AI/RAG Module]\n        API --> Dash[Dashboard Module]\n    end\n    Auth & AI & Dash --> DB[(PostgreSQL + pgvector)]\n    AI -.-> Local[ChromaDB - Dev Only]\n```\n\n## Maintenance\n1. **New Decisions**: Create `docs/architecture-decisions/NNNN-name.md`.\n2. **Format**: Context, Decision, Rationale, Consequences.\n3. **Review**: Architecture changes require PR approval from lead dev.\n\n→ skipped: ADR versioning tool, add when team > 20.","documentation-specifications-docs-changelog":"# Documentation & Specifications — docs-changelog\n\n# Documentation & Specifications — docs-changelog\n\n## Purpose\nTrack codebase changes, API surface impacts, test validation records. Provide historical audit trail for backend updates, core infrastructure modifications, documentation rebuilds.\n\n## Directory Structure\n```\ndocs/changelog/\n├── updates.md                                         # Chronological summary index\n├── 2026-08-22-add-docstrings-to-admin-and-core.md     # Detailed change record\n└── 2026-08-22-add-docstrings-to-rag-ingestion-service.md # Detailed change record\n```\n\n## Core Files\n\n### 1. Cumulative Summary Index (`updates.md`)\nSingle running list of high-level changes. Reverse-chronological or date-grouped bullet list.\n* Format: `- YYYY-MM-DD: <Short summary of change>`\n* Tracks cross-cutting updates (core modules, AI services, bug fixes, workflow docs).\n\n### 2. Granular Change Logs (`YYYY-MM-DD-<topic>.md`)\nDetailed documentation per significant change set. \n\nStandard sections:\n* `# YYYY-MM-DD: <Title>`: Scope and target component.\n* `## Changes`: List of affected files, methods, modules.\n* `## API Impact`: OpenAPI schema modifications, doc rebuilding notes, breaking change warnings.\n* `## Testing`: Test suite pass counts, verification criteria, build status.\n\n## Contribution Workflow\n\n1. Create detail file: `docs/changelog/YYYY-MM-DD-<slug>.md`.\n2. Fill standard sections (`Changes`, `API Impact`, `Testing`).\n3. Append summary line to `docs/changelog/updates.md`.\n4. Run test suite and docs build to verify documented state.","documentation-specifications-docs-research":"# Documentation & Specifications — docs-research\n\n# Research: Vue 3 Charting Libraries for Real-time Visualization\n\n## Purpose\nEvaluation of charting libraries for Vue 3 real-time dashboard visualization. Measures Vue 3 Composition API support, TypeScript integration, real-time update performance, chart varieties, and bundle management.\n\n## Evaluated Options\n\n```mermaid\ngraph TD\n    A[Real-time Data Stream] --> B{Charting Library}\n    B -->|Fast Setup / Standard Charts| C[vue3-apexcharts]\n    B -->|High Frequency / Complex Custom| D[vue-echarts]\n    B -->|Lightweight / Simple Standard| E[vue-chartjs]\n```\n\n### 1. `vue3-apexcharts`\n* **Target:** Rapid dashboard setup with standard modern charts.\n* **Composition API:** Native `<script setup>` compatibility, uses reactive primitives.\n* **TypeScript:** Full native support.\n* **Real-time Performance:** Automatic reactive prop updates. Provides `appendData` API to append points without full-chart re-render.\n* **Bundle Optimization:** Tree-shakeable.\n* **Supported Types:** Line, Area, Bar, Pie, Donut, Scatter, Bubble, Heatmap, RadialBar, Candlestick.\n\n### 2. `vue-echarts` (v8+)\n* **Target:** High-frequency data feeds, complex data types (geographic, relational graphs).\n* **Composition API:** Native `<script setup>`, `ref`, `provide` usage. Dropped Vue 2 support.\n* **TypeScript:** Strong upstream Apache ECharts types.\n* **Real-time Performance:** Smart diffing on `option` prop. Supports `manual-update` prop to bypass Vue reactivity overhead and invoke native `setOption`.\n* **Bundle Optimization:** Dynamic import code generator for tree-shaking specific renderers/charts.\n* **Supported Types:** Extensive. Standard 2D charts, 3D, GL, Graph, Heatmap, Treemap, Geo/Map.\n\n### 3. `vue-chartjs` (Chart.js v4+)\n* **Target:** Simple, lightweight standard charts with low overhead.\n* **Composition API:** Functional wrapper over Canvas element.\n* **TypeScript:** Standard definitions from Chart.js upstream.\n* **Real-time Performance:** Automatic re-renders on `chartData` / `chartOptions` mutations.\n* **Caveat:** Direct reactivity on props triggers \"Target is readonly\" warnings; requires deep cloning or unwrap before assignment.\n* **Supported Types:** Line, Bar, Pie, Doughnut, Polar Area, Bubble, Radar, Scatter.\n\n---\n\n## Comparison Matrix\n\n| Feature | `vue3-apexcharts` | `vue-echarts` | `vue-chartjs` |\n| :--- | :--- | :--- | :--- |\n| **Vue 3 API** | Native (`<script setup>`) | Native (v8+ pure Vue 3) | Wrapper component |\n| **TS Types** | Full built-in | Strong (ECharts upstream) | Strong (Chart.js upstream) |\n| **Real-time API** | `appendData` method | `manual-update` + `setOption` | Prop mutation / re-render |\n| **Render Engine** | SVG / Canvas | Canvas / SVG | Canvas |\n| **Complexity** | Low–Medium | Medium–High | Low |\n\n---\n\n## Selection Guide\n\n* Use `vue-echarts` when update frequency exceeds 10Hz or when non-standard visualizations (e.g. topologies, heatmaps) needed.\n* Use `vue3-apexcharts` for general-purpose metric dashboards needing out-of-the-box styling and `appendData` capability.\n* Use `vue-chartjs` for lightweight apps needing basic charts with minimal bundle impact.","documentation-specifications-docs":"# Documentation & Specifications — docs\n\n# Documentation & Specifications — docs\n\nDirectory contains developer operational manuals, agent-assisted workflows, testing recipes, and security audit records.\n\n```\ndocs/\n├── cypress-testing-guide.md   # E2E test setup, Cypress commands, examples\n├── feature-dev-workflow.md    # AI-assisted feature engineering loop\n└── security-analysis.md       # Dependency scan results and remediation steps\n```\n\n---\n\n## 1. E2E Testing Guide (`docs/cypress-testing-guide.md`)\n\nInstructions for Cypress frontend test execution.\n\n### Structure\n- Config: `frontend/cypress.config.ts` (sets `baseUrl: http://localhost:5173`)\n- Spec root: `frontend/cypress/e2e/`\n- Reference spec: `frontend/cypress/e2e/observability.cy.ts`\n\n### Key Test Pattern\nValidate DOM interactions and verify external telemetry sinks directly via HTTP requests:\n\n```typescript\ndescribe('Observability E2E', () => {\n  it('sends metrics to the collector', () => {\n    cy.visit('http://localhost:5173');\n    cy.wait(2000);\n    cy.request('http://localhost:8889/metrics').then((response) => {\n      expect(response.status).to.eq(200);\n      expect(response.body).to.include('document_load_duration_seconds');\n    });\n  });\n});\n```\n\n### Execution Commands\n\nRun inside `frontend/`:\n\n```bash\n# Interactive UI Runner\nnpx cypress open\n\n# Headless run (CI target)\nnpx cypress run\n\n# Specific spec execution\nnpx cypress run --spec \"cypress/e2e/observability.cy.ts\"\n```\n\n---\n\n## 2. Feature Development Workflow (`docs/feature-dev-workflow.md`)\n\nMulti-tool protocol combining specification engines, code graph indexers, and LLM coding skills.\n\n### Tool Stack Responsibility Matrix\n\n| Tool | Primary Scope | Core Actions |\n|---|---|---|\n| **OpenSpec** | Change lifecycle tracking | `/opsx:new`, `/opsx:ff`, `/opsx:apply`, `/opsx:verify`, `/opsx:archive` |\n| **mattpocock/skills** | Alignment, TDD, reviews | `/grill-with-docs`, `/tdd`, `/code-review`, `/diagnosing-bugs` |\n| **codebase-memory** | Token-efficient call graph search | `trace_path`, `detect_changes`, `review_change_impact` |\n| **GitNexus** | Visual blast radius, architecture export | `gitnexus analyze`, `detect_impact`, `/gitnexus:generate_map` |\n| **OpenWiki** | Persistent documentation | `openwiki --init`, `openwiki --update` |\n\n### Standard Development Lifecycle\n\n```mermaid\ngraph TD\n    P0[Phase 0: Explore] -->|/opsx:new| P1[Phase 1: Specs & Design]\n    P1 -->|Approve artifacts| P2[Phase 2: Apply + TDD]\n    P2 -->|Verify| P3[Phase 3: Impact Analysis]\n    P3 -->|/opsx:archive| P4[Phase 4: Sync Docs & Graphs]\n```\n\n1. **Phase 0 (Exploration):** Use `/opsx:explore` and codebase-memory graph lookup. Output domain alignment to `CONTEXT.md` / ADR.\n2. **Phase 1 (Specification):** Run `/opsx:new <feature>` or `/opsx:ff`. Human review required for `proposal.md`, `design.md`, `tasks.md`, `specs/` before implementation.\n3. **Phase 2 (Implementation):** Run `/opsx:apply` with `/tdd` red-green-refactor loop. Check caller chains via `trace_path`.\n4. **Phase 3 (Validation & Review):** Run `/opsx:verify`, compute blast radius with `review_change_impact` or `detect_impact`, run `/code-review`.\n5. **Phase 4 (Archival & Sync):** Run `/opsx:archive`, re-index graph tools (`codebase-memory`, `gitnexus analyze`), run `openwiki --update`.\n\n---\n\n## 3. Security Analysis (`docs/security-analysis.md`)\n\nAudit baseline recorded August 14, 2026.\n\n### Vulnerability Log\n\n| Package | Version | Severity | Impact | Remediation |\n|---|---|---|---|---|\n| `happy-dom` | ≤ 20.8.8 | Critical | VM Context Escape -> RCE | Run `npm audit fix --force` |\n| `brace-expansion` | 2.0.0-2.1.3 | High | Unbounded expansion DoS | Run `npm audit fix` |\n| `nanoid` | < 3.3.18 | High | Infinite loop on `size=0` DoS | Run `npm audit fix` |\n| `@opentelemetry/core` | < 2.8.0 | Moderate | W3C Baggage memory allocation leak | Run `npm audit fix --force` |\n| `esbuild` | ≤ 0.24.2 | Moderate | SSR request bypass | Run `npm audit fix --force` |\n| `postcss` | ≤ 8.5.22 | Moderate | Arbitrary `.map` file read | Run `npm audit fix` |\n\n### Tool Setup & Security Actions\n\n```bash\n# Missing scanner dependencies\npip install pip-audit bandit\nnpm install -g trufflehog trivy\n\n# Remediation sequence\nnpm audit fix\nnpm audit fix --force # Verify breaking changes on happy-dom and @opentelemetry/core\n```\n\n---\n\n## Integration with Codebase\n\n- `docs/cypress-testing-guide.md` governs frontend test harness in `frontend/cypress/`.\n- `docs/feature-dev-workflow.md` governs agent tool configuration in `CLAUDE.md` and `AGENTS.md`.\n- `docs/security-analysis.md` tracks patches needed in `frontend/package.json` and backend Python requirements.","documentation-specifications-knowledgegraph-sh":"# Documentation & Specifications — knowledgeGraph.sh\n\n# knowledgeGraph.sh\n\nGenerates repository knowledge graph via chained documentation tools.\n\n## Purpose\n\nAutomates multi-step documentation pipeline: git analysis → wiki generation → wiki update. Single entry point for full doc refresh.\n\n## Usage\n\n```bash\n./knowledgeGraph.sh\n```\n\nRuns from script directory (auto-detected via `realpath`).\n\n## Pipeline Steps\n\n| Step | Command | Output |\n|------|---------|--------|\n| 1 | `gitnexus status` | Repo health summary |\n| 2 | `gitnexus analyze .` | Code structure analysis |\n| 3 | `gitnexus wiki .` | Markdown wiki generation |\n| 4 | `openwiki --update` | Wiki index refresh |\n\nStep 5 (`openwiki` with prompt) commented out — manual trigger for AI doc generation.\n\n## Dependencies\n\n- `gitnexus` — CLI for git repo analysis and wiki gen\n- `openwiki` — Wiki builder/indexer\n- Both must be in `PATH`\n\n## Execution Flow\n\n```mermaid\nflowchart LR\n    A[knowledgeGraph.sh] --> B[gitnexus status]\n    A --> C[gitnexus analyze .]\n    A --> D[gitnexus wiki .]\n    A --> E[openwiki --update]\n    style A fill:#f9f,stroke:#333\n```\n\n## Integration\n\nCalled manually or via CI. No incoming calls. No internal functions. Pure orchestration script.\n\n## Customization\n\nEdit script to:\n- Add/remove pipeline steps\n- Change `PROJECT_ROOT` logic\n- Uncomment AI doc generation step\n- Add flags for selective execution\n\n## Failure Modes\n\n- Missing `gitnexus`/`openwiki` → command not found\n- Non-git directory → `gitnexus` errors\n- Permission denied on wiki output dir → `openwiki` fails\n\nEach step runs independently; later steps execute even if prior fail. Add `set -e` or `&&` chaining for strict failure handling.","documentation-specifications-openspec-changes":"# Documentation & Specifications — openspec-changes\n\n# openspec-changes\n\nPurpose: Track system changes via detailed specs.\n\nStructure:\n- Each change in dated dir under openspec/changes/archive/\n- Dir name: YYYY-MM-DD-short-description\n- Files per change:\n  - design.md: context, goals, decisions, risks\n  - proposal.md: why, what, capabilities, impact\n  - specs/: requirement specs for new/modified capabilities\n  - tasks.md: completed tasks checklist\n\nUsage:\n- Read design/proposal for context\n- Read specs for detailed requirements\n- Read tasks for implementation status\n- To add change: new dir with date and desc, add design, proposal, specs, tasks files\n\nConnection:\n- No executable code\n- Documents changes to main app (backend/frontend)\n- Each change links to code changes in main app\n- Specs used to verify implemented code\n\nNote: Main app code lives in backend/ and frontend/ directories. openspec-changes only contains specifications.","documentation-specifications-openspec-design":"# Documentation & Specifications — openspec-design\n\n# API Versioning and Fallback Specification\n\nDesign specification for FastAPI multi-version routing (v1/v2) with explicit delegation fallback.\n\n## Architectural Design\n\nUses explicit Router Delegation pattern over dynamic middleware rewrite. Maintains static type safety, OpenAPI schema accuracy, testability.\n\n```mermaid\ngraph TD\n    Client[HTTP Request] --> RootRouter[app/api/router.py]\n    RootRouter -->|/v1| V1Router[app/api/v1/router.py]\n    RootRouter -->|/v2| V2Router[app/api/v2/router.py]\n    V2Router -->|v2 module exists| V2Admin[app/modules/v2/admin]\n    V2Router -->|fallback to v1| V1Users[app/api/v1/endpoints/users]\n```\n\n## Directory Structure\n\n```text\napp/api/\n├── v1/\n│   └── router.py\n├── v2/\n│   └── router.py\n└── router.py\n```\n\n- `app/api/router.py`: Root API dispatcher. Mounts `/v1` and `/v2` prefixes.\n- `app/api/v1/router.py`: Aggregates baseline v1 endpoints.\n- `app/api/v2/router.py`: Aggregates v2 implementations; delegates missing modules to v1 endpoints.\n- `app/modules/v2/`: New v2 feature logic isolated here.\n\n## Implementation Pattern\n\nIn `app/api/v2/router.py`, register native v2 modules. Bind missing v2 endpoints to v1 router instances:\n\n```python\nfrom fastapi import APIRouter\nfrom app.modules.v2.admin import router as admin_v2\nfrom app.api.v1.endpoints import users as users_v1\n\nv2_router = APIRouter()\n\n# Native v2 module\nv2_router.include_router(admin_v2, prefix=\"/admin\")\n\n# Fallback: /api/v2/users serves v1 implementation\nv2_router.include_router(users_v1, prefix=\"/users\")\n```\n\n## Strategy Trade-offs\n\n| Strategy | Pros | Cons |\n| :--- | :--- | :--- |\n| **Router Delegation** (Selected) | Type-safe, OpenAPI doc accuracy, clear routing boundaries, easy unit tests | Manual fallback list maintenance in `v2/router.py` |\n| **Middleware Rewrite** | Automatic fallback without code changes | Breaks request context, obscures route tracing, bypasses schema generation |","documentation-specifications-openspec-specs":"# Documentation & Specifications — openspec-specs\n\n# Documentation & Specifications — openspec-specs Module\n\n## Purpose\n\nThis module aggregates all system specifications across backend, frontend, infrastructure, and operational concerns. Each spec defines requirements using Gherkin-style scenarios (WHEN/THEN) that serve as executable test cases.\n\n## Structure\n\nSpecifications organized by domain:\n\n- **Backend Core**: Configuration, database, CORS, error handling, migrations\n- **API Layer**: Versioning, routing, health endpoints, dashboard stats\n- **Frontend Core**: App structure, layout, theme, state management, testing\n- **Infrastructure**: Docker orchestration, OpenTelemetry, monitoring stack\n- **Specialized Features**: RAG pipeline, experiment tracking, user profiles\n\n## Key Components\n\n### Backend Specifications\n\n**Configuration** (`backend-config`, `core-config`)\n- `Settings` class with Pydantic validation\n- Environment variable loading from `.env`\n- Required parameters: `DATABASE_URL`, `SECRET_KEY`, `DEBUG`, `CORS_ORIGINS`, `API_V1_PREFIX`\n\n**Database Layer** (`backend-database`, `database-layer`)\n- SQLAlchemy engine with PostgreSQL/SQLite support\n- `SessionLocal` factory for session creation\n- `get_db()` FastAPI dependency for request-scoped sessions\n- `Base` declarative class for ORM models\n\n**API Endpoints** (`backend-api-versioning`, `api-versioning`)\n- v1 router mounted at `/api/v1`\n- Health endpoints: `GET /health`, `GET /api/v1/health`\n- Dashboard stats: `GET /api/v1/dashboard/stats`\n- Users: `GET /api/v1/users`\n\n**Migrations** (`alembic-migrations`, `auto-migration`)\n- Alembic configured in `alembic/` directory\n- Auto-migration on container startup\n- Initial empty migration baseline\n\n### Frontend Specifications\n\n**Application Structure** (`frontend-app`, `app-layout-integration`)\n- `main.ts` initializes Vue, Vuetify, Pinia, Router\n- `App.vue` renders `DefaultLayout` with `<router-view />`\n- Build excludes `__tests__` from type checking\n\n**Layout System** (`frontend-layout`, `vuetify-layout`)\n- `DefaultLayout` component with:\n  - `v-app-bar`: title \"AI Platform\", theme toggle\n  - `v-navigation-drawer`: Dashboard link, responsive behavior\n  - `<router-view />`: page content\n\n**State Management** (`frontend-state`, `theme-management`)\n- `theme` store: `isDark`, `toggleTheme()`, `initTheme()` with localStorage persistence\n- `auth` store: `user`, `setUser()`, `logout()`, `isAuthenticated`\n\n**Testing** (`frontend-testing`, `api-testing`)\n- Vitest with Vue Test Utils, `happy-dom` environment\n- Tests for components, stores, router, API composable, Dashboard view\n\n### Infrastructure Specifications\n\n**Docker Orchestration** (`docker-orchestration`)\n- `docker-compose.yml` at repository root\n- Backend and frontend services defined\n- `.env.example` documents required variables\n\n**Monitoring Stack** (`opentelemetry-*`, `prometheus`, `tempo`, `loki`)\n- OTel Collector receives traces/metrics/logs from backend/frontend\n- Prometheus scrapes `/metrics` endpoints\n- Tempo stores distributed traces\n- Loki aggregates logs\n- Grafana visualizes all telemetry\n\n## Architecture Flow\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│                     Docker Compose                          │\n├──────────┬──────────┬──────────┬──────────┬─────────────────┤\n│ Backend  │ Frontend │ OTel     │ Prometheus│ Grafana       │\n│ (FastAPI)│ (Vue)    │ Collector│          │                 │\n└────┬─────┴────┬─────┴────┬─────┴────┬─────┴────────┬────────┘\n     │          │          │          │              │\n     │    ┌─────┴─────┐    │          │              │\n     │    │   Loki    │    │          │              │\n     │    └───────────┘    │          │              │\n     │                     │          │              │\n     └────────────┬────────┘          │              │\n                  │                   │              │\n               ┌──▼──┐              ┌─▼─┐            │\n               │Tempo├──────────────►│   │            │\n               └─────┘              │   │            │\n                                    │   │            │\n                               ┌────┴───┴────┐       │\n                               │   Grafana   │◄──────┘\n                               └─────────────┘\n```\n\n## Execution Flows\n\n### Backend Startup\n1. Container starts\n2. Auto-migration runs `alembic upgrade head`\n3. FastAPI app initializes\n4. CORS middleware configured from `settings.CORS_ORIGINS`\n5. API router mounted at `settings.API_V1_PREFIX`\n\n### Frontend Request\n1. User navigates to route\n2. `DefaultLayout` renders with `RouterView`\n3. Component calls `useApi()` composable\n4. Axios request sent to backend\n5. Response processed, errors handled\n\n### Theme Persistence\n1. User clicks theme toggle\n2. `theme.toggleTheme()` updates `isDark`\n3. Preference saved to `localStorage`\n4. Vuetify theme switches\n5. On reload, `theme.initTheme()` restores preference\n\n## Test Coverage\n\nEach specification scenario maps to test cases:\n\n- **Backend**: `test_404_error`, `test_database_connection`, `test_api_cors`\n- **Frontend**: `Dashboard.test.ts`, `theme.test.ts`, `auth.test.ts`, `useApi.test.ts`\n\nRun tests: `npm test` (frontend), `pytest` (backend)\n\n## Migration Notes\n\n**Breaking Changes**:\n- Direct route handling replaced with delegation pattern\n- TypeScript 5.3.x → 5.6.0+ (Pinia compatibility)\n- In-memory route registry → persistent version registry\n\n**Upgrade Path**:\n1. Update TypeScript version\n2. Refactor routing to use delegation\n3. Replace in-memory registries with persistent storage","documentation-specifications-openspec":"# Documentation & Specifications — openspec\n\n# Documentation & Specifications — openspec\n\nConfiguration module for OpenSpec spec-driven workflow. Defines root parameters, environment context, generation rules for AI-created project artifacts.\n\n## File Structure\n\n- `openspec/config.yaml`: Core configuration file.\n\n## Configuration Schema\n\nFile use YAML. Controls artifact generation constraints.\n\n```yaml\nschema: spec-driven\ncontext: string # Optional\nrules: # Optional\n  <artifact_type>:\n    - string\n```\n\n### Fields\n\n| Field | Type | Required | Description |\n| :--- | :--- | :--- | :--- |\n| `schema` | `string` | Yes | Workflow mode. Set to `spec-driven`. |\n| `context` | `string` | No | Freeform markdown/text injected into AI prompt. Holds tech stack, repo conventions, style guides. |\n| `rules` | `map[string][]string` | No | Map of artifact names (`proposal`, `tasks`, etc.) to validation and format constraints. |\n\n## Example\n\n```yaml\nschema: spec-driven\n\ncontext: |\n  Tech stack: TypeScript, React, Node.js\n  Git: Conventional Commits\n  Domain: Core platform API\n\nrules:\n  proposal:\n    - Keep proposals under 500 words\n    - Always include \"Non-goals\" section\n  tasks:\n    - Break tasks into chunks of max 2 hours\n```\n\n## Integration\n\nModule has no runtime executable code or internal call paths. External OpenSpec CLI / agent tools parse `openspec/config.yaml` before prompt compilation to enforce repo-specific rules on generated specifications.","documentation-specifications-openwiki":"# Documentation & Specifications — openwiki\n\n# openwiki — Code Wiki\n\nEngineering documentation for the Omnisight Platform. Markdown files in `openwiki/` serve as the canonical reference for architecture, APIs, data design, observability, quality practices, and operations.\n\n## Purpose\n\nSingle source of truth for engineers working on this repo. Covers:\n- System architecture & design decisions\n- API design & versioning strategy\n- Database schema, optimization, migrations\n- AI/RAG pipeline internals\n- Observability stack (metrics, traces, logs)\n- Testing strategy & CI/CD quality gates\n- Development workflow (OpenSpec change management)\n- Deployment & operations\n\n## Structure\n\n```\nopenwiki/\n├── INSTRUCTIONS.md              # Wiki maintenance guidelines\n├── index.md                     # Navigation hub\n├── architecture-deep-dive.md    # System architecture, modular monolith, decisions\n├── api-design-principles.md     # REST, versioning, auth, error handling\n├── ai-rag-orchestration.md      # RAG pipeline, vector search, LLM integration\n├── data-system-design.md        # PostgreSQL schema, indexes, connection pooling\n├── backend-service.md           # FastAPI app structure, modules, testing\n├── frontend-app.md              # Vue 3 + Vuetify + Vite + Pinia\n├── observability.md             # OpenTelemetry, Prometheus, Loki, Tempo, Grafana\n├── quality-engineering-qa.md    # Test layers, coverage gates, static analysis\n├── devops-deployment.md         # Docker, K8s, Helm, CI/CD\n├── development-workflow-performance.md  # OpenSpec, git workflow, metrics\n├── docker-orchestration.md      # Docker Compose for local dev\n├── quickstart.md                # One-command startup, local dev steps\n└── rag/\n    └── overview.md              # RAG pipeline component detail\n```\n\n## Key Documents Map\n\n| Need | Read |\n|------|------|\n| Start developing | `quickstart.md` |\n| Understand system shape | `architecture-deep-dive.md` |\n| Design/change an API | `api-design-principles.md` |\n| Debug DB performance | `data-system-design.md` |\n| Add AI feature | `ai-rag-orchestration.md` + `rag/overview.md` |\n| Instrument code | `observability.md` |\n| Write tests | `quality-engineering-qa.md` |\n| Deploy to prod | `devops-deployment.md` |\n| Propose a change | `development-workflow-performance.md` |\n\n## Maintenance Rules (from INSTRUCTIONS.md)\n\n- Ground pages in actual repo structure and recent code changes\n- Prefer practical navigation over generic summaries\n- Inspect git history for design rationale\n- Keep quickstart, architecture, source map, workflows, domain concepts, operations, testing, integration points current\n- Update when code changes invalidate docs\n\n## Integration Points\n\n- **OpenSpec workflow** (`.agent/workflows/`) drives change proposals → specs → implementation → archive; wiki reflects approved changes\n- **Backend modules** (`backend/app/modules/`) map to `backend-service.md` module descriptions\n- **Frontend modules** (`frontend/src/modules/`) map to `frontend-app.md`\n- **Observability configs** (`dockerdata/observability/`) map to `observability.md` dashboards\n- **Database migrations** (`backend/alembic/`) map to `data-system-design.md`\n- **K8s manifests** (`kubernetes/`) map to `devops-deployment.md`\n\n## Updating the Wiki\n\n1. Edit relevant `.md` file in `openwiki/`\n2. Cross-link from `index.md` if new page\n3. Verify links resolve (relative paths)\n4. Commit with descriptive message: `docs: update <topic> - <reason>`\n\n## Diagram: Wiki ↔ Codebase\n\n```mermaid\nflowchart LR\n    Wiki[openwiki/] -->|documents| Backend[backend/app/modules/]\n    Wiki -->|documents| Frontend[frontend/src/modules/]\n    Wiki -->|documents| Infra[dockerdata/, kubernetes/]\n    Wiki -->|documents| Specs[openspec/changes/]\n    Backend -->|generates| OpenAPI[OpenAPI spec]\n    Frontend -->|consumes| OpenAPI\n    Specs -->|drives| Wiki\n    Wiki -->|guides| Dev[Developer]\n```\n\n## Quick Reference Commands\n\n```bash\n# View wiki index\ncat openwiki/index.md\n\n# Search across wiki\ngrep -r \"vector\" openwiki/\n\n# Validate links (requires markdown-link-check)\nnpx markdown-link-check openwiki/*.md\n\n# Open in browser (if serving)\n# python -m http.server -d openwiki 8080\n```\n\n## Conventions\n\n- **File naming**: kebab-case, descriptive (`api-design-principles.md`)\n- **Front matter**: YAML with `type`, `title`, `description`, `tags` (see existing files)\n- **Mermaid**: Use sparingly (5-10 nodes max) for architecture/flow clarity\n- **Code blocks**: Annotate language; keep snippets minimal and real\n- **Cross-refs**: Relative links (`../backend-service.md#api-versioning`)\n\n## When to Update\n\n| Trigger | Action |\n|---------|--------|\n| New module added | Add to `backend-service.md` or `frontend-app.md` module list |\n| API version added | Update `api-design-principles.md` versioning table |\n| DB index added | Document in `data-system-design.md` optimization section |\n| New observability dashboard | Add to `observability.md` Grafana dashboards list |\n| Change proposal archived | Reflect outcome in relevant wiki page |\n| SLO target changed | Update `observability.md` and `quality-engineering-qa.md` tables |","documentation-specifications-prompts-md":"# Documentation & Specifications — prompts.md\n\n# Documentation & Specifications — prompts.md\n\n## Purpose\n\nprompts.md centralizes feature proposals, architectural decisions, and implementation tasks for the vue-python-demo project. It documents the roadmap across frontend (Vue 3 + Vuetify), backend (FastAPI), testing, and infrastructure. Each proposal follows a consistent structure: objective, current state, items to implement, and requirements. The module serves as both planning document and execution checklist, ensuring proposed changes are tracked, verified, and archived systematically.\n\n## Structure\n\nThe file contains proposals organized by feature area:\n\n- **Proposal 1**: Project skeleton setup (Monorepo structure, FastAPI + Vue 3 + Vuetify, Docker, .env.example, README.md)\n- **Proposal 2**: Backend core configuration (Pydantic Settings, SQLAlchemy, JWT stub, API routers with versioning, CORS, global exception handling, Alembic initialization)\n- **Proposal 3**: Add tests for all features (pytest for FastAPI, Vitest + Vue Test Utils for frontend, test DB for backend, mock for frontend)\n- **Proposal 4**: Enhance Vuetify frontend with tests (MD3 theme, DefaultLayout, Pinia stores, Dashboard page, Vitest configuration)\n- **Proposal**: fix-alembic-configuration (alembic.ini url, env.py imports, Dockerfile copy, docker-compose service name)\n- **Proposal**: add-user-authentication-with-jwt-and-cookies (User model, register/login endpoints, AuthContext/Pinia, HttpOnly cookie, route protection)\n- **Proposal**: improve-auth-error-handling-and-logging (structured logging, custom exceptions, unified error response format)\n- **Proposal**: fix-login-register-ref-and-404 (ref import fix, router routes, AuthLayout usage)\n- **Proposal**: enhance-dashboard-with-real-api-data (dashboard/stats and users endpoints, Dashboard.vue API calls, loading/error states)\n- **Proposal**: restructure-to-module-architecture (frontend/src/modules/, backend/app/modules/, tests/modules/ reorganization)\n- **Proposal**: create-admin-system-status-page-with-roles (Role model, default admin user, admin API endpoints, AdminStatus.vue, permission guard)\n- **Proposal**: fix-auto-migration-on-startup (User model verification, migration generation, automatic upgrade head on container start)\n- **Proposal**: enforce-project-venv (.venv usage, uv as sole Python tool, gitignore updates, venv check script)\n\n## Key Components\n\n### Proposal Format\n\nEach proposal follows this structure:\n\n```\n**目標**: Clear objective statement\n**目前狀態**: Current project state relevant to the proposal\n**這次要新增/優化的項目**: Specific items to implement\n**要求**: Quality and compatibility requirements\n```\n\n### Code References\n\nProposals reference actual code patterns and file paths:\n\n- `app/main.py` — FastAPI main application\n- `app/core/config.py` — Pydantic Settings configuration (DATABASE_URL, SECRET_KEY, DEBUG)\n- `app/core/database.py` — SQLAlchemy engine setup\n- `app/core/security.py` — JWT security stub\n- `app/api/v1/endpoints/health.py` — Health endpoint\n- `app/api/v1/endpoints/__init__.py` — Endpoints package init\n- `app/api/v1/__init__.py` — V1 API package init\n- `app/api/v1/router/` — Router configuration\n- `alembic/env.py` — Alembic configuration (imports settings.DATABASE_URL)\n- `alembic.ini` — Alembic initialization (sqlalchemy.url, script_location)\n- `backend/requirements.txt` — Dependencies (fastapi, uvicorn, pydantic-settings, sqlalchemy, alembic, psycopg2-binary, python-jose[cryptography], passlib[bcrypt])\n- `frontend/package.json` — Node dependencies (vue, vite, @vitejs/plugin-vue, vuetify, pinia, axios)\n- `frontend/src/App.vue` — Root Vue component\n- `frontend/src/router/index.ts` — Vue Router configuration\n- `frontend/src/services/api.ts` — Axios instance (withCredentials flag)\n- `frontend/src/stores/theme.ts` — Pinia theme store\n- `frontend/src/stores/auth.ts` — Pinia auth store\n- `docker-compose.yml` — Backend + frontend service orchestration\n- `Dockerfile` — Backend and frontend build instructions\n- `.env.example` — Environment variable examples\n\n### Execution Flows\n\nKey operational sequences documented:\n\n1. **Backend startup and verification**:\n   ```\n   podman-compose down\n   podman-compose up -d --build\n   curl http://localhost:8000/health\n   curl http://localhost:8000/api/v1/health\n   ```\n\n2. **Alembic migration execution**:\n   ```\n   podman-compose exec backend alembic current\n   podman-compose exec backend alembic upgrade head\n   ```\n\n3. **Frontend build and test**:\n   ```\n   cd frontend && npm run build\n   cd frontend && npm run test\n   ```\n\n4. **Authentication flow** (after add-user-authentication-with-jwt-and-cookies):\n   - Register: `POST /api/v1/auth/register` with JSON body {email, password, full_name}\n   - Login: `POST /api/v1/auth/login` with JSON body {email, password}\n   - Protected: `GET /api/v1/users/me` with HttpOnly cookie (withCredentials: true)\n   - CORS: Access-Control-Allow-Origin: http://localhost:5173\n\n5. **Module restructuring flow** (restructure-to-module-architecture):\n   - Scan existing frontend, backend, tests directories\n   - Reorganize into module-based structure:\n     - `frontend/src/modules/<module-name>/` (components, views, api, stores, types)\n     - `backend/app/modules/<module-name>/` (api, services, models, __init__.py)\n     - `tests/modules/<module-name>/` (test_api.py, test_services.py, etc.)\n   - Update all imports and references\n   - Run verification: `cd /code/vue-python-demo; npm run test`, `cd /code/vue-python-demo/backend; uv run pytest -v`\n\n6. **Archive flow** (after /opsx:apply):\n   - Verify all tasks complete\n   - Run `gitnexus analyze .`\n   - Run `gitnexus wiki .`\n   - Run `openwiki --update`\n   - Archive with `/opsx-archive`\n\n## Connections to Codebase\n\nprompts.md connects to the actual codebase through:\n\n1. **Direct code references**: Proposals specify exact files to create/modify with verbatim paths\n2. **Execution commands**: Verification commands developers run after `/opsx:apply`\n3. **Dependency updates**: Requirements additions to `requirements.txt` and `package.json`\n4. **Configuration changes**: Dockerfile, docker-compose.yml, vite.config.ts, tsconfig.json modifications\n5. **Test integration**: pytest conftest, test_database, test_api_health setups; vitest.config.ts with happy-dom\n6. **Knowledge management**: `gitnexus analyze .`, `gitnexus wiki .`, `openwiki --update` after changes\n7. **Architecture specs**: OpenSpec specs in `openspec/` directory updated to match implemented structure\n\nThe module ensures that every proposed change has a clear path from documentation to implementation to verification, with systematic updates to the project's knowledge graph and wiki.\n\n## Mermaid Diagram: Proposal Workflow\n\n```mermaid\nflowchart TD\n    A[Create proposal] --> B{Review proposal}\n    B -->|Approve| C[Generate design + tasks]\n    C --> D[/opsx:apply]\n    D --> E[Verify execution]\n    E --> F{All complete?}\n    F -->|Yes| G[/opsx-archive]\n    F -->|No| C\n```\n\n## How to Use This Document\n\nDevelopers should
